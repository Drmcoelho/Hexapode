<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img"><title>Variação do volume sistólico aplicada</title><desc>Oscilação respiratória do volume sistólico.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="210" fill="#0F2E4B"/><text x="90" y="85" font-family="Arial" font-size="28" font-weight="700" fill="#fff">HEXÁPODE · HEMODINÂMICA APLICADA</text><text x="90" y="165" font-family="Georgia" font-size="56" fill="#fff">Variação do volume sistólico aplicada</text><text x="1490" y="85" text-anchor="end" font-family="Arial" font-size="25" fill="#7AD3D8">HEX-X053-528</text><rect x="80" y="250" width="1040" height="720" rx="28" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><path d="M200 790 C290 770 310 430 420 430 C530 430 540 790 650 790 C760 790 770 500 880 500 C970 500 990 790 1030 790" fill="none" stroke="#1696A3" stroke-width="14"/><path d="M300 360 C220 420 220 650 330 720 M720 360 C800 420 800 650 690 720" fill="none" stroke="#D65A4A" stroke-width="11"/><text x="360" y="350" font-family="Arial" font-size="30" fill="#1696A3">VSmáx</text><text x="820" y="455" font-family="Arial" font-size="30" fill="#1696A3">VSmín</text><rect x="1160" y="250" width="360" height="720" rx="28" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="1200" y="330" font-family="Arial" font-size="28" font-weight="700" fill="#1696A3">APLICAÇÃO</text><text x="1200" y="410" font-family="Arial" font-size="20" fill="#2B2E34">VVS = (VSmáx−VSmín) ÷ VSmédio × 100</text><text x="1200" y="520" font-family="Arial" font-size="23" fill="#6A727A">• oscilação respiratória</text><text x="1200" y="570" font-family="Arial" font-size="23" fill="#6A727A">• volume sistólico</text><text x="1200" y="620" font-family="Arial" font-size="23" fill="#6A727A">• contexto e limites</text><text x="90" y="1090" font-family="Arial" font-size="22" fill="#6A727A">Camada aplicada · vínculo G013 / A033 · uso transversal</text></svg>