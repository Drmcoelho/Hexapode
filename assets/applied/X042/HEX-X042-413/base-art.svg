<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2F5B"/><text x="60" y="75" font-family="Arial" font-size="36" fill="white">HEXÁPODE · CLÍNICA APLICADA II</text><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="54" fill="#0B2F5B">Exacerbação de DPOC</text><g transform="translate(210 330)" fill="#E9A9A5" stroke="#0B2F5B" stroke-width="8"><path d="M390 40v190C300 130 120 200 100 410c-10 130 110 170 230 70 55-50 55-170 55-250"/><path d="M405 230c0 80 0 200 55 250 120 100 240 60 230-70-20-210-200-280-290-180"/></g><g fill="#9FC9E6" stroke="#2D6FB7" stroke-width="4"><circle cx="330" cy="620" r="55"/><circle cx="450" cy="700" r="65"/><circle cx="760" cy="610" r="60"/><circle cx="850" cy="705" r="70"/></g><g font-family="Arial" font-size="34" fill="#2C3440"><text x="110" y="980">1. Confirmar piora de dispneia, escarro e sinais de infecção</text><text x="110" y="1090">2. Titular O₂ com alvo individualizado e atenção à hipercapnia</text><text x="110" y="1200">3. Broncodilatadores + corticoide; antibiótico quando indicado</text><text x="110" y="1310">4. VNI se acidose respiratória e trabalho respiratório elevado</text></g><rect y="1490" width="1200" height="110" fill="#0B2F5B"/><text x="60" y="1555" font-family="Arial" font-size="28" fill="white">HEX-X042-413 · fonte G002-013</text></svg>