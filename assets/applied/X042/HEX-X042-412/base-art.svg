<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2F5B"/><text x="60" y="75" font-family="Arial" font-size="36" fill="white">HEXÁPODE · CLÍNICA APLICADA II</text><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="56" fill="#0B2F5B">Asma aguda</text><g transform="translate(150 340)"><circle cx="270" cy="240" r="150" fill="#F2B7B2" stroke="#0B2F5B" stroke-width="8"/><circle cx="270" cy="240" r="48" fill="#7B2D26"/><path d="M500 240h120" stroke="#0B2F5B" stroke-width="10"/><circle cx="790" cy="240" r="150" fill="#F2B7B2" stroke="#0B2F5B" stroke-width="8"/><circle cx="790" cy="240" r="100" fill="#BFE6E2"/><text x="175" y="450" font-family="Arial" font-size="34">broncoespasmo</text><text x="675" y="450" font-family="Arial" font-size="34">broncodilatação</text></g><g font-family="Arial" font-size="34" fill="#2C3440"><text x="110" y="970">1. Avaliar fala, FR, SpO₂, ausculta e PFE quando possível</text><text x="110" y="1080">2. Beta₂-agonista inalatório repetido + corticoide precoce</text><text x="110" y="1190">3. Associar ipratrópio nos casos moderados ou graves</text><text x="110" y="1300">4. Exaustão ou silêncio auscultatório exigem escalonamento</text></g><rect y="1490" width="1200" height="110" fill="#0B2F5B"/><text x="60" y="1555" font-family="Arial" font-size="28" fill="white">HEX-X042-412 · fonte G002-012</text></svg>