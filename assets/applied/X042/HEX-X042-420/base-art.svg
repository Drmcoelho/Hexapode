<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2F5B"/><text x="60" y="75" font-family="Arial" font-size="36" fill="white">HEXÁPODE · CLÍNICA APLICADA II</text><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="54" fill="#0B2F5B">Intoxicação exógena</text><rect x="390" y="330" width="420" height="600" rx="60" fill="#D6E6E8" stroke="#0B2F5B" stroke-width="10"/><rect x="485" y="260" width="230" height="120" rx="30" fill="#2C3440"/><circle cx="600" cy="610" r="140" fill="none" stroke="#C94C4C" stroke-width="14"/><path d="M510 520l180 180M690 520L510 700" stroke="#C94C4C" stroke-width="24"/><g font-family="Arial" font-size="34" fill="#2C3440"><text x="110" y="1030">1. Garantir ABCDE, glicemia, temperatura e ECG</text><text x="110" y="1140">2. Identificar agente, dose, via e tempo de exposição</text><text x="110" y="1250">3. Descontaminar apenas quando benefício superar risco</text><text x="110" y="1360">4. Usar antídoto específico quando indicado e manter suporte</text></g><rect y="1490" width="1200" height="110" fill="#0B2F5B"/><text x="60" y="1555" font-family="Arial" font-size="28" fill="white">HEX-X042-420 · fonte G002-020</text></svg>