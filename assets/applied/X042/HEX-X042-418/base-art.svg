<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2F5B"/><text x="60" y="75" font-family="Arial" font-size="36" fill="white">HEXÁPODE · CLÍNICA APLICADA II</text><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="54" fill="#0B2F5B">Sangramento gastrointestinal</text><path d="M430 360c140-70 300 20 310 150 10 120-90 190-190 150-80-30-130-120-120-300z" fill="#D98C70" stroke="#0B2F5B" stroke-width="8"/><path d="M550 660c-10 120 100 120 150 80" fill="none" stroke="#E8B39E" stroke-width="30"/><path d="M280 850c180-120 360 140 560 0" fill="none" stroke="#E6A88F" stroke-width="35"/><circle cx="470" cy="470" r="24" fill="#C94C4C"/><path d="M470 495l70 90" stroke="#C94C4C" stroke-width="10"/><g font-family="Arial" font-size="34" fill="#2C3440"><text x="110" y="1030">1. Diferenciar hematêmese, melena e hematoquezia</text><text x="110" y="1140">2. Avaliar choque, hemoglobina seriada e comorbidades</text><text x="110" y="1250">3. Acessos, tipagem/provas e ressuscitação individualizada</text><text x="110" y="1360">4. Estratificar necessidade e tempo de endoscopia</text></g><rect y="1490" width="1200" height="110" fill="#0B2F5B"/><text x="60" y="1555" font-family="Arial" font-size="28" fill="white">HEX-X042-418 · fonte G002-018</text></svg>