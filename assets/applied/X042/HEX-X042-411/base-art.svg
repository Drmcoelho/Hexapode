<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Insuficiência respiratória aguda</title><desc id="d">Avaliação, oxigenação, escalonamento e reavaliação.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2F5B"/><text x="60" y="75" font-family="Arial" font-size="36" fill="white">HEXÁPODE · CLÍNICA APLICADA II</text><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="54" fill="#0B2F5B">Insuficiência respiratória aguda</text><g transform="translate(210 320)" fill="#F2B7B2" stroke="#0B2F5B" stroke-width="8"><path d="M390 50v170C300 140 150 200 120 380c-20 120 80 170 190 90 70-50 75-150 75-250"/><path d="M405 220c0 100 5 200 75 250 110 80 210 30 190-90-30-180-180-240-270-160"/></g><g font-family="Arial" font-size="34" fill="#2C3440"><text x="110" y="970">1. Reconhecer esforço respiratório e alteração de consciência</text><text x="110" y="1080">2. Confirmar hipoxemia com oximetria ou gasometria</text><text x="110" y="1190">3. Ofertar oxigênio e titular para alvo clínico</text><text x="110" y="1300">4. Escalonar: cânula → máscara → alto fluxo/VNI → IOT</text></g><rect y="1490" width="1200" height="110" fill="#0B2F5B"/><text x="60" y="1555" font-family="Arial" font-size="28" fill="white">HEX-X042-411 · fonte G002-011 · revisão clínica pendente</text></svg>