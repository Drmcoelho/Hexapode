<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2F5B"/><text x="60" y="75" font-family="Arial" font-size="36" fill="white">HEXÁPODE · CLÍNICA APLICADA II</text><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="52" fill="#0B2F5B">Pneumonia adquirida na comunidade</text><g transform="translate(210 330)" fill="#F3B5B0" stroke="#0B2F5B" stroke-width="8"><path d="M390 40v190C300 140 135 205 115 390c-15 125 95 170 205 80 60-50 65-160 65-240"/><path d="M405 230c0 80 5 190 65 240 110 90 220 45 205-80-20-185-185-250-275-160"/></g><path d="M620 570c100-80 210-20 245 125-100 85-205 70-260 0z" fill="#C94C4C" opacity=".75"/><g font-family="Arial" font-size="34" fill="#2C3440"><text x="110" y="980">1. Confirmar síndrome respiratória e imagem compatível</text><text x="110" y="1090">2. Estratificar gravidade, oxigenação e disfunção orgânica</text><text x="110" y="1200">3. Colher exames sem atrasar antibiótico quando indicado</text><text x="110" y="1310">4. Reavaliar resposta, derrame, abscesso e sepse</text></g><rect y="1490" width="1200" height="110" fill="#0B2F5B"/><text x="60" y="1555" font-family="Arial" font-size="28" fill="white">HEX-X042-414 · fonte G002-014</text></svg>