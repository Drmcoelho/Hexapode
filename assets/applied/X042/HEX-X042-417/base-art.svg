<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2F5B"/><text x="60" y="75" font-family="Arial" font-size="36" fill="white">HEXÁPODE · CLÍNICA APLICADA II</text><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="54" fill="#0B2F5B">Dor abdominal aguda</text><path d="M360 340c-90 110-70 270-10 390 45 90 40 150 20 220h460c-20-70-25-130 20-220 60-120 80-280-10-390z" fill="#F4D2BE" stroke="#0B2F5B" stroke-width="8"/><circle cx="700" cy="690" r="45" fill="#C94C4C"/><path d="M700 645v-180M610 690h180" stroke="#2D6FB7" stroke-width="6"/><g font-family="Arial" font-size="34" fill="#2C3440"><text x="110" y="1030">1. Caracterizar início, localização, migração e sintomas associados</text><text x="110" y="1140">2. Procurar peritonismo, choque, hérnia e sinais vasculares</text><text x="110" y="1250">3. Solicitar testes dirigidos pela hipótese e pelo contexto</text><text x="110" y="1360">4. Tratar dor enquanto se investiga; analgesia não mascara diagnóstico</text></g><rect y="1490" width="1200" height="110" fill="#0B2F5B"/><text x="60" y="1555" font-family="Arial" font-size="28" fill="white">HEX-X042-417 · fonte G002-017</text></svg>