<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>Meningite aguda</title><desc>Inflamação meníngea, sinais de alarme, coleta e antibiótico precoce.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0B2E59"/><text x="55" y="72" font-size="34" font-family="Arial" font-weight="700" fill="white">HEXÁPODE · CLÍNICA APLICADA III</text><text x="1140" y="72" text-anchor="end" font-size="28" fill="#E3A12B">HEX-X043-428</text><text x="600" y="190" text-anchor="middle" font-size="54" font-weight="700" fill="#0B2E59">MENINGITE AGUDA</text><path d="M230 590q180-350 360 0" fill="#F1C7B8" stroke="#0B2E59" stroke-width="8"/><path d="M290 535q110-170 220 0" fill="none" stroke="#D94A3A" stroke-width="16"/><circle cx="340" cy="450" r="24" fill="#7B4BA8"/><circle cx="400" cy="420" r="24" fill="#7B4BA8"/><circle cx="460" cy="450" r="24" fill="#7B4BA8"/><rect x="640" y="360" width="250" height="170" rx="24" fill="#EEF3F7" stroke="#0E8A83" stroke-width="8"/><text x="765" y="430" text-anchor="middle" font-size="34" font-weight="700">LCR</text><text x="765" y="485" text-anchor="middle" font-size="28">cultura + PCR</text><text x="70" y="850" font-size="32" font-weight="700" fill="#0E8A83">SUSPEITA CLÍNICA → ANTIBIÓTICO PRECOCE → DIAGNÓSTICO ETIOLÓGICO</text><rect x="70" y="920" width="1060" height="300" rx="24" fill="white" stroke="#DCE6ED" stroke-width="6"/><text x="110" y="995" font-size="32" font-weight="700" fill="#0B2E59">Aplicação clínica</text><text x="110" y="1070" font-size="29">1. Reconhecer febre, rigidez, alteração mental e púrpura.</text><text x="110" y="1140" font-size="29">2. Colher culturas sem atrasar antimicrobianos.</text><text x="110" y="1210" font-size="29">3. Definir segurança e momento da punção lombar.</text><text x="70" y="1490" font-size="27" fill="#0B2E59">Fonte canônica · revisão clínica pendente</text></svg>