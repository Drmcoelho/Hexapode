<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>UTI: pacote de medidas essenciais</title><desc>Bundle diário de segurança e suporte multissistêmico.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0B2E59"/><text x="55" y="72" font-size="34" font-family="Arial" font-weight="700" fill="white">HEXÁPODE · CLÍNICA APLICADA III</text><text x="1140" y="72" text-anchor="end" font-size="28" fill="#E3A12B">HEX-X043-430</text><text x="600" y="190" text-anchor="middle" font-size="54" font-weight="700" fill="#0B2E59">UTI: PACOTE DE MEDIDAS ESSENCIAIS</text><circle cx="400" cy="460" r="100" fill="#BFD8EA" stroke="#0B2E59" stroke-width="8"/><text x="400" y="480" text-anchor="middle" font-size="54" font-weight="700" fill="#0B2E59">UTI</text><circle cx="630" cy="460" r="55" fill="#2E8B57"/><circle cx="515" cy="655" r="55" fill="#0E8A83"/><circle cx="285" cy="655" r="55" fill="#E3A12B"/><circle cx="170" cy="460" r="55" fill="#D94A3A"/><circle cx="285" cy="265" r="55" fill="#7B4BA8"/><circle cx="515" cy="265" r="55" fill="#BFD8EA"/><text x="70" y="850" font-size="32" font-weight="700" fill="#0E8A83">SEGURANÇA DIÁRIA + PREVENÇÃO + SUPORTE MULTISSISTÊMICO</text><rect x="70" y="920" width="1060" height="300" rx="24" fill="white" stroke="#DCE6ED" stroke-width="6"/><text x="110" y="995" font-size="32" font-weight="700" fill="#0B2E59">Aplicação clínica</text><text x="110" y="1070" font-size="29">1. Rever sedação, delirium, dor e possibilidade de mobilização.</text><text x="110" y="1140" font-size="29">2. Aplicar ventilação protetora e profilaxias indicadas.</text><text x="110" y="1210" font-size="29">3. Revisar dispositivos, nutrição, glicemia e metas do dia.</text><text x="70" y="1490" font-size="27" fill="#0B2E59">Fonte canônica · revisão clínica pendente</text></svg>