<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>IAM com supra de ST</title><desc>Oclusão coronariana, elevação de ST e reperfusão precoce.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0B2E59"/><text x="55" y="72" font-size="34" font-family="Arial" font-weight="700" fill="white">HEXÁPODE · CLÍNICA APLICADA III</text><text x="1140" y="72" text-anchor="end" font-size="28" fill="#E3A12B">HEX-X043-421</text><text x="600" y="190" text-anchor="middle" font-size="54" font-weight="700" fill="#0B2E59">IAM COM SUPRA DE ST</text><path d="M280 380c90-150 280-100 300 70s-160 260-280 150-110-120-20-220z" fill="#F3A39A" stroke="#0B2E59" stroke-width="8"/><path d="M420 350l-60 130h80l-50 130" fill="none" stroke="#D94A3A" stroke-width="20"/><polyline points="180,730 260,730 300,670 340,790 390,630 450,730 610,730" fill="none" stroke="#0B2E59" stroke-width="11"/><text x="70" y="860" font-size="32" font-weight="700" fill="#0E8A83">OCLUSÃO → ISQUEMIA → NECROSE</text><rect x="70" y="920" width="1060" height="300" rx="24" fill="white" stroke="#DCE6ED" stroke-width="6"/><text x="110" y="995" font-size="32" font-weight="700" fill="#0B2E59">Aplicação clínica</text><text x="110" y="1070" font-size="29">1. Reconhecer dor isquêmica e supra persistente.</text><text x="110" y="1140" font-size="29">2. Ativar reperfusão sem aguardar marcadores.</text><text x="110" y="1210" font-size="29">3. Reavaliar ritmo, dor, ST e perfusão.</text><text x="70" y="1490" font-size="27" fill="#0B2E59">Fonte canônica · revisão clínica pendente</text></svg>