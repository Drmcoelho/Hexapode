<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>Abdome agudo inflamatório</title><desc>Inflamação visceral, peritonite e decisão cirúrgica.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0B2E59"/><text x="55" y="72" font-size="34" font-family="Arial" font-weight="700" fill="white">HEXÁPODE · CLÍNICA APLICADA III</text><text x="1140" y="72" text-anchor="end" font-size="28" fill="#E3A12B">HEX-X043-429</text><text x="600" y="190" text-anchor="middle" font-size="54" font-weight="700" fill="#0B2E59">ABDOME AGUDO INFLAMATÓRIO</text><path d="M230 310q170-100 340 0l-30 300q-140 80-280 0z" fill="#F6C8A9" stroke="#0B2E59" stroke-width="8"/><circle cx="405" cy="470" r="68" fill="#D94A3A"/><path d="M475 450L650 380" stroke="#D94A3A" stroke-width="14"/><rect x="650" y="320" width="250" height="130" rx="22" fill="#FFF4D6" stroke="#E3A12B" stroke-width="8"/><text x="775" y="400" text-anchor="middle" font-size="36" font-weight="700">PERITONITE</text><text x="70" y="850" font-size="32" font-weight="700" fill="#0E8A83">DOR VISCERAL → IRRITAÇÃO PERITONEAL → CONTROLE DE FOCO</text><rect x="70" y="920" width="1060" height="300" rx="24" fill="white" stroke="#DCE6ED" stroke-width="6"/><text x="110" y="995" font-size="32" font-weight="700" fill="#0B2E59">Aplicação clínica</text><text x="110" y="1070" font-size="29">1. Identificar instabilidade, peritonite e obstrução.</text><text x="110" y="1140" font-size="29">2. Usar laboratório e imagem conforme hipótese e risco.</text><text x="110" y="1210" font-size="29">3. Analgesia, ressuscitação e controle de foco sem atraso.</text><text x="70" y="1490" font-size="27" fill="#0B2E59">Fonte canônica · revisão clínica pendente</text></svg>