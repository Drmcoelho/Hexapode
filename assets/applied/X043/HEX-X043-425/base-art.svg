<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>TVP e embolia pulmonar</title><desc>Formação do trombo venoso, embolização e repercussão pulmonar.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0B2E59"/><text x="55" y="72" font-size="34" font-family="Arial" font-weight="700" fill="white">HEXÁPODE · CLÍNICA APLICADA III</text><text x="1140" y="72" text-anchor="end" font-size="28" fill="#E3A12B">HEX-X043-425</text><text x="600" y="190" text-anchor="middle" font-size="54" font-weight="700" fill="#0B2E59">TVP E EMBOLIA PULMONAR</text><path d="M260 300q90 120 45 330m210-330q-90 120-45 330" fill="none" stroke="#0B2E59" stroke-width="18"/><circle cx="320" cy="535" r="38" fill="#D94A3A"/><path d="M360 530C500 500 600 430 760 350" fill="none" stroke="#D94A3A" stroke-width="14"/><path d="M760 300q100 40 120 160-20 120-120 160-100-40-120-160 20-120 120-160z" fill="#F3A39A" stroke="#0B2E59" stroke-width="8"/><text x="70" y="850" font-size="32" font-weight="700" fill="#0E8A83">TRÍADE DE VIRCHOW → EMBOLIZAÇÃO → SOBRECARGA DO VD</text><rect x="70" y="920" width="1060" height="300" rx="24" fill="white" stroke="#DCE6ED" stroke-width="6"/><text x="110" y="995" font-size="32" font-weight="700" fill="#0B2E59">Aplicação clínica</text><text x="110" y="1070" font-size="29">1. Estimar probabilidade pré-teste e estabilidade hemodinâmica.</text><text x="110" y="1140" font-size="29">2. Escolher dímero-D, imagem ou reperfusão conforme risco.</text><text x="110" y="1210" font-size="29">3. Anticoagular quando indicado e vigiar disfunção do VD.</text><text x="70" y="1490" font-size="27" fill="#0B2E59">Fonte canônica · revisão clínica pendente</text></svg>