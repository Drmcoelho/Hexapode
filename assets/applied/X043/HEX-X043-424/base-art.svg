<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>Emergências diabéticas</title><desc>Comparação entre cetoacidose diabética e estado hiperosmolar.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0B2E59"/><text x="55" y="72" font-size="34" font-family="Arial" font-weight="700" fill="white">HEXÁPODE · CLÍNICA APLICADA III</text><text x="1140" y="72" text-anchor="end" font-size="28" fill="#E3A12B">HEX-X043-424</text><text x="600" y="190" text-anchor="middle" font-size="54" font-weight="700" fill="#0B2E59">EMERGÊNCIAS DIABÉTICAS</text><line x1="600" y1="310" x2="600" y2="700" stroke="#0B2E59" stroke-width="12"/><path d="M210 600L390 300l180 300z" fill="#FAD2C8" stroke="#D94A3A" stroke-width="8"/><path d="M630 600L810 300l180 300z" fill="#D6EEF0" stroke="#0E8A83" stroke-width="8"/><text x="390" y="510" text-anchor="middle" font-size="58" font-weight="700" fill="#D94A3A">CAD</text><text x="810" y="510" text-anchor="middle" font-size="58" font-weight="700" fill="#0E8A83">EHH</text><text x="70" y="850" font-size="32" font-weight="700" fill="#0E8A83">CETONAS E ACIDOSE × HIPEROSMOLARIDADE E DESIDRATAÇÃO</text><rect x="70" y="920" width="1060" height="300" rx="24" fill="white" stroke="#DCE6ED" stroke-width="6"/><text x="110" y="995" font-size="32" font-weight="700" fill="#0B2E59">Aplicação clínica</text><text x="110" y="1070" font-size="29">1. Confirmar glicose, cetonas, pH, sódio corrigido e osmolaridade.</text><text x="110" y="1140" font-size="29">2. Repor volume, potássio e insulina na sequência correta.</text><text x="110" y="1210" font-size="29">3. Monitorar queda da glicose, ânion gap e estado neurológico.</text><text x="70" y="1490" font-size="27" fill="#0B2E59">Fonte canônica · revisão clínica pendente</text></svg>