<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>Insuficiência cardíaca aguda descompensada</title><desc>Congestão pulmonar, baixo débito e prioridades terapêuticas.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0B2E59"/><text x="55" y="72" font-size="34" font-family="Arial" font-weight="700" fill="white">HEXÁPODE · CLÍNICA APLICADA III</text><text x="1140" y="72" text-anchor="end" font-size="28" fill="#E3A12B">HEX-X043-422</text><text x="600" y="190" text-anchor="middle" font-size="48" font-weight="700" fill="#0B2E59">INSUFICIÊNCIA CARDÍACA AGUDA</text><ellipse cx="350" cy="470" rx="120" ry="180" fill="#F3A39A" stroke="#0B2E59" stroke-width="8"/><ellipse cx="610" cy="470" rx="120" ry="180" fill="#F3A39A" stroke="#0B2E59" stroke-width="8"/><circle cx="350" cy="480" r="55" fill="#BFD8EA"/><circle cx="610" cy="480" r="55" fill="#BFD8EA"/><path d="M280 650q200 120 400 0" fill="none" stroke="#0E8A83" stroke-width="18"/><text x="70" y="850" font-size="32" font-weight="700" fill="#0E8A83">CONGESTÃO + BAIXO DÉBITO</text><rect x="70" y="920" width="1060" height="300" rx="24" fill="white" stroke="#DCE6ED" stroke-width="6"/><text x="110" y="995" font-size="32" font-weight="700" fill="#0B2E59">Aplicação clínica</text><text x="110" y="1070" font-size="29">1. Fenotipar congestão e perfusão.</text><text x="110" y="1140" font-size="29">2. Oxigenar, descongestionar e tratar o precipitante.</text><text x="110" y="1210" font-size="29">3. Reavaliar diurese, esforço respiratório e pressão.</text><text x="70" y="1490" font-size="27" fill="#0B2E59">Fonte canônica · revisão clínica pendente</text></svg>