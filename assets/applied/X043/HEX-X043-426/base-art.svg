<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>Asfixia e parada cardiorrespiratória</title><desc>Reconhecimento, RCP, desfibrilação e cuidados pós-PCR.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0B2E59"/><text x="55" y="72" font-size="34" font-family="Arial" font-weight="700" fill="white">HEXÁPODE · CLÍNICA APLICADA III</text><text x="1140" y="72" text-anchor="end" font-size="28" fill="#E3A12B">HEX-X043-426</text><text x="600" y="190" text-anchor="middle" font-size="52" font-weight="700" fill="#0B2E59">ASFIXIA E PARADA CARDIORRESPIRATÓRIA</text><circle cx="400" cy="470" r="125" fill="#EEF3F7" stroke="#0B2E59" stroke-width="8"/><path d="M340 405l120 130m0-130L340 535" stroke="#D94A3A" stroke-width="22"/><path d="M235 470a165 165 0 0 1 165-165M565 470a165 165 0 0 1-165 165" fill="none" stroke="#2E8B57" stroke-width="16"/><rect x="650" y="360" width="210" height="220" rx="26" fill="#FFF4D6" stroke="#E3A12B" stroke-width="8"/><text x="755" y="450" text-anchor="middle" font-size="48" font-weight="700">DEA</text><text x="755" y="520" text-anchor="middle" font-size="34">RCP</text><text x="70" y="850" font-size="32" font-weight="700" fill="#0E8A83">RECONHECER → RCP DE ALTA QUALIDADE → RITMO → PÓS-PCR</text><rect x="70" y="920" width="1060" height="300" rx="24" fill="white" stroke="#DCE6ED" stroke-width="6"/><text x="110" y="995" font-size="32" font-weight="700" fill="#0B2E59">Aplicação clínica</text><text x="110" y="1070" font-size="29">1. Iniciar compressões e ventilação adequadas imediatamente.</text><text x="110" y="1140" font-size="29">2. Desfibrilar ritmos chocáveis e tratar causas reversíveis.</text><text x="110" y="1210" font-size="29">3. Após RCE, proteger cérebro, perfusão e oxigenação.</text><text x="70" y="1490" font-size="27" fill="#0B2E59">Fonte canônica · revisão clínica pendente</text></svg>