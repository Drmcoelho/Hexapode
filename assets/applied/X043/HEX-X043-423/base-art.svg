<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>Crise hipertensiva</title><desc>Urgência versus emergência hipertensiva e lesão de órgão-alvo.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0B2E59"/><text x="55" y="72" font-size="34" font-family="Arial" font-weight="700" fill="white">HEXÁPODE · CLÍNICA APLICADA III</text><text x="1140" y="72" text-anchor="end" font-size="28" fill="#E3A12B">HEX-X043-423</text><text x="600" y="190" text-anchor="middle" font-size="54" font-weight="700" fill="#0B2E59">CRISE HIPERTENSIVA</text><circle cx="370" cy="470" r="170" fill="#F1C7B8" stroke="#0B2E59" stroke-width="8"/><path d="M370 310c-70 80-60 180 0 200s70 100 0 130" fill="none" stroke="#D94A3A" stroke-width="18"/><rect x="620" y="330" width="210" height="250" rx="28" fill="#EEF3F7" stroke="#0B2E59" stroke-width="8"/><text x="725" y="430" text-anchor="middle" font-size="58" font-weight="700" fill="#D94A3A">220</text><text x="725" y="510" text-anchor="middle" font-size="48" fill="#0B2E59">120</text><text x="70" y="850" font-size="32" font-weight="700" fill="#0E8A83">PRESSÃO ALTA ≠ EMERGÊNCIA SEM LESÃO AGUDA</text><rect x="70" y="920" width="1060" height="300" rx="24" fill="white" stroke="#DCE6ED" stroke-width="6"/><text x="110" y="995" font-size="32" font-weight="700" fill="#0B2E59">Aplicação clínica</text><text x="110" y="1070" font-size="29">1. Procurar encefalopatia, SCA, EAP, dissecção e IRA.</text><text x="110" y="1140" font-size="29">2. Reduzir pressão de forma titulada quando houver dano agudo.</text><text x="110" y="1210" font-size="29">3. Evitar normalização abrupta e hipoperfusão.</text><text x="70" y="1490" font-size="27" fill="#0B2E59">Fonte canônica · revisão clínica pendente</text></svg>