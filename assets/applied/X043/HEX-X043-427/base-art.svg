<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>AVC isquêmico agudo</title><desc>Oclusão arterial, penumbra, janela terapêutica e reperfusão.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0B2E59"/><text x="55" y="72" font-size="34" font-family="Arial" font-weight="700" fill="white">HEXÁPODE · CLÍNICA APLICADA III</text><text x="1140" y="72" text-anchor="end" font-size="28" fill="#E3A12B">HEX-X043-427</text><text x="600" y="190" text-anchor="middle" font-size="54" font-weight="700" fill="#0B2E59">AVC ISQUÊMICO AGUDO</text><path d="M230 560q170-330 360 0" fill="#F1C7B8" stroke="#0B2E59" stroke-width="8"/><path d="M270 550h110" stroke="#D94A3A" stroke-width="18"/><circle cx="270" cy="550" r="24" fill="#D94A3A"/><path d="M290 540q80-50 125-130" fill="none" stroke="#D94A3A" stroke-width="10"/><circle cx="430" cy="430" r="70" fill="#B9C7E8" opacity=".75"/><circle cx="430" cy="430" r="34" fill="#6C78A8"/><text x="70" y="850" font-size="32" font-weight="700" fill="#0E8A83">NÚCLEO INFARTADO + PENUMBRA SALVÁVEL</text><rect x="70" y="920" width="1060" height="300" rx="24" fill="white" stroke="#DCE6ED" stroke-width="6"/><text x="110" y="995" font-size="32" font-weight="700" fill="#0B2E59">Aplicação clínica</text><text x="110" y="1070" font-size="29">1. Registrar hora de início e déficit incapacitante.</text><text x="110" y="1140" font-size="29">2. Excluir hemorragia e avaliar trombólise/trombectomia.</text><text x="110" y="1210" font-size="29">3. Controlar fisiologia sem atrasar reperfusão.</text><text x="70" y="1490" font-size="27" fill="#0B2E59">Fonte canônica · revisão clínica pendente</text></svg>