<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Lesão renal aguda: abordagem aplicada</title><desc id="d">Fluxograma visual para reconhecer lesão renal aguda, revisar creatinina e diurese, buscar causas pré-renais, renais e pós-renais e definir monitorização.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><text x="70" y="90" font-family="Arial" font-size="24" fill="#1696A3">HEXÁPODE · NEFROLOGIA APLICADA</text><text x="70" y="170" font-family="Georgia" font-size="54" fill="#2B2E34">Lesão renal aguda: abordagem aplicada</text><rect x="70" y="270" width="1460" height="600" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><g font-family="Arial" font-size="22" fill="#2B2E34" text-anchor="middle"><circle cx="200" cy="560" r="70" fill="#FFFDF8" stroke="#1696A3" stroke-width="9"/><text x="200" y="568">creatinina</text><circle cx="500" cy="560" r="70" fill="#FFFDF8" stroke="#1D4E7A" stroke-width="9"/><text x="500" y="568">diurese</text><circle cx="800" cy="560" r="70" fill="#FFFDF8" stroke="#D39A2E" stroke-width="9"/><text x="800" y="568">pré-renal</text><circle cx="1100" cy="560" r="70" fill="#FFFDF8" stroke="#C45A3C" stroke-width="9"/><text x="1100" y="568">renal</text><circle cx="1400" cy="560" r="70" fill="#FFFDF8" stroke="#2E7D69" stroke-width="9"/><text x="1400" y="568">pós-renal</text></g><g stroke="#1D4E7A" stroke-width="8" fill="#1D4E7A"><path d="M280 560h130"/><path d="M410 560l-26-16v32z"/><path d="M580 560h130"/><path d="M710 560l-26-16v32z"/><path d="M880 560h130"/><path d="M1010 560l-26-16v32z"/><path d="M1180 560h130"/><path d="M1310 560l-26-16v32z"/></g><rect x="110" y="930" width="1380" height="120" rx="20" fill="#E8E1D1"/><text x="140" y="995" font-family="Arial" font-size="22" fill="#2B2E34">Reconhecer, classificar a causa, corrigir fatores reversíveis e acompanhar tendência.</text><text x="70" y="1140" font-family="Arial" font-size="20" fill="#6A727A">HEX-X056-551 · X056 · G0