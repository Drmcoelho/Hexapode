<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">PRVC aplicado</title><desc id="d">Modo alvo de volume com ajuste automático da pressão inspiratória ciclo a ciclo.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="70" y="95" font-family="Arial" font-size="52" font-weight="700" fill="white">PRVC APLICADO</text><g font-family="Arial"><text x="70" y="215" font-size="31" fill="#12324A">O ventilador busca um VT-alvo usando a menor pressão necessária.</text><rect x="70" y="290" width="1060" height="420" rx="28" fill="white" stroke="#0E8C8C" stroke-width="5"/><text x="110" y="355" font-size="34" font-weight="700" fill="#073B66">Controle adaptativo ciclo a ciclo</text><rect x="120" y="410" width="240" height="130" rx="20" fill="#D9F2EF"/><text x="165" y="465" font-size="28" fill="#075B55">VT MEDIDO</text><text x="185" y="510" font-size="32" fill="#075B55">420 mL</text><path d="M390 475 H560" stroke="#F28C28" stroke-width="14" marker-end="url(#a)"/><rect x="590" y="400" width="410" height="155" rx="20" fill="#E8F0F7"/><text x="635" y="450" font-size="28" fill="#073B66">VT alvo 450 mL</text><text x="635" y="495" font-size="28" fill="#12324A">→ aumenta ΔP no próximo ciclo</text><rect x="70" y="780" width="1060" height="500" rx="28" fill="white" stroke="#B9C9D6" stroke-width="4"/><text x="110" y="845" font-size="34" font-weight="700" fill="#073B66">Resposta esperada</text><line x1="150" y1="1110" x2="1050" y2="1110" stroke="#567"/><path d="M150 1060 L300 1010 L450 960 L600 920 L750 900 L900 900 L1050 900" fill="none" stroke="#0E8C8C" stroke-width="10"/><text x="160" y="1040" font-size="26" fill="#075B55">VT converge para o alvo</text><path d="M150 900 L300 930 L450 950 L600 970 L750 980 L900 980 L1050 980" fill="none" stroke="#F28C28" stroke-width="10"/><text x="160" y="875" font-size="26" fill="#7A4211">pressão ajustada</text><rect x="70" y="1340" width="1060" height="180" rx="24" fill="#FFF0D9"/><text x="110" y="1400" font-size="30" font-weight="700" fill="#7A4211">Cuidado</text><text x="110" y="1450" font-size="27" fill="#12324A">Mudanças rápidas de esforço ou mecânica podem gerar variação transitória do VT.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><text x="70" y="1570" font-family="Arial" font-size="24" fill="#567">HEX-X048-475 · Hexápode</text></svg>