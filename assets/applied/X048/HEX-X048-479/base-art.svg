<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">HFOV aplicado</title><desc id="d">Ventilação oscilatória de alta frequência com pressão média sustentada, pequenos volumes e frequência elevada.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="70" y="95" font-family="Arial" font-size="52" font-weight="700" fill="white">HFOV APLICADO</text><g font-family="Arial"><text x="70" y="215" font-size="31" fill="#12324A">Pressão média recruta; oscilações rápidas promovem troca gasosa.</text><rect x="70" y="290" width="1060" height="620" rx="28" fill="white" stroke="#0E8C8C" stroke-width="5"/><text x="110" y="355" font-size="34" font-weight="700" fill="#073B66">Pressão oscilatória ao redor da MAP</text><line x1="140" y1="610" x2="1060" y2="610" stroke="#F28C28" stroke-width="7" stroke-dasharray="16 10"/><text x="880" y="590" font-size="27" fill="#7A4211">MAP</text><path d="M140 610 q25 -130 50 0 q25 130 50 0 q25 -130 50 0 q25 130 50 0 q25 -130 50 0 q25 130 50 0 q25 -130 50 0 q25 130 50 0 q25 -130 50 0 q25 130 50 0 q25 -130 50 0 q25 130 50 0 q25 -130 50 0 q25 130 50 0 q25 -130 50 0 q25 130 50 0 q25 -130 50 0 q25 130 50 0" fill="none" stroke="#0E8C8C" stroke-width="9"/><text x="160" y="820" font-size="28" fill="#12324A">Amplitude → eliminação de CO₂</text><text x="610" y="820" font-size="28" fill="#12324A">MAP + FiO₂ → oxigenação</text><rect x="70" y="980" width="1060" height="330" rx="28" fill="#E8F0F7"/><text x="110" y="1050" font-size="34" font-weight="700" fill="#073B66">Relações úteis</text><text x="130" y="1140" font-size="29" fill="#12324A">• Frequência maior tende a reduzir volume oscilatório.</text><text x="130" y="1210" font-size="29" fill="#12324A">• Amplitude maior tende a aumentar eliminação de CO₂.</text><rect x="70" y="1360" width="1060" height="160" rx="24" fill="#FFF0D9"/><text x="110" y="1420" font-size="29" font-weight="700" fill="#7A4211">Monitorar expansão torácica, gases, hemodinâmica e sinais de hiperinsuflação.</text></g><text x="70" y="1570" font-family="Arial" font-size="24" fill="#567">HEX-X048-479 · Hexápode</text></svg>