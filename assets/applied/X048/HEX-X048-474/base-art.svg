<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">SIMV aplicado</title><desc id="d">Linha do tempo com ciclos mandatórios sincronizados e respirações espontâneas entre eles.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="70" y="95" font-family="Arial" font-size="52" font-weight="700" fill="white">SIMV APLICADO</text><g font-family="Arial"><text x="70" y="215" font-size="31" fill="#12324A">Ciclos mandatórios sincronizados coexistem com respirações espontâneas.</text><rect x="70" y="290" width="1060" height="700" rx="28" fill="white" stroke="#0E8C8C" stroke-width="5"/><text x="110" y="360" font-size="34" font-weight="700" fill="#073B66">Linha do tempo respiratória</text><line x1="130" y1="760" x2="1070" y2="760" stroke="#567" stroke-width="4"/><path d="M130 760 C180 760 190 520 280 520 C370 520 380 760 430 760 C470 760 480 650 535 650 C590 650 600 760 650 760 C700 760 710 500 805 500 C900 500 910 760 960 760 C1000 760 1010 660 1060 660" fill="none" stroke="#0E8C8C" stroke-width="11"/><rect x="190" y="430" width="190" height="70" rx="18" fill="#D9F2EF"/><text x="215" y="475" font-size="27" fill="#075B55">Mandatório</text><rect x="455" y="575" width="190" height="70" rx="18" fill="#FFF0D9"/><text x="478" y="620" font-size="27" fill="#7A4211">Espontâneo</text><rect x="715" y="410" width="190" height="70" rx="18" fill="#D9F2EF"/><text x="740" y="455" font-size="27" fill="#075B55">Mandatório</text><text x="130" y="870" font-size="27" fill="#12324A">Sincronização reduz empilhamento quando o esforço ocorre próximo ao ciclo programado.</text><rect x="70" y="1050" width="1060" height="450" rx="28" fill="#E8F0F7"/><text x="110" y="1120" font-size="34" font-weight="700" fill="#073B66">Pontos de atenção</text><text x="130" y="1200" font-size="29" fill="#12324A">• Frequência mandatória excessiva: pouca participação espontânea.</text><text x="130" y="1270" font-size="29" fill="#12324A">• Suporte insuficiente nos ciclos espontâneos: aumento do esforço.</text><text x="130" y="1340" font-size="29" fill="#12324A">• Avaliar sincronização, VT, frequência e conforto.</text></g><text x="70" y="1570" font-family="Arial" font-size="24" fill="#567">HEX-X048-474 · Hexápode</text></svg>