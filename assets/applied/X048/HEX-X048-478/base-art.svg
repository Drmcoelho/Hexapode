<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Ventilação bilevel aplicada</title><desc id="d">Dois níveis de pressão, IPAP e EPAP, com diferença de pressão determinando suporte ventilatório.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="70" y="95" font-family="Arial" font-size="52" font-weight="700" fill="white">BILEVEL APLICADO</text><g font-family="Arial"><text x="70" y="215" font-size="31" fill="#12324A">IPAP auxilia ventilação; EPAP sustenta recrutamento e oxigenação.</text><rect x="70" y="290" width="1060" height="600" rx="28" fill="white" stroke="#0E8C8C" stroke-width="5"/><text x="110" y="355" font-size="34" font-weight="700" fill="#073B66">Pressão × tempo</text><line x1="140" y1="760" x2="1060" y2="760" stroke="#567"/><path d="M140 650 L260 650 L260 430 L560 430 L560 650 L700 650 L700 430 L1000 430 L1000 650 L1060 650" fill="none" stroke="#0E8C8C" stroke-width="12"/><line x1="140" y1="650" x2="1060" y2="650" stroke="#F28C28" stroke-width="5" stroke-dasharray="14 10"/><text x="850" y="410" font-size="29" fill="#075B55">IPAP</text><text x="850" y="630" font-size="29" fill="#7A4211">EPAP</text><path d="M460 430 V650" stroke="#7A5AAF" stroke-width="8" marker-end="url(#a)"/><text x="485" y="555" font-size="28" fill="#5B3C8C">PS = IPAP − EPAP</text><rect x="70" y="960" width="1060" height="350" rx="28" fill="#E8F0F7"/><text x="110" y="1030" font-size="34" font-weight="700" fill="#073B66">Ajuste orientado por objetivo</text><text x="130" y="1120" font-size="29" fill="#12324A">• Hipercapnia/esforço: aumentar diferença IPAP−EPAP.</text><text x="130" y="1190" font-size="29" fill="#12324A">• Hipoxemia/recrutamento: ajustar EPAP e oxigênio.</text><rect x="70" y="1360" width="1060" height="160" rx="24" fill="#FFF0D9"/><text x="110" y="1420" font-size="29" font-weight="700" fill="#7A4211">Reavaliar cedo: conforto, fuga, VT, FR, SpO₂, CO₂ e consciência.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7A5AAF"/></marker></defs><text x="70" y="1570" font-family="Arial" font-size="24" fill="#567">HEX-X048-478 · Hexápode</text></svg>