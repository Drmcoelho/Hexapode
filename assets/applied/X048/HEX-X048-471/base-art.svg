<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">VCV aplicado</title><desc id="d">Diagrama didático do modo volume controlado mostrando volume corrente fixo, fluxo ajustado e pressão variável.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="70" y="95" font-family="Arial" font-size="52" font-weight="700" fill="white">VCV APLICADO</text><text x="70" y="205" font-family="Arial" font-size="30" fill="#12324A">Volume é a variável controlada; pressão depende da mecânica.</text><g font-family="Arial"><rect x="70" y="280" width="1060" height="300" rx="28" fill="white" stroke="#0E8C8C" stroke-width="5"/><text x="110" y="340" font-size="34" font-weight="700" fill="#073B66">O que o ventilador garante</text><rect x="120" y="390" width="280" height="120" rx="20" fill="#D9F2EF"/><text x="180" y="460" font-size="36" fill="#075B55">VT FIXO</text><path d="M430 450 H700" stroke="#F28C28" stroke-width="14" marker-end="url(#a)"/><rect x="740" y="390" width="300" height="120" rx="20" fill="#FFF0D9"/><text x="790" y="445" font-size="28" fill="#7A4211">Ppico varia com</text><text x="790" y="485" font-size="28" fill="#7A4211">R e C</text><rect x="70" y="640" width="1060" height="650" rx="28" fill="white" stroke="#B9C9D6" stroke-width="4"/><text x="110" y="705" font-size="34" font-weight="700" fill="#073B66">Curvas típicas</text><line x1="150" y1="880" x2="1050" y2="880" stroke="#567" stroke-width="3"/><path d="M150 880 L150 760 L530 760 L530 880 L1050 880" fill="none" stroke="#0E8C8C" stroke-width="10"/><text x="160" y="750" font-size="26" fill="#075B55">Fluxo quadrado</text><line x1="150" y1="1080" x2="1050" y2="1080" stroke="#567" stroke-width="3"/><path d="M150 1080 C260 1050 330 900 500 900 C670 900 720 1030 800 1080 L1050 1080" fill="none" stroke="#F28C28" stroke-width="10"/><text x="160" y="930" font-size="26" fill="#7A4211">Pressão variável</text><rect x="70" y="1340" width="1060" height="180" rx="24" fill="#E8F0F7"/><text x="110" y="1400" font-size="30" font-weight="700" fill="#073B66">Leitura clínica</text><text x="110" y="1450" font-size="27" fill="#12324A">Ppico ↑ com resistência; Pplat ↑ com redução da complacência.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><text x="70" y="1570" font-family="Arial" font-size="24" fill="#567">HEX-X048-471 · Hexápode</text></svg>