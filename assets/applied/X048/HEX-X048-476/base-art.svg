<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">APRV aplicado</title><desc id="d">Pressão alta prolongada com liberações breves e respiração espontânea permitida.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="70" y="95" font-family="Arial" font-size="52" font-weight="700" fill="white">APRV APLICADO</text><g font-family="Arial"><text x="70" y="215" font-size="31" fill="#12324A">P-high prolongada recruta; liberações breves favorecem ventilação.</text><rect x="70" y="290" width="1060" height="650" rx="28" fill="white" stroke="#0E8C8C" stroke-width="5"/><text x="110" y="355" font-size="34" font-weight="700" fill="#073B66">Pressão × tempo</text><line x1="140" y1="770" x2="1060" y2="770" stroke="#567" stroke-width="3"/><path d="M140 770 L140 480 L500 480 L500 700 L580 700 L580 480 L930 480 L930 700 L1010 700 L1010 480 L1060 480" fill="none" stroke="#0E8C8C" stroke-width="12"/><text x="180" y="450" font-size="28" fill="#075B55">T-high</text><text x="490" y="740" font-size="28" fill="#7A4211">T-low</text><path d="M260 560 q35 -70 70 0 q35 70 70 0" fill="none" stroke="#F28C28" stroke-width="8"/><text x="200" y="620" font-size="24" fill="#7A4211">respiração espontânea</text><rect x="70" y="1010" width="1060" height="500" rx="28" fill="#E8F0F7"/><text x="110" y="1080" font-size="34" font-weight="700" fill="#073B66">Interpretação prática</text><text x="130" y="1170" font-size="29" fill="#12324A">• P-high/T-high: sustentam recrutamento e oxigenação.</text><text x="130" y="1240" font-size="29" fill="#12324A">• T-low muito longo: desrecrutamento; muito curto: eliminação de CO₂ limitada.</text><text x="130" y="1310" font-size="29" fill="#12324A">• Monitorar volume liberado, conforto, auto-PEEP e hemodinâmica.</text></g><text x="70" y="1570" font-family="Arial" font-size="24" fill="#567">HEX-X048-476 · Hexápode</text></svg>