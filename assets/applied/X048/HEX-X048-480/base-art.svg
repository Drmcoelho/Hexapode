<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">VNI aplicada</title><desc id="d">Algoritmo visual de seleção, início e reavaliação precoce da ventilação não invasiva.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="70" y="95" font-family="Arial" font-size="52" font-weight="700" fill="white">VNI APLICADA</text><g font-family="Arial"><text x="70" y="215" font-size="31" fill="#12324A">Selecionar indicação, excluir contraindicações e reavaliar resposta cedo.</text><rect x="70" y="280" width="1060" height="250" rx="28" fill="white" stroke="#0E8C8C" stroke-width="5"/><text x="110" y="345" font-size="33" font-weight="700" fill="#073B66">1 · Candidato adequado?</text><rect x="120" y="390" width="280" height="90" rx="18" fill="#D9F2EF"/><text x="165" y="445" font-size="27" fill="#075B55">Cooperativo</text><rect x="455" y="390" width="280" height="90" rx="18" fill="#D9F2EF"/><text x="500" y="445" font-size="27" fill="#075B55">Protege via aérea</text><rect x="790" y="390" width="280" height="90" rx="18" fill="#D9F2EF"/><text x="835" y="445" font-size="27" fill="#075B55">Estável o bastante</text><rect x="70" y="590" width="1060" height="300" rx="28" fill="white" stroke="#B9C9D6" stroke-width="4"/><text x="110" y="655" font-size="33" font-weight="700" fill="#073B66">2 · Escolher estratégia</text><rect x="130" y="710" width="430" height="120" rx="20" fill="#E8F0F7"/><text x="200" y="760" font-size="29" fill="#073B66">CPAP</text><text x="200" y="805" font-size="25" fill="#12324A">predomínio de hipoxemia/recrutamento</text><rect x="640" y="710" width="430" height="120" rx="20" fill="#F1EAF8"/><text x="710" y="760" font-size="29" fill="#5B3C8C">Bilevel</text><text x="710" y="805" font-size="25" fill="#12324A">hipercapnia ou suporte ventilatório</text><rect x="70" y="950" width="1060" height="360" rx="28" fill="#E8F0F7"/><text x="110" y="1020" font-size="33" font-weight="700" fill="#073B66">3 · Reavaliar em curto intervalo</text><text x="130" y="1110" font-size="29" fill="#12324A">• Frequência respiratória, esforço, SpO₂ e gasometria.</text><text x="130" y="1180" font-size="29" fill="#12324A">• Consciência, conforto, sincronização e fuga.</text><text x="130" y="1250" font-size="29" fill="#12324A">• Sem melhora ou com deterioração: não atrasar escalonamento.</text><rect x="70" y="1360" width="1060" height="160" rx="24" fill="#FFF0D9"/><text x="110" y="1420" font-size="29" font-weight="700" fill="#7A4211">A interface correta e a titulação gradual são parte do tratamento.</text></g><text x="70" y="1570" font-family="Arial" font-size="24" fill="#567">HEX-X048-480 · Hexápode</text></svg>