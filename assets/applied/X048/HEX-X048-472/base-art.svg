<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">PCV aplicado</title><desc id="d">Pressão inspiratória fixa, fluxo desacelerado e volume corrente dependente da complacência e resistência.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="70" y="95" font-family="Arial" font-size="52" font-weight="700" fill="white">PCV APLICADO</text><g font-family="Arial"><text x="70" y="215" font-size="31" fill="#12324A">Pressão é controlada; VT muda com a mecânica e o tempo inspiratório.</text><rect x="70" y="280" width="1060" height="300" rx="28" fill="white" stroke="#0E8C8C" stroke-width="5"/><text x="110" y="345" font-size="34" font-weight="700" fill="#073B66">Relação central</text><rect x="120" y="395" width="300" height="120" rx="22" fill="#D9F2EF"/><text x="170" y="465" font-size="34" fill="#075B55">ΔP FIXA</text><path d="M450 455 H700" stroke="#F28C28" stroke-width="14" marker-end="url(#a)"/><rect x="740" y="395" width="300" height="120" rx="22" fill="#FFF0D9"/><text x="795" y="445" font-size="28" fill="#7A4211">VT depende</text><text x="795" y="485" font-size="28" fill="#7A4211">de C, R e Ti</text><rect x="70" y="640" width="1060" height="650" rx="28" fill="white" stroke="#B9C9D6" stroke-width="4"/><text x="110" y="705" font-size="34" font-weight="700" fill="#073B66">Curvas típicas</text><line x1="150" y1="900" x2="1050" y2="900" stroke="#567"/><path d="M150 900 C240 760 430 740 620 820 C730 865 850 895 1050 900" fill="none" stroke="#0E8C8C" stroke-width="11"/><text x="160" y="750" font-size="26" fill="#075B55">Fluxo desacelerado</text><line x1="150" y1="1110" x2="1050" y2="1110" stroke="#567"/><path d="M150 1110 L220 980 L760 980 L820 1110 L1050 1110" fill="none" stroke="#F28C28" stroke-width="11"/><text x="160" y="965" font-size="26" fill="#7A4211">Pressão quadrada</text><rect x="70" y="1340" width="1060" height="180" rx="24" fill="#E8F0F7"/><text x="110" y="1400" font-size="30" font-weight="700" fill="#073B66">Leitura clínica</text><text x="110" y="1450" font-size="27" fill="#12324A">VT em queda sugere piora de complacência, aumento de resistência ou menor Ti.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><text x="70" y="1570" font-family="Arial" font-size="24" fill="#567">HEX-X048-472 · Hexápode</text></svg>