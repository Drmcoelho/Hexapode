<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">CPAP aplicado</title><desc id="d">Pressão positiva contínua durante respiração espontânea, com efeito sobre recrutamento e trabalho respiratório.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="70" y="95" font-family="Arial" font-size="52" font-weight="700" fill="white">CPAP APLICADO</text><g font-family="Arial"><text x="70" y="215" font-size="31" fill="#12324A">Uma pressão basal contínua mantém vias aéreas e alvéolos abertos.</text><rect x="70" y="290" width="1060" height="470" rx="28" fill="white" stroke="#0E8C8C" stroke-width="5"/><text x="110" y="355" font-size="34" font-weight="700" fill="#073B66">Antes e depois</text><circle cx="310" cy="520" r="120" fill="#FBE1DD" stroke="#C95B4B" stroke-width="6"/><path d="M250 520 q60 -85 120 0 q-60 85 -120 0" fill="#E9A79E"/><text x="235" y="690" font-size="27" fill="#7A4211">alvéolo instável</text><path d="M470 520 H670" stroke="#F28C28" stroke-width="14" marker-end="url(#a)"/><circle cx="850" cy="520" r="150" fill="#D9F2EF" stroke="#0E8C8C" stroke-width="6"/><circle cx="850" cy="520" r="95" fill="#EEF9F7"/><text x="760" y="705" font-size="27" fill="#075B55">recrutamento</text><rect x="70" y="830" width="1060" height="450" rx="28" fill="#E8F0F7"/><text x="110" y="900" font-size="34" font-weight="700" fill="#073B66">Efeitos clínicos</text><text x="130" y="990" font-size="29" fill="#12324A">• Aumenta capacidade residual funcional e melhora oxigenação.</text><text x="130" y="1060" font-size="29" fill="#12324A">• Pode reduzir colapso faríngeo e esforço inspiratório.</text><text x="130" y="1130" font-size="29" fill="#12324A">• Pressão excessiva pode causar desconforto, fuga e repercussão hemodinâmica.</text><rect x="70" y="1340" width="1060" height="180" rx="24" fill="#FFF0D9"/><text x="110" y="1400" font-size="30" font-weight="700" fill="#7A4211">Monitorar</text><text x="110" y="1450" font-size="27" fill="#12324A">SpO₂, frequência respiratória, esforço, tolerância e fuga da interface.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><text x="70" y="1570" font-family="Arial" font-size="24" fill="#567">HEX-X048-477 · Hexápode</text></svg>