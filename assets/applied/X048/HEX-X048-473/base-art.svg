<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">PSV aplicado</title><desc id="d">Respiração espontânea assistida por pressão, com disparo do paciente e ciclagem por fluxo.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="70" y="95" font-family="Arial" font-size="52" font-weight="700" fill="white">PSV APLICADO</text><g font-family="Arial"><text x="70" y="215" font-size="31" fill="#12324A">O paciente dispara; o ventilador sustenta pressão e cicla por fluxo.</text><rect x="70" y="285" width="1060" height="360" rx="28" fill="white" stroke="#0E8C8C" stroke-width="5"/><circle cx="240" cy="465" r="95" fill="#D9F2EF"/><text x="160" y="455" font-size="28" fill="#075B55">ESFORÇO</text><text x="165" y="495" font-size="28" fill="#075B55">PACIENTE</text><path d="M350 465 H530" stroke="#F28C28" stroke-width="14" marker-end="url(#a)"/><rect x="570" y="385" width="420" height="160" rx="26" fill="#E8F0F7"/><text x="635" y="445" font-size="32" fill="#073B66">PRESSÃO DE SUPORTE</text><text x="690" y="495" font-size="29" fill="#12324A">até queda do fluxo</text><rect x="70" y="710" width="1060" height="560" rx="28" fill="white" stroke="#B9C9D6" stroke-width="4"/><text x="110" y="775" font-size="34" font-weight="700" fill="#073B66">Ciclo assistido</text><line x1="150" y1="1010" x2="1050" y2="1010" stroke="#567"/><path d="M150 1010 C210 980 235 850 330 820 C500 770 720 850 810 930 C855 970 900 1000 1050 1010" fill="none" stroke="#0E8C8C" stroke-width="11"/><line x1="810" y1="800" x2="810" y2="1060" stroke="#F28C28" stroke-width="5" stroke-dasharray="12 10"/><text x="735" y="790" font-size="26" fill="#7A4211">ciclagem</text><text x="150" y="1120" font-size="28" fill="#12324A">VT resulta de esforço + suporte + mecânica.</text><rect x="70" y="1330" width="1060" height="190" rx="24" fill="#FFF0D9"/><text x="110" y="1390" font-size="30" font-weight="700" fill="#7A4211">Falha provável</text><text x="110" y="1440" font-size="27" fill="#12324A">Taquipneia persistente, VT baixo, esforço elevado ou deterioração gasométrica.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F28C28"/></marker></defs><text x="70" y="1570" font-family="Arial" font-size="24" fill="#567">HEX-X048-473 · Hexápode</text></svg>