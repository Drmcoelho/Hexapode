<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Dor torácica: abordagem diagnóstica</title><desc id="d">Algoritmo para caracterizar dor torácica, reconhecer instabilidade, obter ECG e biomarcadores e separar causas cardiovasculares, pulmonares e não ameaçadoras.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="150" fill="#0B315B"/><text x="60" y="65" fill="white" font-family="Arial" font-size="32" font-weight="700">HEXÁPODE · X041</text><text x="60" y="118" fill="white" font-family="Arial" font-size="28">DOR TORÁCICA · ABORDAGEM</text><g font-family="Arial"><path d="M220 300c80-80 220-70 290 20c70 90 40 210-40 270c-70 50-180 40-240-20c-80-80-90-190-10-270Z" fill="#F1B8A9" stroke="#B63A3A" stroke-width="5"/><path d="M360 350c-70-60-150 40-80 115l80 80l80-80c70-75-10-175-80-115Z" fill="#D65A4A"/><g fill="#fff" stroke="#1D4E7A" stroke-width="4"><rect x="610" y="220" width="450" height="100" rx="18"/><rect x="610" y="370" width="450" height="100" rx="18"/><rect x="610" y="520" width="450" height="100" rx="18"/><rect x="610" y="670" width="450" height="100" rx="18"/><rect x="610" y="820" width="450" height="100" rx="18"/></g><g font-size="24" font-weight="700"><text x="650" y="280">1. Caracterizar a dor</text><text x="650" y="430">2. Procurar sinais de instabilidade</text><text x="650" y="580">3. ECG em até 10 minutos</text><text x="650" y="730">4. Troponina e exames dirigidos</text><text x="650" y="880">5. Estratificar risco e decidir</text></g><path d="M835 320v50m0 100v50m0 100v50m0 100v50" stroke="#0F8B8D" stroke-width="8"/><rect x="120" y="1080" width="960" height="220" rx="25" fill="#FFF" stroke="#E08A2E" stroke-width="5"/><text x="160" y="1140" font-size="26" font-weight="700" fill="#B63A3A">Diagnósticos que não podem ser perdidos</text><text x="160" y="1200" font-size="23">Síndrome coronariana aguda · dissecção de aorta · TEP</text><text x="160" y="1250" font-size="23">pneumotórax hipertensivo · tamponamento · ruptura esofágica</text></g><rect x="0" y="1450" width="1200" height="150" fill="#0B315B"/><text x="60" y="1510" fill="white" font-family="Arial" font-size="24">Tempo, risco e contexto definem a prioridade</text><text x="60" y="1555" fill="#D7E8F5" font-family="Arial" font-size="18">HEX-X041-403 · uso educacional</text></svg>