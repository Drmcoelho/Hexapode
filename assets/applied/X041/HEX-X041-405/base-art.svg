<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Febre: abordagem diagnóstica</title><desc id="d">Algoritmo de febre com confirmação da temperatura, tempo de evolução, foco provável, gravidade e investigação dirigida.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="150" fill="#0B315B"/><text x="60" y="65" fill="white" font-family="Arial" font-size="32" font-weight="700">HEXÁPODE · X041</text><text x="60" y="118" fill="white" font-family="Arial" font-size="28">FEBRE · ABORDAGEM DIAGNÓSTICA</text><g font-family="Arial"><rect x="170" y="220" width="160" height="700" rx="80" fill="#FFF" stroke="#1D4E7A" stroke-width="8"/><circle cx="250" cy="900" r="110" fill="#D65A4A" stroke="#B63A3A" stroke-width="8"/><rect x="225" y="300" width="50" height="620" rx="25" fill="#D65A4A"/><g fill="#fff" stroke="#0F8B8D" stroke-width="4"><rect x="480" y="230" width="560" height="100" rx="18"/><rect x="480" y="380" width="560" height="100" rx="18"/><rect x="480" y="530" width="560" height="100" rx="18"/><rect x="480" y="680" width="560" height="100" rx="18"/><rect x="480" y="830" width="560" height="100" rx="18"/></g><g font-size="24" font-weight="700"><text x="520" y="290">1. Confirmar febre e método</text><text x="520" y="440">2. Definir duração e padrão</text><text x="520" y="590">3. Procurar foco e exposições</text><text x="520" y="740">4. Avaliar gravidade e hospedeiro</text><text x="520" y="890">5. Solicitar exames dirigidos</text></g><rect x="120" y="1120" width="960" height="190" rx="22" fill="#FFF" stroke="#E08A2E" stroke-width="5"/><text x="160" y="1180" font-size="26" font-weight="700" fill="#B63A3A">Alerta: tratar síndrome séptica, não apenas a temperatura</text><text x="160" y="1240" font-size="22">Hipotensão · hipoperfusão · alteração mental · lactato elevado · disfunção orgânica</text></g><rect x="0" y="1450" width="1200" height="150" fill="#0B315B"/><text x="60" y="1510" fill="white" font-family="Arial" font-size="24">Temperatura é um sinal; a causa e a gravidade definem a conduta.</text><text x="60" y="1555" fill="#D7E8F5" font-family="Arial" font-size="18">HEX-X041-405 · uso educacional</text></svg>