<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Distúrbios hidroeletrolíticos: abordagem prática</title><desc id="d">Algoritmo aplicado para alterações de sódio, potássio, cálcio e magnésio, priorizando confirmação, gravidade, causa, correção segura e monitorização.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="150" fill="#0B315B"/><text x="60" y="65" fill="white" font-family="Arial" font-size="32" font-weight="700">HEXÁPODE · X041</text><text x="60" y="118" fill="white" font-family="Arial" font-size="28">DISTÚRBIOS HIDROELETROLÍTICOS</text><g font-family="Arial"><g fill="#DCEAF4" stroke="#1D4E7A" stroke-width="5"><circle cx="210" cy="330" r="100"/><circle cx="470" cy="330" r="100"/><circle cx="730" cy="330" r="100"/><circle cx="990" cy="330" r="100"/></g><g font-size="36" font-weight="700" fill="#1D4E7A"><text x="170" y="345">Na⁺</text><text x="430" y="345">K⁺</text><text x="680" y="345">Ca²⁺</text><text x="935" y="345">Mg²⁺</text></g><g fill="#fff" stroke="#0F8B8D" stroke-width="4"><rect x="160" y="560" width="880" height="100" rx="18"/><rect x="160" y="710" width="880" height="100" rx="18"/><rect x="160" y="860" width="880" height="100" rx="18"/><rect x="160" y="1010" width="880" height="100" rx="18"/><rect x="160" y="1160" width="880" height="100" rx="18"/></g><g font-size="25" font-weight="700"><text x="210" y="620">1. Confirmar valor, unidade e artefato</text><text x="210" y="770">2. Avaliar gravidade, sintomas e ECG</text><text x="210" y="920">3. Definir distribuição, perdas e medicamentos</text><text x="210" y="1070">4. Corrigir com velocidade e alvo seguros</text><text x="210" y="1220">5. Repetir dosagem e monitorar resposta</text></g></g><rect x="0" y="1450" width="1200" height="150" fill="#0B315B"/><text x="60" y="1510" fill="white" font-family="Arial" font-size="24">Em eletrólitos, rapidez excessiva também causa dano.</text><text x="60" y="1555" fill="#D7E8F5" font-family="Arial" font-size="18">HEX-X041-410 · uso educacional</text></svg>