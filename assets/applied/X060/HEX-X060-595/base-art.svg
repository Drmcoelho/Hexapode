<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><rect width="1600" height="1200" fill="#f5eddc"/><rect x="35" y="35" width="1530" height="1130" rx="28" fill="#e6efe9" stroke="#173b45" stroke-width="8"/><rect x="35" y="35" width="1530" height="180" rx="28" fill="#173b45"/><text x="85" y="110" font-family="Georgia" font-size="62" fill="#f8f0dc">O Cofre da Hipoglicemia</text><text x="88" y="170" font-family="Arial" font-size="31" fill="#f0b35c">HIPOGLICEMIA GRAVE · O CÉREBRO FICA SEM COMBUSTÍVEL</text><rect x="140" y="330" width="620" height="500" rx="36" fill="#355f63" stroke="#173b45" stroke-width="12"/><circle cx="450" cy="580" r="130" fill="#fff7e7" stroke="#173b45" stroke-width="12"/><circle cx="450" cy="580" r="40" fill="#8e3f35"/><line x1="450" y1="580" x2="520" y2="515" stroke="#8e3f35" stroke-width="18"/><text x="850" y="370" font-family="Arial" font-size="38" font-weight="700" fill="#8e3f35">SEQUÊNCIA</text><text x="850" y="455" font-family="Arial" font-size="30" fill="#173b45">Verificar glicemia imediatamente</text><text x="850" y="520" font-family="Arial" font-size="30" fill="#173b45">Restaurar substrato disponível</text><text x="850" y="585" font-family="Arial" font-size="30" fill="#173b45">Reavaliar consciência e recorrência</text><text x="850" y="650" font-family="Arial" font-size="30" fill="#173b45">Identificar fármaco, jejum ou doença</text><rect x="80" y="970" width="1440" height="140" rx="22" fill="#173b45"/><text x="800" y="1055" text-anchor="middle" font-family="Georgia" font-size="44" fill="#f0b35c">Abra o cofre antes de discutir quem perdeu a chave</text></svg>