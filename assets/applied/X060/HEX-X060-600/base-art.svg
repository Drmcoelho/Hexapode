<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><rect width="1600" height="1200" fill="#f5eddc"/><rect x="35" y="35" width="1530" height="1130" rx="28" fill="#e6efe9" stroke="#173b45" stroke-width="8"/><rect x="35" y="35" width="1530" height="180" rx="28" fill="#173b45"/><text x="85" y="110" font-family="Georgia" font-size="62" fill="#f8f0dc">A Sala de Crise</text><text x="88" y="170" font-family="Arial" font-size="31" fill="#f0b35c">INTEGRAÇÃO CLÍNICA · AGIR, COMPREENDER, REAVALIAR</text><g transform="translate(110 300)"><rect x="0" y="0" width="640" height="560" rx="28" fill="#fff7e7" stroke="#173b45" stroke-width="8"/><circle cx="320" cy="280" r="120" fill="#d6e7e3" stroke="#173b45" stroke-width="10"/><g fill="#8e3f35"><rect x="60" y="90" width="170" height="100" rx="18"/><rect x="410" y="90" width="170" height="100" rx="18"/><rect x="60" y="370" width="170" height="100" rx="18"/><rect x="410" y="370" width="170" height="100" rx="18"/></g><text x="145" y="150" text-anchor="middle" font-family="Arial" font-size="25" fill="white">VIA AÉREA</text><text x="495" y="150" text-anchor="middle" font-family="Arial" font-size="25" fill="white">CIRCULAÇÃO</text><text x="145" y="430" text-anchor="middle" font-family="Arial" font-size="25" fill="white">DIAGNÓSTICO</text><text x="495" y="430" text-anchor="middle" font-family="Arial" font-size="25" fill="white">REAVALIAÇÃO</text><path d="M230 160 L270 230 M410 160 L370 230 M230 400 L270 330 M410 400 L370 330" stroke="#f0b35c" stroke-width="16"/></g><rect x="850" y="310" width="600" height="550" rx="24" fill="#fff7e7" stroke="#173b45" stroke-width="6"/><text x="900" y="380" font-family="Arial" font-size="38" font-weight="700" fill="#8e3f35">QUATRO CAMADAS SOMÁVEIS</text><text x="900" y="460" font-family="Arial" font-size="30" fill="#173b45">1 · Sobrevivência: o que fazer agora</text><text x="900" y="525" font-family="Arial" font-size="30" fill="#173b45">2 · Mecanismo: por que está acontecendo</text><text x="900" y="590" font-family="Arial" font-size="30" fill="#173b45">3 · Causa: o que iniciou o desastre</text><text x="900" y="655" font-family="Arial" font-size="30" fill="#173b45">4 · Prevenção: como evitar a repetição</text><text x="900" y="745" font-family="Arial" font-size="27" fill="#355f63">Nenhuma camada anula a anterior.</text><rect x="80" y="970" width="1440" height="140" rx="22" fill="#173b45"/><text x="800" y="1040" text-anchor="middle" font-family="Georgia" font-size="43" fill="#f0b35c">A figura certa depende da missão clínica</text><text x="800" y="1088" text-anchor="middle" font-family="Arial" font-size="28" fill="#f8f0dc">Rígida na intenção. Flexível na forma.</text></svg>