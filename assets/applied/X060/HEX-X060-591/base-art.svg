<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">A Colmeia em Colapso</title><desc id="d">Colmeia sistêmica em colapso representa anafilaxia e a necessidade de intervenção imediata.</desc><rect width="1600" height="1200" fill="#f5eddc"/><rect x="35" y="35" width="1530" height="1130" rx="28" fill="#e6efe9" stroke="#173b45" stroke-width="8"/><rect x="35" y="35" width="1530" height="180" rx="28" fill="#173b45"/><text x="85" y="110" font-family="Georgia" font-size="62" fill="#f8f0dc">A Colmeia em Colapso</text><text x="88" y="170" font-family="Arial" font-size="31" fill="#f0b35c">ANAFILAXIA · RECONHECER E INTERVIR SEM ATRASO</text><g transform="translate(120 280)"><path d="M310 20 L560 165 L560 455 L310 600 L60 455 L60 165 Z" fill="#f0b35c" stroke="#173b45" stroke-width="12"/><g fill="#fff7e7" stroke="#8e3f35" stroke-width="7"><circle cx="250" cy="220" r="58"/><circle cx="370" cy="220" r="58"/><circle cx="310" cy="325" r="58"/><circle cx="250" cy="430" r="58"/><circle cx="370" cy="430" r="58"/></g><path d="M230 690 C250 600 370 600 390 690" fill="none" stroke="#8e3f35" stroke-width="50"/><text x="310" y="760" text-anchor="middle" font-family="Arial" font-size="28" fill="#8e3f35">VIA AÉREA ESTREITA · PRESSÃO CAI</text></g><rect x="820" y="300" width="650" height="500" rx="24" fill="#fff7e7" stroke="#173b45" stroke-width="6"/><text x="870" y="370" font-family="Arial" font-size="38" font-weight="700" fill="#8e3f35">ORDEM QUE SALVA</text><text x="870" y="450" font-family="Arial" font-size="30" fill="#173b45">1 · Reconheça o padrão sistêmico</text><text x="870" y="515" font-family="Arial" font-size="30" fill="#173b45">2 · Faça o tratamento de primeira linha</text><text x="870" y="580" font-family="Arial" font-size="30" fill="#173b45">3 · Proteja via aérea e circulação</text><text x="870" y="645" font-family="Arial" font-size="30" fill="#173b45">4 · Reavalie e repita conforme resposta</text><rect x="80" y="970" width="1440" height="140" rx="22" fill="#173b45"/><text x="800" y="1040" text-anchor="middle" font-family="Georgia" font-size="44" fill="#f0b35c">Silenciar a coceira não impede o colapso</text><text x="800" y="1088" text-anchor="middle" font-family="Arial" font-size="28" fill="#f8f0dc">Trate primeiro o mecanismo que mata</text></svg>