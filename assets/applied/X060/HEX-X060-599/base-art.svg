<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><rect width="1600" height="1200" fill="#f5eddc"/><rect x="35" y="35" width="1530" height="1130" rx="28" fill="#e6efe9" stroke="#173b45" stroke-width="8"/><rect x="35" y="35" width="1530" height="180" rx="28" fill="#173b45"/><text x="85" y="110" font-family="Georgia" font-size="62" fill="#f8f0dc">O Sangue sem Freio</text><text x="88" y="170" font-family="Arial" font-size="31" fill="#f0b35c">COAGULAÇÃO INTRAVASCULAR DISSEMINADA · CONSUMO E CAOS</text><g transform="translate(130 300)"><path d="M0 330 C180 100 430 560 650 290" fill="none" stroke="#8e3f35" stroke-width="120"/><g fill="#f0b35c" stroke="#173b45" stroke-width="6"><circle cx="170" cy="280" r="38"/><circle cx="310" cy="350" r="38"/><circle cx="460" cy="340" r="38"/><circle cx="560" cy="285" r="38"/></g><g stroke="#173b45" stroke-width="14"><line x1="140" y1="250" x2="200" y2="310"/><line x1="200" y1="250" x2="140" y2="310"/><line x1="430" y1="310" x2="490" y2="370"/><line x1="490" y1="310" x2="430" y2="370"/></g></g><rect x="850" y="320" width="590" height="510" rx="24" fill="#fff7e7" stroke="#173b45" stroke-width="6"/><text x="900" y="390" font-family="Arial" font-size="38" font-weight="700" fill="#8e3f35">DOIS PROBLEMAS, UMA ORIGEM</text><text x="900" y="470" font-family="Arial" font-size="30" fill="#173b45">Microtrombos bloqueiam pequenas vias</text><text x="900" y="535" font-family="Arial" font-size="30" fill="#173b45">Plaquetas e fatores são consumidos</text><text x="900" y="600" font-family="Arial" font-size="30" fill="#173b45">Sangramento aparece onde falta reparo</text><text x="900" y="665" font-family="Arial" font-size="30" fill="#173b45">Tratar o gatilho interrompe a cascata</text><rect x="80" y="970" width="1440" height="140" rx="22" fill="#173b45"/><text x="800" y="1055" text-anchor="middle" font-family="Georgia" font-size="43" fill="#f0b35c">Todos os freios acionados deixam a cidade sem freio algum</text></svg>