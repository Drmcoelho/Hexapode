<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Resistência aplicada</title><desc id="d">Algoritmo para pressão de pico elevada: broncoespasmo, secreção, tubo dobrado e obstrução do circuito.</desc><style>.h{font:700 30px Arial;fill:#fff}.t{font:700 44px Arial;fill:#0B2E59}.b{font:24px Arial;fill:#383F47}.s{font:600 23px Arial;fill:#0B2E59}</style><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2E59"/><text x="50" y="75" class="h">HEXÁPODE · X044</text><text x="1150" y="75" text-anchor="end" class="h">HEX-X044-438</text><text x="600" y="205" class="t" text-anchor="middle">Resistência: por que a pressão de pico subiu?</text><rect x="90" y="310" width="1020" height="300" rx="28" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><path d="M170 520L260 410L350 520L440 360L530 520L620 420L710 520L800 300L890 520L1020 440" fill="none" stroke="#D65A4A" stroke-width="13"/><text x="600" y="575" class="s" text-anchor="middle">Ppico ↑ — compare com Pplat</text><g class="s" text-anchor="middle"><rect x="100" y="700" width="220" height="220" rx="25" fill="#FFF1D8"/><text x="210" y="790">Broncoespasmo</text><text x="210" y="840">sibilância</text><rect x="355" y="700" width="220" height="220" rx="25" fill="#E7F0F8"/><text x="465" y="790">Secreção</text><text x="465" y="840">ruídos / curva</text><rect x="610" y="700" width="220" height="220" rx="25" fill="#F9D9D4"/><text x="720" y="790">Tubo</text><text x="720" y="840">dobra / mordida</text><rect x="865" y="700" width="220" height="220" rx="25" fill="#E7F5EE"/><text x="975" y="790">Circuito</text><text x="975" y="840">filtro / água</text></g><rect x="100" y="1020" width="1000" height="400" rx="25" fill="#E9F3F3"/><text x="600" y="1090" class="t" text-anchor="middle">Sequência segura</text><text x="150" y="1170" class="b">1. Avalie paciente e ventilador. 2. Aspire se indicado. 3. Passe cateter no tubo.</text><text x="150" y="1230" class="b">4. Verifique circuito, filtro e cuff. 5. Trate broncoespasmo e reavalie curvas.</text><text x="150" y="1310" class="b">Pplat normal sugere componente resistivo; Pplat elevada exige avaliar complacência.</text><rect y="1490" width="1200" height="110" fill="#0B2E59"/><text x="50" y="1555" class="h">Fonte: HEX-G004-038</text></svg>