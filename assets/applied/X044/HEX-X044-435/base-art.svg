<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Pressão transpulmonar aplicada</title><desc id="d">Uso da pressão transpulmonar para compreender colapso, recrutamento e sobredistensão.</desc><style>.h{font:700 30px Arial;fill:#fff}.t{font:700 44px Arial;fill:#0B2E59}.b{font:24px Arial;fill:#383F47}.s{font:600 23px Arial;fill:#0B2E59}</style><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2E59"/><text x="50" y="75" class="h">HEXÁPODE · X044</text><text x="1150" y="75" text-anchor="end" class="h">HEX-X044-435</text><text x="600" y="205" class="t" text-anchor="middle">Pressão transpulmonar: recrutamento e sobredistensão</text><text x="600" y="270" class="b" text-anchor="middle">P<sub>L</sub> = pressão alveolar − pressão pleural</text><rect x="85" y="340" width="310" height="700" rx="28" fill="#F9D9D4" stroke="#D65A4A" stroke-width="4"/><rect x="445" y="340" width="310" height="700" rx="28" fill="#E7F5EE" stroke="#4DA06B" stroke-width="4"/><rect x="805" y="340" width="310" height="700" rx="28" fill="#FFF1D8" stroke="#F0B14B" stroke-width="4"/><circle cx="240" cy="610" r="85" fill="#E8A39B" stroke="#0B2E59" stroke-width="7"/><circle cx="600" cy="610" r="135" fill="#E8A39B" stroke="#0B2E59" stroke-width="7"/><circle cx="960" cy="610" r="185" fill="#E8A39B" stroke="#0B2E59" stroke-width="7"/><text x="240" y="890" class="t" text-anchor="middle">Colapso</text><text x="600" y="890" class="t" text-anchor="middle">Zona útil</text><text x="960" y="890" class="t" text-anchor="middle">Sobredistensão</text><text x="240" y="950" class="s" text-anchor="middle">P<sub>L</sub> insuficiente</text><text x="600" y="950" class="s" text-anchor="middle">recrutamento com proteção</text><text x="960" y="950" class="s" text-anchor="middle">P<sub>L</sub> excessiva</text><rect x="100" y="1120" width="1000" height="300" rx="25" fill="#E9F3F3"/><text x="600" y="1190" class="t" text-anchor="middle">Decisão aplicada</text><text x="150" y="1270" class="b">• PEEP deve evitar colapso sem impor sobredistensão.</text><text x="150" y="1320" class="b">• Pressão de via aérea isolada não descreve toda a carga pulmonar.</text><text x="150" y="1370" class="b">• Considere parede torácica, posição e esforço do paciente.</text><rect y="1490" width="1200" height="110" fill="#0B2E59"/><text x="50" y="1555" class="h">Fonte: HEX-G004-035</text></svg>