<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Pressão alveolar aplicada</title><desc id="d">Relação entre pressão alveolar e atmosférica durante inspiração, pausa e expiração.</desc><style>.h{font:700 30px Arial;fill:#fff}.t{font:700 44px Arial;fill:#0B2E59}.b{font:24px Arial;fill:#383F47}.s{font:600 23px Arial;fill:#0B2E59}</style><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2E59"/><text x="50" y="75" class="h">HEXÁPODE · X044</text><text x="1150" y="75" text-anchor="end" class="h">HEX-X044-434</text><text x="600" y="205" class="t" text-anchor="middle">Pressão alveolar: entrada e saída de ar</text><rect x="90" y="300" width="1020" height="760" rx="30" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><line x1="170" y1="690" x2="1030" y2="690" stroke="#383F47" stroke-width="4"/><path d="M170 690C260 580 360 580 450 690S650 800 750 690S940 580 1030 690" fill="none" stroke="#138A8A" stroke-width="14"/><line x1="450" y1="390" x2="450" y2="920" stroke="#B7C9D9" stroke-width="3" stroke-dasharray="12 10"/><line x1="750" y1="390" x2="750" y2="920" stroke="#B7C9D9" stroke-width="3" stroke-dasharray="12 10"/><text x="300" y="970" class="s" text-anchor="middle">Palv &lt; Patm → inspiração</text><text x="600" y="970" class="s" text-anchor="middle">Palv = Patm → pausa</text><text x="890" y="970" class="s" text-anchor="middle">Palv &gt; Patm → expiração</text><rect x="100" y="1120" width="1000" height="320" rx="25" fill="#E9F3F3"/><text x="600" y="1190" class="t" text-anchor="middle">Aplicação clínica</text><text x="140" y="1270" class="b">• Fluxo existe enquanto houver gradiente de pressão.</text><text x="140" y="1320" class="b">• Na obstrução, o esvaziamento é lento e Palv pode permanecer positiva.</text><text x="140" y="1370" class="b">• Pausa sem fluxo permite estimar pressão alveolar estática.</text><rect y="1490" width="1200" height="110" fill="#0B2E59"/><text x="50" y="1555" class="h">Fonte: HEX-G004-034</text></svg>