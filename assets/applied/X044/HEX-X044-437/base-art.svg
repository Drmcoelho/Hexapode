<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Complacência aplicada</title><desc id="d">Cálculo e interpretação da complacência estática e dinâmica com pressão de pico, plateau e PEEP.</desc><style>.h{font:700 30px Arial;fill:#fff}.t{font:700 44px Arial;fill:#0B2E59}.b{font:24px Arial;fill:#383F47}.s{font:600 23px Arial;fill:#0B2E59}</style><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2E59"/><text x="50" y="75" class="h">HEXÁPODE · X044</text><text x="1150" y="75" text-anchor="end" class="h">HEX-X044-437</text><text x="600" y="205" class="t" text-anchor="middle">Complacência: cálculo e interpretação</text><rect x="80" y="310" width="500" height="390" rx="28" fill="#E7F0F8" stroke="#0B2E59" stroke-width="4"/><rect x="620" y="310" width="500" height="390" rx="28" fill="#E7F5EE" stroke="#4DA06B" stroke-width="4"/><text x="330" y="390" class="t" text-anchor="middle">Cstat</text><text x="330" y="490" class="s" text-anchor="middle">VT ÷ (Pplat − PEEP)</text><text x="330" y="580" class="b" text-anchor="middle">reflete pulmão + parede torácica</text><text x="870" y="390" class="t" text-anchor="middle">Cdyn</text><text x="870" y="490" class="s" text-anchor="middle">VT ÷ (Ppico − PEEP)</text><text x="870" y="580" class="b" text-anchor="middle">inclui resistência das vias aéreas</text><rect x="90" y="760" width="1020" height="380" rx="28" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><path d="M170 1030L260 920L350 980L440 820L530 900L620 730L710 850L800 690L890 790L1020 650" fill="none" stroke="#138A8A" stroke-width="12"/><line x1="170" y1="1030" x2="1020" y2="1030" stroke="#383F47" stroke-width="4"/><text x="250" y="1090" class="s">pressão</text><text x="970" y="1090" class="s">volume</text><rect x="100" y="1190" width="1000" height="250" rx="25" fill="#E9F3F3"/><text x="600" y="1260" class="t" text-anchor="middle">Interpretação rápida</text><text x="150" y="1330" class="b">Ppico ↑ com Pplat normal → resistência. Ppico e Pplat ↑ → complacência reduzida.</text><text x="150" y="1380" class="b">Sempre confirme VT, PEEP, posição, secreções e sincronia.</text><rect y="1490" width="1200" height="110" fill="#0B2E59"/><text x="50" y="1555" class="h">Fonte: HEX-G004-037</text></svg>