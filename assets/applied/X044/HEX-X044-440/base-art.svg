<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Histerese aplicada</title><desc id="d">Interpretação do loop pressão-volume, pontos de inflexão e escolha de PEEP evitando colapso e sobredistensão.</desc><style>.h{font:700 30px Arial;fill:#fff}.t{font:700 44px Arial;fill:#0B2E59}.b{font:24px Arial;fill:#383F47}.s{font:600 23px Arial;fill:#0B2E59}</style><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2E59"/><text x="50" y="75" class="h">HEXÁPODE · X044</text><text x="1150" y="75" text-anchor="end" class="h">HEX-X044-440</text><text x="600" y="205" class="t" text-anchor="middle">Histerese: recrutamento e titulação de PEEP</text><rect x="80" y="300" width="720" height="820" rx="30" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><line x1="180" y1="980" x2="710" y2="980" stroke="#383F47" stroke-width="5"/><line x1="180" y1="980" x2="180" y2="390" stroke="#383F47" stroke-width="5"/><path d="M200 940C230 760 300 560 430 500C560 440 650 560 670 720C590 610 500 590 410 650C300 730 245 860 200 940Z" fill="#DDE9F5" stroke="#0B2E59" stroke-width="10"/><path d="M275 860L470 640" stroke="#D65A4A" stroke-width="8" stroke-dasharray="16 12"/><circle cx="275" cy="860" r="14" fill="#D65A4A"/><circle cx="470" cy="640" r="14" fill="#D65A4A"/><text x="265" y="910" class="s" text-anchor="end">inflexão inferior</text><text x="490" y="620" class="s">inflexão superior</text><text x="445" y="1050" class="s" text-anchor="middle">Pressão</text><text x="115" y="690" class="s" transform="rotate(-90 115 690)" text-anchor="middle">Volume</text><rect x="845" y="300" width="285" height="820" rx="30" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><g class="s" text-anchor="middle"><rect x="875" y="390" width="225" height="100" rx="17" fill="#F9D9D4"/><text x="987" y="450">PEEP baixa</text><text x="987" y="480">colapso cíclico</text><rect x="875" y="560" width="225" height="100" rx="17" fill="#E7F5EE"/><text x="987" y="620">Zona útil</text><text x="987" y="650">recrutado</text><rect x="875" y="730" width="225" height="100" rx="17" fill="#FFF1D8"/><text x="987" y="790">PEEP alta</text><text x="987" y="820">sobredistensão</text><rect x="875" y="900" width="225" height="100" rx="17" fill="#E7F0F8"/><text x="987" y="960">Reavaliar</text><text x="987" y="990">oxigenação + mecânica</text></g><rect x="100" y="1160" width="1000" height="270" rx="25" fill="#E9F3F3"/><text x="600" y="1230" class="t" text-anchor="middle">PEEP não é um número isolado</text><text x="150" y="1310" class="b">Equilibre recrutamento, driving pressure, hemodinâmica e risco de sobredistensão.</text><text x="150" y="1370" class="b">Use tendências e resposta do paciente, não apenas um ponto do loop.</text><rect y="1490" width="1200" height="110" fill="#0B2E59"/><text x="50" y="1555" class="h">Fonte: HEX-G004-040</text></svg>