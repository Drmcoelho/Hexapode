<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Inspiração aplicada: avaliação do esforço</title><desc id="desc">Avaliação do esforço inspiratório à beira-leito com expansão torácica, musculatura acessória, tiragem e movimento do diafragma.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#138A8A"/></marker><style>.h{font:700 30px Arial;fill:#fff}.t{font:700 44px Arial;fill:#0B2E59}.b{font:24px Arial;fill:#383F47}.s{font:600 22px Arial;fill:#0B2E59}</style></defs><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2E59"/><text x="50" y="75" class="h">HEXÁPODE · X044</text><text x="1150" y="75" class="h" text-anchor="end">HEX-X044-431</text><text x="600" y="205" class="t" text-anchor="middle">Inspiração: avaliação do esforço</text><rect x="70" y="285" width="650" height="680" rx="28" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><path d="M290 390C205 420 195 650 285 730C340 775 395 700 400 585C405 700 460 775 515 730C605 650 595 420 510 390" fill="#E8A39B" stroke="#0B2E59" stroke-width="7"/><path d="M400 310V600" stroke="#0B2E59" stroke-width="18"/><path d="M245 535H135M555 535H665" stroke="#138A8A" stroke-width="12" marker-end="url(#a)"/><path d="M270 770Q400 865 530 770" fill="none" stroke="#D65A4A" stroke-width="14"/><text x="400" y="900" class="s" text-anchor="middle">Expansão simétrica? Tiragem? Paradoxo?</text><rect x="755" y="285" width="375" height="680" rx="28" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><g class="s" text-anchor="middle"><rect x="795" y="350" width="295" height="78" rx="15" fill="#E7F0F8"/><text x="942" y="399">1 · Inspecionar tórax</text><rect x="795" y="465" width="295" height="78" rx="15" fill="#E7F5EE"/><text x="942" y="514">2 · Ver musculatura acessória</text><rect x="795" y="580" width="295" height="78" rx="15" fill="#FFF1D8"/><text x="942" y="629">3 · Procurar tiragem</text><rect x="795" y="695" width="295" height="78" rx="15" fill="#F9D9D4"/><text x="942" y="744">4 · Avaliar fadiga</text><rect x="795" y="810" width="295" height="78" rx="15" fill="#EEE7F6"/><text x="942" y="859">5 · Intervir e reavaliar</text></g><rect x="80" y="1010" width="1040" height="350" rx="26" fill="#E9F3F3" stroke="#138A8A" stroke-width="3"/><text x="600" y="1080" class="t" text-anchor="middle">Leitura clínica aplicada</text><text x="130" y="1160" class="b">• Aumento do esforço: taquipneia, tiragem, uso de ECM e escalenos.</text><text x="130" y="1210" class="b">• Fadiga: redução do volume corrente, padrão paradoxal, alteração de consciência.</text><text x="130" y="1260" class="b">• Decisão: oxigenação, suporte ventilatório e tratamento da causa.</text><rect y="1490" width="1200" height="110" fill="#0B2E59"/><text x="50" y="1555" class="h">Fonte canônica: HEX-G004-031</text><text x="1150" y="1555" class="h" text-anchor="end">Uso educacional</text></svg>