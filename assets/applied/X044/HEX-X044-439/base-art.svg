<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Trabalho respiratório aplicado</title><desc id="d">Reconhecimento visual de aumento do trabalho respiratório e sinais de fadiga ventilatória iminente.</desc><style>.h{font:700 30px Arial;fill:#fff}.t{font:700 44px Arial;fill:#0B2E59}.b{font:24px Arial;fill:#383F47}.s{font:600 23px Arial;fill:#0B2E59}</style><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2E59"/><text x="50" y="75" class="h">HEXÁPODE · X044</text><text x="1150" y="75" text-anchor="end" class="h">HEX-X044-439</text><text x="600" y="205" class="t" text-anchor="middle">Trabalho respiratório: reconhecer fadiga iminente</text><rect x="80" y="315" width="600" height="720" rx="28" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><path d="M220 420C150 490 170 750 310 810C365 835 400 760 385 650C370 760 405 835 460 810C600 750 620 490 550 420" fill="#E8A39B" stroke="#0B2E59" stroke-width="8"/><path d="M180 900Q385 1050 590 900" fill="none" stroke="#D65A4A" stroke-width="16"/><path d="M170 520L100 470M600 470L530 520" stroke="#138A8A" stroke-width="12"/><text x="380" y="980" class="s" text-anchor="middle">tiragem + paradoxo + baixo volume corrente</text><rect x="730" y="315" width="390" height="720" rx="28" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><g class="s" text-anchor="middle"><rect x="775" y="375" width="300" height="88" rx="16" fill="#FFF1D8"/><text x="925" y="430">Taquipneia</text><rect x="775" y="495" width="300" height="88" rx="16" fill="#E7F0F8"/><text x="925" y="550">Tiragem</text><rect x="775" y="615" width="300" height="88" rx="16" fill="#F9D9D4"/><text x="925" y="670">Paradoxo abdominal</text><rect x="775" y="735" width="300" height="88" rx="16" fill="#EEE7F6"/><text x="925" y="790">Alteração de consciência</text><rect x="775" y="855" width="300" height="88" rx="16" fill="#E7F5EE"/><text x="925" y="910">Suporte e reavaliação</text></g><rect x="100" y="1110" width="1000" height="320" rx="25" fill="#E9F3F3"/><text x="600" y="1180" class="t" text-anchor="middle">Não espere a exaustão</text><text x="150" y="1260" class="b">A queda aparente do esforço pode significar melhora — ou falência muscular.</text><text x="150" y="1320" class="b">Integre padrão respiratório, gasometria, ventilação minuto e estado mental.</text><text x="150" y="1380" class="b">Escalone suporte antes de hipoventilação e parada.</text><rect y="1490" width="1200" height="110" fill="#0B2E59"/><text x="50" y="1555" class="h">Fonte: HEX-G004-039</text></svg>