<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Elastância aplicada</title><desc id="d">Comparação entre pulmão rígido de alta elastância e pulmão complacente de baixa elastância.</desc><style>.h{font:700 30px Arial;fill:#fff}.t{font:700 44px Arial;fill:#0B2E59}.b{font:24px Arial;fill:#383F47}.s{font:600 23px Arial;fill:#0B2E59}</style><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0B2E59"/><text x="50" y="75" class="h">HEXÁPODE · X044</text><text x="1150" y="75" text-anchor="end" class="h">HEX-X044-436</text><text x="600" y="205" class="t" text-anchor="middle">Elastância: pulmão rígido versus complacente</text><rect x="80" y="320" width="500" height="780" rx="30" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><rect x="620" y="320" width="500" height="780" rx="30" fill="#fff" stroke="#B7C9D9" stroke-width="3"/><text x="330" y="390" class="t" text-anchor="middle">Alta elastância</text><text x="870" y="390" class="t" text-anchor="middle">Baixa elastância</text><path d="M210 520Q330 360 450 520Q330 680 210 520Z" fill="#D8B3AE" stroke="#D65A4A" stroke-width="10"/><path d="M690 520Q870 260 1050 520Q870 840 690 520Z" fill="#F2B5AE" stroke="#4DA06B" stroke-width="10"/><text x="330" y="760" class="s" text-anchor="middle">mais pressão para pouco volume</text><text x="870" y="760" class="s" text-anchor="middle">menos recuo para maior volume</text><text x="330" y="840" class="b" text-anchor="middle">SDRA · fibrose · edema</text><text x="870" y="840" class="b" text-anchor="middle">enfisema · hiperinsuflação</text><path d="M160 1000Q280 760 430 980" fill="none" stroke="#D65A4A" stroke-width="12"/><path d="M680 1000Q860 880 1070 980" fill="none" stroke="#4DA06B" stroke-width="12"/><rect x="100" y="1160" width="1000" height="270" rx="25" fill="#E9F3F3"/><text x="600" y="1230" class="t" text-anchor="middle">Aplicação</text><text x="150" y="1310" class="