<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Ânion gap aplicado</title><desc id="d">Cálculo aplicado do ânion gap, correção por albumina e triagem etiológica.</desc><rect width="1200" height="900" fill="#F7F4EC"/><rect width="1200" height="108" fill="#123A5A"/><text x="52" y="42" font-family="Arial" font-size="18" fill="#DDEAF2">HEXÁPODE · X052 · GASOMETRIA APLICADA</text><text x="52" y="82" font-family="Georgia" font-size="30" font-weight="700" fill="white">Ânion gap aplicado</text><text x="600" y="250" text-anchor="middle" font-family="Georgia" font-size="40" fill="#123A5A">AG = Na⁺ − (Cl⁻ + HCO₃⁻)</text><rect x="70" y="330" width="500" height="280" rx="24" fill="white" stroke="#B84E4E" stroke-width="4"/><text x="320" y="395" text-anchor="middle" font-family="Arial" font-size="26" fill="#B84E4E">AG aumentado</text><text x="320" y="470" text-anchor="middle" font-family="Arial" font-size="19" fill="#3B4248">lactato · cetoácidos · toxinas · uremia</text><rect x="630" y="330" width="500" height="280" rx="24" fill="white" stroke="#2A8C8C" stroke-width="4"/><text x="880" y="395" text-anchor="middle" font-family="Arial" font-size="26" fill="#2A8C8C">AG normal</text><text x="880" y="470" text-anchor="middle" font-family="Arial" font-size="19" fill="#3B4248">diarreia · ATR · cloreto · fístulas</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#123A5A">Corrigir pela albumina quando reduzida</text><text x="1148" y="842" text-anchor="end" font-family="Arial" font-size="15" fill="#3B4248">HEX-X052-515</text></svg>