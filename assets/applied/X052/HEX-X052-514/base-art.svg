<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Fórmula de Winter aplicada</title><desc id="d">Aplicação clínica da fórmula de Winter e interpretação dos desvios da faixa esperada.</desc><rect width="1200" height="900" fill="#F7F4EC"/><rect width="1200" height="108" fill="#123A5A"/><text x="52" y="42" font-family="Arial" font-size="18" fill="#DDEAF2">HEXÁPODE · X052 · GASOMETRIA APLICADA</text><text x="52" y="82" font-family="Georgia" font-size="30" font-weight="700" fill="white">Fórmula de Winter aplicada</text><text x="600" y="260" text-anchor="middle" font-family="Georgia" font-size="42" fill="#123A5A">PaCO₂ esperada = 1,5 × HCO₃⁻ + 8 ± 2</text><line x1="160" y1="650" x2="1040" y2="650" stroke="#3B4248" stroke-width="3"/><line x1="160" y1="650" x2="160" y2="320" stroke="#3B4248" stroke-width="3"/><path d="M190 590C420 530 690 430 1000 340" stroke="#3977A8" stroke-width="34" opacity=".18" fill="none"/><path d="M190 575C420 515 690 415 1000 325" stroke="#3977A8" stroke-width="7" fill="none"/><text x="820" y="290" font-family="Arial" font-size="18" fill="#B84E4E">acima: acidose respiratória associada</text><text x="820" y="440" font-family="Arial" font-size="18" fill="#2A8C8C">abaixo: alcalose respiratória associada</text><text x="600" y="730" text-anchor="middle" font-family="Arial" font-size="18" fill="#3B4248">Usar apenas na acidose metabólica</text><text x="1148" y="842" text-anchor="end" font-family="Arial" font-size="15" fill="#3B4248">HEX-X052-514</text></svg>