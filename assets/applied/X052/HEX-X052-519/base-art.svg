<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Conteúdo arterial e oferta de O₂ aplicados</title><desc id="d">Aplicação de CaO2 e DO2 para distinguir oxigenação, anemia e baixo débito.</desc><rect width="1200" height="900" fill="#F7F4EC"/><rect width="1200" height="108" fill="#123A5A"/><text x="52" y="42" font-family="Arial" font-size="18" fill="#DDEAF2">HEXÁPODE · X052 · GASOMETRIA APLICADA</text><text x="52" y="82" font-family="Georgia" font-size="30" font-weight="700" fill="white">Conteúdo arterial e oferta de O₂ aplicados</text><circle cx="300" cy="420" r="145" fill="#F5D6D0" stroke="#B84E4E" stroke-width="5"/><text x="300" y="405" text-anchor="middle" font-family="Georgia" font-size="38" fill="#123A5A">CaO₂</text><text x="300" y="458" text-anchor="middle" font-family="Arial" font-size="18" fill="#3B4248">1,34 × Hb × SaO₂</text><path d="M450 420H580" stroke="#3B4248" stroke-width="7"/><circle cx="760" cy="420" r="145" fill="#DCEAF3" stroke="#3977A8" stroke-width="5"/><text x="760" y="405" text-anchor="middle" font-family="Georgia" font-size="38" fill="#123A5A">DO₂</text><text x="760" y="458" text-anchor="middle" font-family="Arial" font-size="18" fill="#3B4248">CaO₂ × débito cardíaco</text><text x="600" y="650" text-anchor="middle" font-family="Arial" font-size="20" fill="#3B4248">PaO₂ normal não exclui anemia nem baixo débito</text><text x="1148" y="842" text-anchor="end" font-family="Arial" font-size="15" fill="#3B4248">HEX-X052-519</text></svg>