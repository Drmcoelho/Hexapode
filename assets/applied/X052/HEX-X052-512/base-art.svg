<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Distúrbios ácido-base primários aplicados</title><desc id="d">Matriz clínica de quatro quadrantes para acidose e alcalose metabólicas e respiratórias.</desc><rect width="1200" height="900" fill="#F7F4EC"/><rect width="1200" height="108" fill="#123A5A"/><text x="52" y="42" font-family="Arial" font-size="18" fill="#DDEAF2">HEXÁPODE · X052 · GASOMETRIA APLICADA</text><text x="52" y="82" font-family="Georgia" font-size="30" font-weight="700" fill="white">Distúrbios ácido-base primários aplicados</text><text x="1145" y="68" text-anchor="end" font-family="Arial" font-size="17" fill="#DDEAF2">HEX-X052-512</text><text x="52" y="145" font-family="Arial" font-size="18" fill="#3B4248">Reconhecimento aplicado pelo sentido de pH, PaCO₂ e HCO₃⁻.</text><g font-family="Arial"><rect x="70" y="220" width="500" height="230" rx="22" fill="white" stroke="#B84E4E" stroke-width="4"/><text x="95" y="265" font-size="24" font-weight="700" fill="#B84E4E">Acidose metabólica</text><text x="95" y="330" font-size="21" fill="#3B4248">pH ↓ · HCO₃⁻ ↓</text><text x="95" y="380" font-size="18" fill="#3B4248">avaliar Winter e ânion gap</text><rect x="630" y="220" width="500" height="230" rx="22" fill="white" stroke="#D69B32" stroke-width="4"/><text x="655" y="265" font-size="24" font-weight="700" fill="#D69B32">Alcalose metabólica</text><text x="655" y="330" font-size="21" fill="#3B4248">pH ↑ · HCO₃⁻ ↑</text><text x="655" y="380" font-size="18" fill="#3B4248">avaliar cloro, volume e potássio</text><rect x="70" y="500" width="500" height="230" rx="22" fill="white" stroke="#3977A8" stroke-width="4"/><text x="95" y="545" font-size="24" font-weight="700" fill="#3977A8">Acidose respiratória</text><text x="95" y="610" font-size="21" fill="#3B4248">pH ↓ · PaCO₂ ↑</text><text x="95" y="660" font-size="18" fill="#3B4248">distinguir aguda de crônica</text><rect x="630" y="500" width="500" height="230" rx="22" fill="white" stroke="#2A8C8C" stroke-width="4"/><text x="655" y="545" font-size="24" font-weight="700" fill="#2A8C8C">Alcalose respiratória</text><text x="655" y="610" font-size="21" fill="#3B4248">pH ↑ · PaCO₂ ↓</text><text x="655" y="660" font-size="18" fill="#3B4248">procurar hipóxia, dor e drive</text></g><line x1="52" y1="805" x2="1148" y2="805" stroke="#D8D0C2" stroke-width="2"/><text x="52" y="842" font-family="Arial" font-size="15" fill="#3B4248">Aplicação clínica esquemática · validar compensação</text><text x="1148" y="842" text-anchor="end" font-family="Arial" font-size="15" fill="#3B4248">G012 ↔ A032 ↔ X052</text></svg>