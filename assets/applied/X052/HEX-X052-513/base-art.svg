<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Compensações esperadas aplicadas</title><desc id="d">Árvore decisória aplicada que separa compensação adequada de distúrbio misto.</desc><rect width="1200" height="900" fill="#F7F4EC"/><rect width="1200" height="108" fill="#123A5A"/><text x="52" y="42" font-family="Arial" font-size="18" fill="#DDEAF2">HEXÁPODE · X052 · GASOMETRIA APLICADA</text><text x="52" y="82" font-family="Georgia" font-size="30" font-weight="700" fill="white">Compensações esperadas aplicadas</text><rect x="70" y="260" width="310" height="120" rx="24" fill="white" stroke="#3977A8" stroke-width="4"/><text x="225" y="330" text-anchor="middle" font-family="Arial" font-size="22" fill="#123A5A">Distúrbio primário</text><path d="M380 320H520M520 320V240M520 320V570" stroke="#3B4248" stroke-width="4" fill="none"/><rect x="550" y="170" width="500" height="180" rx="24" fill="#EAF5EE" stroke="#4F8F68" stroke-width="4"/><text x="800" y="240" text-anchor="middle" font-family="Arial" font-size="24" fill="#4F8F68">Compensação adequada</text><text x="800" y="290" text-anchor="middle" font-family="Arial" font-size="18" fill="#3B4248">padrão simples provável</text><rect x="550" y="500" width="500" height="180" rx="24" fill="#FAECE8" stroke="#B84E4E" stroke-width="4"/><text x="800" y="570" text-anchor="middle" font-family="Arial" font-size="24" fill="#B84E4E">Compensação inadequada</text><text x="800" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#3B4248">procurar distúrbio misto</text><line x1="52" y1="805" x2="1148" y2="805" stroke="#D8D0C2"/><text x="52" y="842" font-family="Arial" font-size="15" fill="#3B4248">Aplicação clínica esquemática</text><text x="1148" y="842" text-anchor="end" font-family="Arial" font-size="15" fill="#3B4248">HEX-X052-513</text></svg>