<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Lactato e depuração aplicados</title><desc id="d">Interpretação seriada do lactato, produção, depuração hepática e clearance.</desc><rect width="1200" height="900" fill="#F7F4EC"/><rect width="1200" height="108" fill="#123A5A"/><text x="52" y="42" font-family="Arial" font-size="18" fill="#DDEAF2">HEXÁPODE · X052 · GASOMETRIA APLICADA</text><text x="52" y="82" font-family="Georgia" font-size="30" font-weight="700" fill="white">Lactato e depuração aplicados</text><circle cx="290" cy="420" r="125" fill="#F6D7D2" stroke="#B84E4E" stroke-width="5"/><text x="290" y="410" text-anchor="middle" font-family="Arial" font-size="27" fill="#123A5A">TECIDOS</text><text x="290" y="455" text-anchor="middle" font-family="Arial" font-size="18" fill="#B84E4E">produção</text><path d="M420 420H560" stroke="#B84E4E" stroke-width="8"/><circle cx="730" cy="420" r="125" fill="#E5F0E7" stroke="#4F8F68" stroke-width="5"/><text x="730" y="410" text-anchor="middle" font-family="Arial" font-size="27" fill="#123A5A">FÍGADO</text><text x="730" y="455" text-anchor="middle" font-family="Arial" font-size="18" fill="#4F8F68">depuração</text><text x="600" y="650" text-anchor="middle" font-family="Georgia" font-size="29" fill="#123A5A">clearance = (inicial − final) / inicial × 100</text><text x="600" y="710" text-anchor="middle" font-family="Arial" font-size="18" fill="#3B4248">Interpretar tendência, perfusão e função hepática</text><text x="1148" y="842" text-anchor="end" font-family="Arial" font-size="15" fill="#3B4248">HEX-X052-520</text></svg>