<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Delta gap aplicado</title><desc id="d">Escala aplicada do delta ratio para identificar distúrbios metabólicos combinados.</desc><rect width="1200" height="900" fill="#F7F4EC"/><rect width="1200" height="108" fill="#123A5A"/><text x="52" y="42" font-family="Arial" font-size="18" fill="#DDEAF2">HEXÁPODE · X052 · GASOMETRIA APLICADA</text><text x="52" y="82" font-family="Georgia" font-size="30" font-weight="700" fill="white">Delta gap aplicado</text><text x="600" y="260" text-anchor="middle" font-family="Georgia" font-size="40" fill="#123A5A">Δ ratio = ΔAG / ΔHCO₃⁻</text><rect x="120" y="360" width="180" height="120" fill="#B84E4E"/><rect x="300" y="360" width="180" height="120" fill="#D69B32"/><rect x="480" y="360" width="300" height="120" fill="#4F8F68"/><rect x="780" y="360" width="300" height="120" fill="#3977A8"/><g font-family="Arial" font-size="24" fill="white" text-anchor="middle"><text x="210" y="432">&lt;0,4</text><text x="390" y="432">0,4–0,8</text><text x="630" y="432">0,8–2</text><text x="930" y="432">&gt;2</text></g><g font-family="Arial" font-size="17" fill="#3B4248" text-anchor="middle"><text x="300" y="550">acidose hiperclorêmica associada</text><text x="630" y="550">AG elevado predominante</text><text x="930" y="550">alcalose metabólica associada</text></g><text x="1148" y="842" text-anchor="end" font-family="Arial" font-size="15" fill="#3B4248">HEX-X052-516</text></svg>