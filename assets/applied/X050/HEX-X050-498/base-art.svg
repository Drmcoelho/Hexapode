<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Doença intersticial em exacerbação</title><rect width="1200" height="1600" fill="#f7faf9"/><rect x="70" y="60" width="1060" height="130" rx="28" fill="#073b4c"/><text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="white">INTERSTÍCIO ESPESSADO, DIFUSÃO LIMITADA</text><g stroke="#0f6b6d" stroke-width="8" fill="none"><circle cx="320" cy="600" r="130"/><circle cx="600" cy="600" r="130"/><circle cx="880" cy="600" r="130"/></g><g stroke="#d66a3d" stroke-width="30"><path d="M210 600 H430"/><path d="M490 600 H710"/><path d="M770 600 H990"/></g><g fill="#c94c4c"><circle cx="320" cy="480" r="18"/><circle cx="600" cy="480" r="18"/><circle cx="880" cy="480" r="18"/></g><text x="600" y="850" text-anchor="middle" font-family="Arial" font-size="34">Barreira espessa → transferência de O₂ prejudicada</text><path d="M220 980 Q600 820 980 980" fill="none" stroke="#d99024" stroke-width="14"/><text x="600" y="1070" text-anchor="middle" font-family="Arial" font-size="32">Dessaturação ao esforço pode preceder hipoxemia em repouso</text><rect x="120" y="1190" width="960" height="270" rx="28" fill="#fff3dd" stroke="#d99024" stroke-width="5"/><text x="600" y="1270" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#8c5200">Exacerbação aguda</text><text x="600" y="1335" text-anchor="middle" font-family="Arial" font-size="30">Nova piora + opacidades bilaterais</text><text x="600" y="1390" text-anchor="middle" font-family="Arial" font-size="30">Excluir infecção, edema e tromboembolismo</text></svg>