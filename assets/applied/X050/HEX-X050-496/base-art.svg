<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Edema agudo cardiogênico</title><rect width="1200" height="1600" fill="#f7faf9"/><rect x="70" y="60" width="1060" height="130" rx="28" fill="#073b4c"/><text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="white">EDEMA AGUDO: PRESSÃO → ALVÉOLO</text><circle cx="300" cy="630" r="170" fill="#d66a3d" opacity=".9"/><path d="M300 460 C220 540 220 720 300 800 C380 720 380 540 300 460Z" fill="#fff" opacity=".45"/><path d="M470 630 H690" stroke="#c94c4c" stroke-width="22"/><path d="M680 590 L760 630 L680 670Z" fill="#c94c4c"/><circle cx="900" cy="630" r="180" fill="#d9f0ef" stroke="#0f6b6d" stroke-width="10"/><circle cx="850" cy="590" r="40" fill="#5aa7d6"/><circle cx="945" cy="680" r="48" fill="#5aa7d6"/><text x="300" y="900" text-anchor="middle" font-family="Arial" font-size="32">Pressão de enchimento elevada</text><text x="900" y="900" text-anchor="middle" font-family="Arial" font-size="32">Transudato alveolar</text><rect x="110" y="1100" width="980" height="340" rx="30" fill="#fff3dd" stroke="#d99024" stroke-width="5"/><text x="600" y="1190" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#8c5200">Prioridades</text><text x="600" y="1260" text-anchor="middle" font-family="Arial" font-size="31">Oxigenar e reduzir trabalho respiratório</text><text x="600" y="1320" text-anchor="middle" font-family="Arial" font-size="31">Reduzir pré/pós-carga quando apropriado</text><text x="600" y="1380" text-anchor="middle" font-family="Arial" font-size="31">Tratar a causa cardíaca precipitante</text></svg>