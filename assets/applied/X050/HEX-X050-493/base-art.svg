<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Pneumotórax hipertensivo</title><rect width="1200" height="1600" fill="#f7faf9"/><rect x="70" y="60" width="1060" height="130" rx="28" fill="#073b4c"/><text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="54" font-weight="700" fill="white">PNEUMOTÓRAX HIPERTENSIVO</text><rect x="100" y="250" width="1000" height="900" rx="35" fill="#fff" stroke="#8aa3a8" stroke-width="5"/><path d="M350 400 C230 520 230 800 350 930 C430 840 430 510 350 400Z" fill="#8fd1cc" stroke="#0f6b6d" stroke-width="8"/><path d="M820 450 C740 540 750 770 820 850 C880 760 880 540 820 450Z" fill="#efb65b" stroke="#b75d00" stroke-width="8"/><path d="M900 390 Q1020 650 900 920" fill="none" stroke="#d66a3d" stroke-width="28"/><path d="M620 420 L500 420 L500 930 L620 930" fill="none" stroke="#7b4f8f" stroke-width="18"/><path d="M620 650 H470" stroke="#d66a3d" stroke-width="12"/><text x="300" y="1030" text-anchor="middle" font-family="Arial" font-size="30">Pulmão contralateral comprimido</text><text x="860" y="1030" text-anchor="middle" font-family="Arial" font-size="30">Ar sob pressão</text><rect x="120" y="1210" width="960" height="260" rx="28" fill="#fff3dd" stroke="#d99024" stroke-width="5"/><text x="600" y="1290" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#8c5200">Reconhecer clinicamente</text><text x="600" y="1350" text-anchor="middle" font-family="Arial" font-size="30">Choque + assimetria ventilatória + pressão intratorácica crescente</text><text x="600" y="1410" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#b44720">Descompressão imediata — não esperar imagem</text></svg>