<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Pneumonia grave aplicada</title><rect width="1200" height="1600" fill="#f7faf9"/><rect x="70" y="60" width="1060" height="130" rx="28" fill="#073b4c"/><text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="white">PNEUMONIA GRAVE: FOCO → SEPSE → FALÊNCIA</text><path d="M260 390 C140 520 170 900 350 1010 C470 850 470 520 360 390Z" fill="#9fd6d0" stroke="#0f6b6d" stroke-width="8"/><path d="M940 390 C1060 520 1030 900 850 1010 C730 850 730 520 840 390Z" fill="#9fd6d0" stroke="#0f6b6d" stroke-width="8"/><g fill="#d66a3d"><circle cx="760" cy="650" r="55"/><circle cx="850" cy="720" r="70"/><circle cx="780" cy="820" r="62"/></g><path d="M640 700 H500" stroke="#c94c4c" stroke-width="12"/><text x="350" y="1120" text-anchor="middle" font-family="Arial" font-size="30">Troca gasosa comprometida</text><text x="830" y="1120" text-anchor="middle" font-family="Arial" font-size="30">Consolidação e inflamação</text><rect x="110" y="1200" width="980" height="270" rx="28" fill="white" stroke="#8aa3a8" stroke-width="5"/><text x="600" y="1280" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#073b4c">O que torna grave?</text><text x="600" y="1340" text-anchor="middle" font-family="Arial" font-size="30">Hipoxemia, choque, disfunção orgânica ou necessidade ventilatória</text><text x="600" y="1400" text-anchor="middle" font-family="Arial" font-size="30">Antibiótico precoce + suporte + controle do foco</text></svg>