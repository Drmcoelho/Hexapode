<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Hipertensão pulmonar descompensada</title><rect width="1200" height="1600" fill="#f7faf9"/><rect x="70" y="60" width="1060" height="130" rx="28" fill="#073b4c"/><text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="white">HIPERTENSÃO PULMONAR: CRISE DO VD</text><path d="M300 520 C180 620 200 900 360 980 C460 850 440 610 300 520Z" fill="#9fd6d0" stroke="#0f6b6d" stroke-width="8"/><path d="M900 520 C1020 620 1000 900 840 980 C740 850 760 610 900 520Z" fill="#9fd6d0" stroke="#0f6b6d" stroke-width="8"/><path d="M540 430 V970 M660 430 V970" stroke="#c94c4c" stroke-width="26"/><path d="M600 560 L390 700 M600 560 L810 700" stroke="#c94c4c" stroke-width="20"/><path d="M430 1110 C510 970 680 980 760 1110 C680 1280 510 1280 430 1110Z" fill="#d66a3d" stroke="#8f3217" stroke-width="8"/><text x="600" y="1200" text-anchor="middle" font-family="Arial" font-size="32">VD dilatado, septo deslocado, débito reduzido</text><rect x="120" y="1280" width="960" height="210" rx="28" fill="#fff3dd" stroke="#d99024" stroke-width="5"/><text x="600" y="1360" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#8c5200">Evitar hipóxia, acidose e hipotensão</text><text x="600" y="1420" text-anchor="middle" font-family="Arial" font-size="30">Preservar perfusão do VD e tratar o gatilho</text></svg>