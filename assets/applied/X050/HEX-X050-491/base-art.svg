<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Padrão obstrutivo versus restritivo</title><desc id="d">Comparação didática entre limitação ao fluxo expiratório e redução dos volumes pulmonares, com pistas funcionais e clínicas.</desc><rect width="1200" height="1600" fill="#f7faf9"/><rect x="70" y="60" width="1060" height="130" rx="28" fill="#073b4c"/><text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="white">OBSTRUÇÃO × RESTRIÇÃO</text><rect x="70" y="240" width="500" height="1050" rx="34" fill="#e8f3f2" stroke="#0f6b6d" stroke-width="5"/><rect x="630" y="240" width="500" height="1050" rx="34" fill="#fff3dd" stroke="#d99024" stroke-width="5"/><text x="320" y="320" text-anchor="middle" font-family="Arial" font-size="40" font-weight="700" fill="#0f6b6d">OBSTRUTIVO</text><text x="880" y="320" text-anchor="middle" font-family="Arial" font-size="40" font-weight="700" fill="#a85f00">RESTRITIVO</text><path d="M180 470 C260 390 350 390 430 470 L430 760 C350 700 260 700 180 760Z" fill="#74c9c5" stroke="#073b4c" stroke-width="7"/><path d="M740 500 C810 430 950 430 1020 500 L990 700 C930 650 830 650 770 700Z" fill="#efb65b" stroke="#7a4b00" stroke-width="7"/><path d="M220 900 C300 780 390 1020 470 900" fill="none" stroke="#0f6b6d" stroke-width="12"/><path d="M730 960 C800 820 880 810 1010 860" fill="none" stroke="#d99024" stroke-width="12"/><text x="320" y="1080" text-anchor="middle" font-family="Arial" font-size="31" fill="#17323a">VEF₁/CVF reduzido</text><text x="320" y="1130" text-anchor="middle" font-family="Arial" font-size="31" fill="#17323a">Expiração prolongada</text><text x="320" y="1180" text-anchor="middle" font-family="Arial" font-size="31" fill="#17323a">Aprisionamento aéreo</text><text x="880" y="1080" text-anchor="middle" font-family="Arial" font-size="31" fill="#4d3616">CVF e CPT reduzidas</text><text x="880" y="1130" text-anchor="middle" font-family="Arial" font-size="31" fill="#4d3616">Pulmão pequeno</text><text x="880" y="1180" text-anchor="middle" font-family="Arial" font-size="31" fill="#4d3616">Relação preservada/alta</text><rect x="110" y="1340" width="980" height="170" rx="26" fill="#ffffff" stroke="#8aa3a8" stroke-width="4"/><text x="600" y="1410" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#073b4c">Pergunta-chave</text><text x="600" y="1465" text-anchor="middle" font-family="Arial" font-size="30" fill="#17323a">O problema dominante é esvaziar o pulmão ou expandi-lo?</text></svg>