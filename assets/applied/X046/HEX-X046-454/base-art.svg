<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" role="img"><title>Monitorização ventilatória</title><desc>Curva de pressão com pico, plateau, PEEP e driving pressure.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" fill="white">HEX-X046-454</text><text x="600" y="245" text-anchor="middle" font-family="Arial" font-size="50" font-weight="700" fill="#0A2E57">Monitorização ventilatória</text><rect x="110" y="390" width="980" height="600" rx="30" fill="white" stroke="#A9C4D8" stroke-width="6"/><line x1="180" y1="860" x2="1020" y2="860" stroke="#718096" stroke-width="4"/><polyline points="180,860 240,860 290,520 610,520 650,700 730,700 780,860 1020,860" fill="none" stroke="#1E78B4" stroke-width="14"/><text x="400" y="475" font-family="Arial" font-size="32" font-weight="700">P pico</text><text x="670" y="675" font-family="Arial" font-size="32" font-weight="700">P platô</text><rect x="180" y="1080" width="840" height="180" rx="25" fill="#E4F4F1"/><text x="600" y="1150" text-anchor="middle" font-family="Arial" font-size="34">ΔP = Pplat − PEEP</text><text x="600" y="1210" text-anchor="middle" font-family="Arial" font-size="28">Cest = Vt / ΔP</text><rect y="1500" width="1200" height="100" fill="#073B66"/></svg>