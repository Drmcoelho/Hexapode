<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" role="img"><title>Ajustes iniciais do ventilador</title><desc>Painel com Vt, FR, PEEP, FiO2, fluxo e I:E.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" fill="white">HEX-X046-453</text><text x="600" y="245" text-anchor="middle" font-family="Arial" font-size="50" font-weight="700" fill="#0A2E57">Ajustes iniciais do ventilador</text><rect x="160" y="390" width="880" height="660" rx="36" fill="#0B2638" stroke="#245A85" stroke-width="10"/><g font-family="Arial" font-size="38" fill="white"><text x="240" y="500">Vt</text><text x="240" y="600">FR</text><text x="240" y="700">PEEP</text><text x="240" y="800">FiO₂</text><text x="240" y="900">Fluxo</text><text x="240" y="1000">I:E</text></g><g font-family="Arial" font-size="42" font-weight="700" fill="#45D6C7"><text x="610" y="500">6–8 mL/kg PBW</text><text x="610" y="600">12–20 rpm</text><text x="610" y="700">5–10 cmH₂O</text><text x="610" y="800">titular à SpO₂</text><text x="610" y="900">40–60 L/min</text><text x="610" y="1000">1:2</text></g><text x="600" y="1240" text-anchor="middle" font-family="Arial" font-size="30" fill="#334E68">Ajustar ao fenótipo, gasometria e mecânica</text><rect y="1500" width="1200" height="100" fill="#073B66"/></svg>