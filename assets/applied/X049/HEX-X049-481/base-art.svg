<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Disparo ineficaz aplicado</title><desc id="d">Curvas de esforço, pressão e fluxo mostram tentativa inspiratória do paciente sem ciclo ventilatório, com causas e correções.</desc><rect width="1200" height="800" fill="#F7FAFC"/><rect x="40" y="40" width="1120" height="90" rx="24" fill="#0F4C5C"/><text x="80" y="98" font-family="Arial" font-size="38" font-weight="700" fill="white">DISPARO INEFICAZ — esforço que o ventilador não reconhece</text><g font-family="Arial" fill="#263238"><rect x="55" y="165" width="720" height="500" rx="24" fill="white" stroke="#B0BEC5" stroke-width="3"/><text x="85" y="210" font-size="24" font-weight="700">Curvas sincronizadas</text><line x1="105" y1="300" x2="720" y2="300" stroke="#90A4AE"/><path d="M105 300 C180 300 205 350 250 300 S345 300 405 300 C470 300 490 350 535 300 S635 300 720 300" fill="none" stroke="#F4A261" stroke-width="8"/><text x="105" y="275" font-size="20">esforço</text><line x1="105" y1="430" x2="720" y2="430" stroke="#90A4AE"/><path d="M105 430 L180 430 Q220 455 255 430 L405 430 Q445 455 480 430 L720 430" fill="none" stroke="#2A9D8F" stroke-width="8"/><text x="105" y="405" font-size="20">pressão/fluxo</text><circle cx="220" cy="350" r="16" fill="#D62828"/><circle cx="445" cy="455" r="16" fill="#D62828"/><text x="105" y="535" font-size="23" font-weight="700" fill="#D62828">Pista: deflexão sem insuflação correspondente</text><text x="105" y="580" font-size="21">Auto-PEEP, fraqueza, trigger pouco sensível</text><text x="105" y="615" font-size="21">ou suporte excessivo prolongando a expiração.</text><rect x="810" y="165" width="335" height="500" rx="24" fill="#E7F3F5"/><text x="840" y="215" font-size="25" font-weight="700">Intervenção</text><text x="840" y="265" font-size="21">1. Medir auto-PEEP</text><text x="840" y="310" font-size="21">2. Aumentar sensibilidade</text><text x="840" y="355" font-size="21">3. Reduzir hiperinsuflação</text><text x="840" y="400" font-size="21">4. Rever suporte e sedação</text><path d="M840 470 H1090" stroke="#0F4C5C" stroke-width="5"/><text x="840" y="520" font-size="23" font-weight="700">Objetivo</text><text x="840" y="560" font-size="20">Cada esforço útil deve</text><text x="840" y="590" font-size="20">produzir um ciclo.</text></g><text x="55" y="755" font-family="Arial" font-size="18" fill="#546E7A">HEX-X049-481 · Hexápode · aplicação clínica</text></svg>