<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Duplo disparo aplicado</title><desc id="d">Dois ciclos ventilatórios consecutivos para um único esforço prolongado, com empilhamento de volume e medidas corretivas.</desc><rect width="1200" height="800" fill="#F7FAFC"/><rect x="40" y="40" width="1120" height="90" rx="24" fill="#0F4C5C"/><text x="80" y="98" font-family="Arial" font-size="38" font-weight="700" fill="white">DUPLO DISPARO — demanda neural maior que o tempo inspiratório</text><g font-family="Arial" fill="#263238"><rect x="55" y="165" width="720" height="500" rx="24" fill="white" stroke="#B0BEC5" stroke-width="3"/><text x="85" y="210" font-size="24" font-weight="700">Um esforço, dois ciclos</text><path d="M105 330 C180 330 200 250 300 250 S420 330 500 330" fill="none" stroke="#F4A261" stroke-width="8"/><path d="M105 450 H190 V360 H340 V450 H350 V360 H500 V450 H720" fill="none" stroke="#2A9D8F" stroke-width="8"/><text x="105" y="300" font-size="20">esforço neural prolongado</text><text x="105" y="490" font-size="20">fluxo/volume: dois ciclos quase contíguos</text><rect x="105" y="540" width="600" height="80" rx="16" fill="#FDECEC"/><text x="130" y="575" font-size="22" font-weight="700" fill="#B71C1C">Risco: breath stacking → volume corrente excessivo</text><text x="130" y="605" font-size="19">e maior pressão transpulmonar.</text><rect x="810" y="165" width="335" height="500" rx="24" fill="#E7F3F5"/><text x="840" y="215" font-size="25" font-weight="700">Corrigir</text><text x="840" y="265" font-size="21">• Aumentar tempo inspiratório</text><text x="840" y="310" font-size="21">• Ajustar fluxo inspiratório</text><text x="840" y="355" font-size="21">• Tratar dor/acidose</text><text x="840" y="400" font-size="21">• Rever modo ventilatório</text><path d="M840 470 H1090" stroke="#0F4C5C" stroke-width="5"/><text x="840" y="520" font-size="23" font-weight="700">Confirme</text><text x="840" y="560" font-size="20">Dois ciclos separados por</text><text x="840" y="590" font-size="20">expiração mínima.</text></g><text x="55" y="755" font-family="Arial" font-size="18" fill="#546E7A">HEX-X049-482 · Hexápode · aplicação clínica</text></svg>