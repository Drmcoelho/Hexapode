<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Mapa aplicado de correção das assincronias</title><desc id="d">Fluxograma relaciona padrão observado, mecanismo provável e ajuste inicial para assincronias comuns.</desc><rect width="1200" height="800" fill="#F7FAFC"/><rect x="40" y="40" width="1120" height="90" rx="24" fill="#0F4C5C"/><text x="80" y="98" font-family="Arial" font-size="38" font-weight="700" fill="white">ASSINCRONIA: reconhecer → explicar → corrigir</text><g font-family="Arial" fill="#263238"><rect x="60" y="170" width="330" height="500" rx="24" fill="#E7F3F5"/><text x="90" y="220" font-size="25" font-weight="700">Padrão na curva</text><text x="90" y="275" font-size="20">Sem ciclo após esforço</text><text x="90" y="330" font-size="20">Dois ciclos seguidos</text><text x="90" y="385" font-size="20">Concavidade inspiratória</text><text x="90" y="440" font-size="20">Ti curto / Ti longo</text><text x="90" y="495" font-size="20">Fluxo não zera</text><rect x="435" y="170" width="330" height="500" rx="24" fill="white" stroke="#B0BEC5" stroke-width="3"/><text x="465" y="220" font-size="25" font-weight="700">Mecanismo</text><text x="465" y="275" font-size="20">Trigger / auto-PEEP</text><text x="465" y="330" font-size="20">Drive &gt; Ti programado</text><text x="465" y="385" font-size="20">Fluxo insuficiente</text><text x="465" y="440" font-size="20">Ciclagem inadequada</text><text x="465" y="495" font-size="20">Expiração incompleta</text><rect x="810" y="170" width="330" height="500" rx="24" fill="#FFF3E0"/><text x="840" y="220" font-size="25" font-weight="700">Primeiro ajuste</text><text x="840" y="275" font-size="20">Sensibilidade + expiração</text><text x="840" y="330" font-size="20">Fluxo/Ti + tratar drive</text><text x="840" y="385" font-size="20">Elevar fluxo/suporte</text><text x="840" y="440" font-size="20">Ajustar critério de ciclo</text><text x="840" y="495" font-size="20">Reduzir FR/Vt; broncodilatar</text><path d="M390 420 H435 M765 420 H810" stroke="#0F4C5C" stroke-width="7" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0F4C5C"/></marker></defs><text x="55" y="755" font-family="Arial" font-size="18" fill="#546E7A">HEX-X049-490 · Hexápode · mapa de decisão</text></svg>