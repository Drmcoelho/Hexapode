<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Reverse trigger aplicado</title><desc id="d">Ciclo mandatório antecede esforço diafragmático com atraso fixo, podendo gerar empilhamento e lesão.</desc><rect width="1200" height="800" fill="#F7FAFC"/><rect x="40" y="40" width="1120" height="90" rx="24" fill="#0F4C5C"/><text x="80" y="98" font-family="Arial" font-size="38" font-weight="700" fill="white">REVERSE TRIGGER — o ventilador dispara o paciente</text><g font-family="Arial" fill="#263238"><rect x="55" y="165" width="720" height="500" rx="24" fill="white" stroke="#B0BEC5" stroke-width="3"/><text x="85" y="210" font-size="24" font-weight="700">Relação temporal característica</text><path d="M105 340 H175 V250 H315 V340 H390 V250 H530 V340 H720" fill="none" stroke="#2A9D8F" stroke-width="8"/><path d="M105 470 C210 470 235 405 300 405 S410 470 470 470 C520 470 545 405 610 405 S690 470 720 470" fill="none" stroke="#F4A261" stroke-width="8"/><line x1="245" y1="240" x2="290" y2="395" stroke="#D62828" stroke-width="4" stroke-dasharray="10 8"/><text x="105" y="305" font-size="20">ciclo mandatório</text><text x="105" y="515" font-size="20">esforço diafragmático atrasado e repetitivo</text><text x="105" y="570" font-size="22" font-weight="700" fill="#B71C1C">Pista: acoplamento com latência quase constante</text><rect x="810" y="165" width="335" height="500" rx="24" fill="#E7F3F5"/><text x="840" y="215" font-size="25" font-weight="700">Conduta</text><text x="840" y="265" font-size="21">• Confirmar nas curvas</text><text x="840" y="310" font-size="21">• Reduzir drive excessivo</text><text x="840" y="355" font-size="21">• Ajustar frequência/tempo</text><text x="840" y="400" font-size="21">• Evitar stacking</text><path d="M840 470 H1090" stroke="#0F4C5C" stroke-width="5"/><text x="840" y="520" font-size="23" font-weight="700">Não confundir</text><text x="840" y="560" font-size="20">com trigger convencional:</text><text x="840" y="590" font-size="20">a ordem é invertida.</text></g><text x="55" y="755" font-family="Arial" font-size="18" fill="#546E7A">HEX-X049-483 · Hexápode · aplicação clínica</text></svg>