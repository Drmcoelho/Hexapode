<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Ciclagem precoce aplicada</title><desc id="d">O ventilador encerra a inspiração antes do término do esforço neural, favorecendo duplo disparo.</desc><rect width="1200" height="800" fill="#F7FAFC"/><rect x="40" y="40" width="1120" height="90" rx="24" fill="#0F4C5C"/><text x="80" y="98" font-family="Arial" font-size="38" font-weight="700" fill="white">CICLAGEM PRECOCE — inspiração termina cedo demais</text><g font-family="Arial" fill="#263238"><rect x="60" y="170" width="700" height="470" rx="24" fill="white" stroke="#B0BEC5" stroke-width="3"/><path d="M100 440 C170 440 190 270 350 270 S540 440 690 440" fill="none" stroke="#F4A261" stroke-width="8"/><path d="M100 440 H180 V310 H360 V440 H690" fill="none" stroke="#2A9D8F" stroke-width="8"/><line x1="360" y1="250" x2="360" y2="490" stroke="#D62828" stroke-width="4" stroke-dasharray="10 8"/><text x="100" y="225" font-size="24" font-weight="700">Fluxo cessa enquanto o esforço persiste</text><text x="100" y="535" font-size="21">Comum em tempo inspiratório curto ou ciclagem muito alta.</text><rect x="800" y="170" width="340" height="470" rx="24" fill="#E7F3F5"/><text x="835" y="225" font-size="25" font-weight="700">Correção</text><text x="835" y="280" font-size="21">• Prolongar Ti</text><text x="835" y="325" font-size="21">• Reduzir % de ciclagem</text><text x="835" y="370" font-size="21">• Aumentar suporte se baixo</text><text x="835" y="415" font-size="21">• Tratar drive aumentado</text></g><text x="55" y="755" font-family="Arial" font-size="18" fill="#546E7A">HEX-X049-486 · Hexápode</text></svg>