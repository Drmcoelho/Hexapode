<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Auto-PEEP dinâmica aplicada</title><desc id="d">Fluxo expiratório não retorna a zero antes do ciclo seguinte, indicando aprisionamento aéreo e carga limiar.</desc><rect width="1200" height="800" fill="#F7FAFC"/><rect x="40" y="40" width="1120" height="90" rx="24" fill="#0F4C5C"/><text x="80" y="98" font-family="Arial" font-size="38" font-weight="700" fill="white">AUTO-PEEP DINÂMICA — expiração incompleta</text><g font-family="Arial" fill="#263238"><rect x="60" y="170" width="700" height="470" rx="24" fill="white" stroke="#B0BEC5" stroke-width="3"/><line x1="100" y1="400" x2="700" y2="400" stroke="#90A4AE" stroke-width="3"/><path d="M100 400 C170 400 190 250 280 250 C330 250 350 520 480 520 C560 520 590 400 700 400" fill="none" stroke="#2A9D8F" stroke-width="9"/><line x1="480" y1="370" x2="480" y2="540" stroke="#D62828" stroke-width="4" stroke-dasharray="10 8"/><text x="100" y="225" font-size="24" font-weight="700">Fluxo expiratório permanece abaixo de zero</text><text x="100" y="570" font-size="21">Aumenta trabalho para disparar e favorece disparos ineficazes.</text><rect x="800" y="170" width="340" height="470" rx="24" fill="#E7F3F5"/><text x="835" y="225" font-size="25" font-weight="700">Reduzir hiperinsuflação</text><text x="835" y="280" font-size="21">• Menor FR e Vt</text><text x="835" y="325" font-size="21">• Maior fluxo inspiratório</text><text x="835" y="370" font-size="21">• Broncodilatação</text><text x="835" y="415" font-size="21">• PEEP externa criteriosa</text></g><text x="55" y="755" font-family="Arial" font-size="18" fill="#546E7A">HEX-X049-489 · Hexápode</text></svg>