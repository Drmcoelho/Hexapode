<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Breath stacking aplicado</title><desc id="d">Dois ciclos sucessivos acumulam volume antes de expiração completa, elevando volume e pressão alveolar.</desc><rect width="1200" height="800" fill="#F7FAFC"/><rect x="40" y="40" width="1120" height="90" rx="24" fill="#0F4C5C"/><text x="80" y="98" font-family="Arial" font-size="38" font-weight="700" fill="white">BREATH STACKING — volume se soma antes da expiração</text><g font-family="Arial" fill="#263238"><rect x="60" y="170" width="700" height="470" rx="24" fill="white" stroke="#B0BEC5" stroke-width="3"/><path d="M100 500 H170 V410 H330 V320 H500 V500 H690" fill="none" stroke="#2A9D8F" stroke-width="10"/><line x1="330" y1="300" x2="330" y2="520" stroke="#D62828" stroke-width="4" stroke-dasharray="10 8"/><text x="100" y="225" font-size="24" font-weight="700">Volume: segundo ciclo começa antes do retorno à linha de base</text><text x="100" y="555" font-size="21">Consequência: Vt total oculto, sobredistensão e driving pressure maior.</text><rect x="800" y="170" width="340" height="470" rx="24" fill="#E7F3F5"/><text x="835" y="225" font-size="25" font-weight="700">Interromper o mecanismo</text><text x="835" y="280" font-size="21">• Corrigir duplo disparo</text><text x="835" y="325" font-size="21">• Adequar Ti e fluxo</text><text x="835" y="370" font-size="21">• Tratar drive excessivo</text><text x="835" y="415" font-size="21">• Medir Vt somado</text></g><text x="55" y="755" font-family="Arial" font-size="18" fill="#546E7A">HEX-X049-488 · Hexápode</text></svg>