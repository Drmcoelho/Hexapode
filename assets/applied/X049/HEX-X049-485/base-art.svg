<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Fome de fluxo aplicada</title><desc id="d">Curva de pressão côncava durante inspiração indica fluxo insuficiente para a demanda do paciente.</desc><rect width="1200" height="800" fill="#F7FAFC"/><rect x="40" y="40" width="1120" height="90" rx="24" fill="#0F4C5C"/><text x="80" y="98" font-family="Arial" font-size="38" font-weight="700" fill="white">FOME DE FLUXO — demanda inspiratória não atendida</text><g font-family="Arial" fill="#263238"><rect x="60" y="170" width="700" height="470" rx="24" fill="white" stroke="#B0BEC5" stroke-width="3"/><path d="M100 470 H170 C210 300 420 300 500 470 H700" fill="none" stroke="#D62828" stroke-width="9"/><path d="M100 470 H170 C230 220 430 220 500 470 H700" fill="none" stroke="#2A9D8F" stroke-width="5" stroke-dasharray="12 10"/><text x="100" y="225" font-size="24" font-weight="700">Pressão: concavidade para dentro</text><text x="100" y="535" font-size="21">Paciente “puxa” mais fluxo do que o ventilador entrega.</text><rect x="800" y="170" width="340" height="470" rx="24" fill="#E7F3F5"/><text x="835" y="225" font-size="25" font-weight="700">Ajustar</text><text x="835" y="280" font-size="21">• Aumentar fluxo em VCV</text><text x="835" y="325" font-size="21">• Elevar suporte/pressão</text><text x="835" y="370" font-size="21">• Tratar dor, febre, acidose</text><text x="835" y="415" font-size="21">• Rever demanda metabólica</text></g><text x="55" y="755" font-family="Arial" font-size="18" fill="#546E7A">HEX-X049-485 · Hexápode</text></svg>