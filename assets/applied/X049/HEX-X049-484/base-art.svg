<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Auto-trigger aplicado</title><desc id="d">Ciclos ventilatórios surgem sem esforço do paciente por vazamento, condensado ou sensibilidade excessiva.</desc><rect width="1200" height="800" fill="#F7FAFC"/><rect x="40" y="40" width="1120" height="90" rx="24" fill="#0F4C5C"/><text x="80" y="98" font-family="Arial" font-size="38" font-weight="700" fill="white">AUTO-TRIGGER — ciclo sem esforço do paciente</text><g font-family="Arial" fill="#263238"><rect x="60" y="170" width="700" height="470" rx="24" fill="white" stroke="#B0BEC5" stroke-width="3"/><path d="M100 350 H170 V260 H300 V350 H370 V260 H500 V350 H570 V260 H700" fill="none" stroke="#2A9D8F" stroke-width="8"/><path d="M100 470 H700" stroke="#F4A261" stroke-width="8"/><text x="100" y="225" font-size="24" font-weight="700">Ventilador cicla; esforço permanece ausente</text><text x="100" y="520" font-size="21">Pistas: vazamento, água no circuito, oscilação cardíaca.</text><rect x="800" y="170" width="340" height="470" rx="24" fill="#E7F3F5"/><text x="835" y="225" font-size="25" font-weight="700">Correção</text><text x="835" y="280" font-size="21">• Drenar condensado</text><text x="835" y="325" font-size="21">• Corrigir vazamentos</text><text x="835" y="370" font-size="21">• Reduzir sensibilidade</text><text x="835" y="415" font-size="21">• Rever circuito/cuff</text></g><text x="55" y="755" font-family="Arial" font-size="18" fill="#546E7A">HEX-X049-484 · Hexápode</text></svg>