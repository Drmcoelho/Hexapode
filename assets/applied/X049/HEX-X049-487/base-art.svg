<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Ciclagem tardia aplicada</title><desc id="d">O ventilador mantém a inspiração após o término do esforço do paciente, gerando expiração ativa contra fluxo inspiratório.</desc><rect width="1200" height="800" fill="#F7FAFC"/><rect x="40" y="40" width="1120" height="90" rx="24" fill="#0F4C5C"/><text x="80" y="98" font-family="Arial" font-size="38" font-weight="700" fill="white">CICLAGEM TARDIA — inspiração persiste além do esforço</text><g font-family="Arial" fill="#263238"><rect x="60" y="170" width="700" height="470" rx="24" fill="white" stroke="#B0BEC5" stroke-width="3"/><path d="M100 440 C170 440 190 270 330 270 S450 440 500 440 H690" fill="none" stroke="#F4A261" stroke-width="8"/><path d="M100 440 H180 V310 H570 V440 H690" fill="none" stroke="#2A9D8F" stroke-width="8"/><line x1="500" y1="250" x2="500" y2="490" stroke="#D62828" stroke-width="4" stroke-dasharray="10 8"/><text x="100" y="225" font-size="24" font-weight="700">Esforço termina; ventilador continua insuflando</text><text x="100" y="535" font-size="21">Pode haver pico expiratório e desconforto no fim do ciclo.</text><rect x="800" y="170" width="340" height="470" rx="24" fill="#E7F3F5"/><text x="835" y="225" font-size="25" font-weight="700">Correção</text><text x="835" y="280" font-size="21">• Encurtar Ti</text><text x="835" y="325" font-size="21">• Aumentar % ciclagem</text><text x="835" y="370" font-size="21">• Reduzir suporte excessivo</text><text x="835" y="415" font-size="21">• Rever resistência expiratória</text></g><text x="55" y="755" font-family="Arial" font-size="18" fill="#546E7A">HEX-X049-487 · Hexápode</text></svg>