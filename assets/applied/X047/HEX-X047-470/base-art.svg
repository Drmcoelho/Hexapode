<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Driving pressure aplicado</title><desc id="desc">Comparação didática entre PEEP, plateau e driving pressure, com pulmão mais complacente e menos complacente.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" font-weight="400" fill="white" text-anchor="start">HEX-X047-470</text> <text x="600" y="245" font-family="Arial" font-size="48" font-weight="700" fill="#0A2E57" text-anchor="middle">Driving pressure aplicado</text><rect x="120" y="380" width="960" height="690" rx="28" fill="white" stroke="#A9C4D8" stroke-width="6"/><text x="350" y="455" font-family="Arial" font-size="30" font-weight="700" fill="#0B8F87" text-anchor="middle">pulmão mais complacente</text><text x="850" y="455" font-family="Arial" font-size="30" font-weight="700" fill="#D56B45" text-anchor="middle">pulmão menos complacente</text><line x1="600" y1="460" x2="600" y2="1000" stroke="#D3DFE7" stroke-width="4"/><rect x="220" y="760" width="260" height="120" fill="#E4F4F1" stroke="#0B8F87" stroke-width="6"/><rect x="720" y="760" width="260" height="120" fill="#FCE7DF" stroke="#D56B45" stroke-width="6"/><line x1="350" y1="760" x2="350" y2="580" stroke="#0B8F87" stroke-width="16"/><line x1="850" y1="760" x2="850" y2="500" stroke="#D56B45" stroke-width="16"/><text x="350" y="820" font-family="Arial" font-size="28" font-weight="700" fill="#0A2E57" text-anchor="middle">PEEP</text><text x="350" y="560" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="middle">Pplat</text><text x="850" y="820" font-family="Arial" font-size="28" font-weight="700" fill="#0A2E57" text-anchor="middle">PEEP</text><text x="850" y="480" font-family="Arial" font-size="28" font-weight="700" fill="#D56B45" text-anchor="middle">Pplat</text><text x="600" y="1110" font-family="Arial" font-size="36" font-weight="700" fill="#0A2E57" text-anchor="middle">ΔP = Pplat − PEEP</text><rect x="70" y="1230" width="1060" height="180" rx="28" fill="#E4F4F1" stroke="#9BCFC8" stroke-width="4"/><text x="105" y="1300" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">LEITURA CLÍNICA</text><text x="105" y="1360" font-family="Arial" font-size="28" font-weight="400" fill="#334E68" text-anchor="start">A driving pressure é uma diferença, não uma configuração isolada: interprete-a com volume corrente, complacência e contexto clínico.</text></svg>