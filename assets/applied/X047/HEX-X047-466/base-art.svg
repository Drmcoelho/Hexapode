<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Pausa inspiratória e plateau</title><desc id="desc">Curva de pressão mostrando pressão de pico, pausa inspiratória, plateau e PEEP.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" font-weight="400" fill="white" text-anchor="start">HEX-X047-466</text> <text x="600" y="245" font-family="Arial" font-size="48" font-weight="700" fill="#0A2E57" text-anchor="middle">Pausa inspiratória e plateau</text><rect x="120" y="380" width="960" height="690" rx="28" fill="white" stroke="#A9C4D8" stroke-width="6"/><line x1="220" y1="920" x2="980" y2="920" stroke="#526B7A" stroke-width="5"/><line x1="220" y1="920" x2="220" y2="480" stroke="#526B7A" stroke-width="5"/><text x="998" y="930" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="start">tempo</text><text x="208" y="462" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="end">variável</text><path d="M220 920 L280 920 L320 470 L400 470 L400 610 L620 610 L620 920 L980 920" fill="none" stroke="#1E78B4" stroke-width="14"/><line x1="320" y1="470" x2="400" y2="470" stroke="#D56B45" stroke-width="8"/><line x1="400" y1="610" x2="620" y2="610" stroke="#0B8F87" stroke-width="8"/><text x="330" y="440" font-family="Arial" font-size="27" font-weight="700" fill="#D56B45" text-anchor="start">Ppico</text><text x="480" y="585" font-family="Arial" font-size="27" font-weight="700" fill="#0B8F87" text-anchor="start">Pplat</text><text x="730" y="900" font-family="Arial" font-size="27" font-weight="700" fill="#334E68" text-anchor="start">PEEP</text><text x="600" y="1160" font-family="Arial" font-size="34" font-weight="700" fill="#0A2E57" text-anchor="middle">ΔP = Pplat − PEEP</text><rect x="70" y="1230" width="1060" height="180" rx="28" fill="#E4F4F1" stroke="#9BCFC8" stroke-width="4"/><text x="105" y="1300" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">LEITURA CLÍNICA</text><text x="105" y="1360" font-family="Arial" font-size="28" font-weight="400" fill="#334E68" text-anchor="start">A pausa separa o componente resistivo do elástico: driving pressure = Pplat − PEEP.</text></svg>