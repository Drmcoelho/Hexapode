<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Ciclagem aplicada</title><desc id="desc">Comparação entre tempo neural inspiratório e ciclagem do ventilador, com ciclagem precoce e tardia.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" font-weight="400" fill="white" text-anchor="start">HEX-X047-469</text> <text x="600" y="245" font-family="Arial" font-size="48" font-weight="700" fill="#0A2E57" text-anchor="middle">Ciclagem aplicada</text><rect x="120" y="380" width="960" height="690" rx="28" fill="white" stroke="#A9C4D8" stroke-width="6"/><line x1="230" y1="610" x2="990" y2="610" stroke="#526B7A" stroke-width="4"/><line x1="230" y1="900" x2="990" y2="900" stroke="#526B7A" stroke-width="4"/><text x="190" y="620" font-family="Arial" font-size="24" font-weight="700" fill="#D56B45" text-anchor="end">paciente</text><text x="190" y="910" font-family="Arial" font-size="24" font-weight="700" fill="#1E78B4" text-anchor="end">ventilador</text><path d="M260 610 C340 500 470 480 650 610" fill="none" stroke="#D56B45" stroke-width="14"/><path d="M260 900 C340 760 500 700 760 900" fill="none" stroke="#1E78B4" stroke-width="14"/><line x1="650" y1="470" x2="650" y2="980" stroke="#6D4C9A" stroke-width="6" stroke-dasharray="14 12"/><line x1="760" y1="650" x2="760" y2="980" stroke="#0B8F87" stroke-width="6" stroke-dasharray="14 12"/><text x="520" y="470" font-family="Arial" font-size="27" font-weight="700" fill="#D56B45" text-anchor="start">tempo neural</text><text x="700" y="650" font-family="Arial" font-size="27" font-weight="700" fill="#6D4C9A" text-anchor="start">ciclagem</text><text x="780" y="1030" font-family="Arial" font-size="27" font-weight="700" fill="#0B8F87" text-anchor="start">tardia</text><rect x="70" y="1230" width="1060" height="180" rx="28" fill="#E4F4F1" stroke="#9BCFC8" stroke-width="4"/><text x="105" y="1300" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">LEITURA CLÍNICA</text><text x="105" y="1360" font-family="Arial" font-size="28" font-weight="400" fill="#334E68" text-anchor="start">Na PSV, o momento de ciclagem deve acompanhar o tempo neural; dessincronia altera conforto, volume e trabalho respiratório.</text></svg>