<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Loop pressão–volume aplicado</title><desc id="desc">Loop pressão-volume com ramo inspiratório, ramo expiratório, recrutamento e sobredistensão.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" font-weight="400" fill="white" text-anchor="start">HEX-X047-464</text> <text x="600" y="245" font-family="Arial" font-size="48" font-weight="700" fill="#0A2E57" text-anchor="middle">Loop pressão–volume aplicado</text><rect x="120" y="380" width="960" height="690" rx="28" fill="white" stroke="#A9C4D8" stroke-width="6"/><line x1="230" y1="950" x2="990" y2="950" stroke="#526B7A" stroke-width="5"/><line x1="230" y1="950" x2="230" y2="470" stroke="#526B7A" stroke-width="5"/><text x="1000" y="980" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="start">volume</text><text x="205" y="450" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="end">pressão</text><path d="M260 920 C320 880 360 740 430 610 C500 500 650 470 800 510 C900 540 940 650 930 780 C920 880 780 920 620 930 C470 940 350 945 260 920Z" fill="#DCEAF5" fill-opacity=".65" stroke="#1E78B4" stroke-width="14"/><line x1="420" y1="590" x2="420" y2="920" stroke="#D56B45" stroke-width="4" stroke-dasharray="10 10"/><line x1="800" y1="510" x2="800" y2="920" stroke="#D56B45" stroke-width="4" stroke-dasharray="10 10"/><text x="350" y="560" font-family="Arial" font-size="27" font-weight="700" fill="#D56B45" text-anchor="start">recrutamento</text><text x="790" y="470" font-family="Arial" font-size="27" font-weight="700" fill="#D56B45" text-anchor="start">sobredistensão</text><text x="585" y="800" font-family="Arial" font-size="30" font-weight="700" fill="#6D4C9A" text-anchor="middle">histerese</text><rect x="70" y="1230" width="1060" height="180" rx="28" fill="#E4F4F1" stroke="#9BCFC8" stroke-width="4"/><text x="105" y="1300" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">LEITURA CLÍNICA</text><text x="105" y="1360" font-family="Arial" font-size="28" font-weight="400" fill="#334E68" text-anchor="start">A inclinação representa complacência; a forma do loop ajuda a discutir recrutamento, sobredistensão e custo mecânico.</text></svg>