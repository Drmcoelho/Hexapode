<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Auto-PEEP aplicada</title><desc id="desc">Fluxo expiratório que não retorna ao zero antes do próximo disparo, gerando pressão positiva intrínseca.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" font-weight="400" fill="white" text-anchor="start">HEX-X047-467</text> <text x="600" y="245" font-family="Arial" font-size="48" font-weight="700" fill="#0A2E57" text-anchor="middle">Auto-PEEP aplicada</text><rect x="120" y="380" width="960" height="690" rx="28" fill="white" stroke="#A9C4D8" stroke-width="6"/><line x1="220" y1="920" x2="980" y2="920" stroke="#526B7A" stroke-width="5"/><line x1="220" y1="920" x2="220" y2="480" stroke="#526B7A" stroke-width="5"/><text x="998" y="930" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="start">tempo</text><text x="208" y="462" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="end">variável</text><polyline points="220,920 270,920 320,600 390,700 460,790 530,850 600,885 670,900 740,905 810,908 880,910 980,910" fill="none" stroke="#D56B45" stroke-width="14"/><line x1="220" y1="920" x2="980" y2="920" stroke="#0B8F87" stroke-width="4" stroke-dasharray="12 10"/><line x1="220" y1="910" x2="980" y2="910" stroke="#D56B45" stroke-width="4" stroke-dasharray="12 10"/><text x="690" y="870" font-family="Arial" font-size="28" font-weight="700" fill="#D56B45" text-anchor="start">não chega ao zero</text><text x="700" y="945" font-family="Arial" font-size="24" font-weight="400" fill="#0B8F87" text-anchor="start">zero de fluxo</text><text x="560" y="1030" font-family="Arial" font-size="32" font-weight="700" fill="#6D4C9A" text-anchor="middle">PEEP intrínseca</text><rect x="70" y="1230" width="1060" height="180" rx="28" fill="#E4F4F1" stroke="#9BCFC8" stroke-width="4"/><text x="105" y="1300" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">LEITURA CLÍNICA</text><text x="105" y="1360" font-family="Arial" font-size="28" font-weight="400" fill="#334E68" text-anchor="start">Se a expiração termina antes do esvaziamento, o próximo ciclo começa sobre volume residual: procure auto-PEEP.</text></svg>