<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Fluxo × tempo aplicado</title><desc id="desc">Fluxograma respiratório com fluxo inspiratório positivo, fluxo expiratório negativo e retorno ao zero.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" font-weight="400" fill="white" text-anchor="start">HEX-X047-461</text> <text x="600" y="245" font-family="Arial" font-size="48" font-weight="700" fill="#0A2E57" text-anchor="middle">Fluxo × tempo aplicado</text><rect x="120" y="380" width="960" height="690" rx="28" fill="white" stroke="#A9C4D8" stroke-width="6"/><line x1="220" y1="920" x2="980" y2="920" stroke="#526B7A" stroke-width="5"/><line x1="220" y1="920" x2="220" y2="480" stroke="#526B7A" stroke-width="5"/><text x="998" y="930" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="start">tempo</text><text x="208" y="462" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="end">variável</text><line x1="220" y1="920" x2="980" y2="920" stroke="#526B7A" stroke-width="5"/><polyline points="220,920 250,920 285,560 360,610 450,690 540,760 630,815 720,860 810,895 900,920 980,920" fill="none" stroke="#1E78B4" stroke-width="12"/><polyline points="220,920 250,920 310,1040 390,1010 470,980 550,955 630,940 710,928 800,922 900,920 980,920" fill="none" stroke="#D56B45" stroke-width="12"/><text x="270" y="500" font-family="Arial" font-size="28" font-weight="700" fill="#1E78B4" text-anchor="start">inspiração</text><text x="320" y="1050" font-family="Arial" font-size="28" font-weight="700" fill="#D56B45" text-anchor="start">expiração</text><text x="760" y="880" font-family="Arial" font-size="25" font-weight="400" fill="#334E68" text-anchor="start">retorno ao zero</text><rect x="70" y="1230" width="1060" height="180" rx="28" fill="#E4F4F1" stroke="#9BCFC8" stroke-width="4"/><text x="105" y="1300" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">LEITURA CLÍNICA</text><text x="105" y="1360" font-family="Arial" font-size="28" font-weight="400" fill="#334E68" text-anchor="start">O fluxo expiratório deve retornar a zero antes do próximo ciclo; se não retorna, suspeite de aprisionamento aéreo.</text></svg>