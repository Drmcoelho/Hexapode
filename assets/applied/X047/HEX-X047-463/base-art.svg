<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Volume × tempo aplicado</title><desc id="desc">Curva de volume que sobe durante a inspiração, atinge o volume corrente e retorna na expiração.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" font-weight="400" fill="white" text-anchor="start">HEX-X047-463</text> <text x="600" y="245" font-family="Arial" font-size="48" font-weight="700" fill="#0A2E57" text-anchor="middle">Volume × tempo aplicado</text><rect x="120" y="380" width="960" height="690" rx="28" fill="white" stroke="#A9C4D8" stroke-width="6"/><line x1="220" y1="920" x2="980" y2="920" stroke="#526B7A" stroke-width="5"/><line x1="220" y1="920" x2="220" y2="480" stroke="#526B7A" stroke-width="5"/><text x="998" y="930" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="start">tempo</text><text x="208" y="462" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="end">variável</text><polyline points="220,920 280,920 330,820 380,690 430,570 480,510 560,510 640,510 700,570 750,690 800,820 850,920 980,920" fill="none" stroke="#2E86AB" stroke-width="14"/><line x1="220" y1="510" x2="980" y2="510" stroke="#D3DFE7" stroke-width="3" stroke-dasharray="10 10"/><text x="700" y="495" font-family="Arial" font-size="28" font-weight="700" fill="#2E86AB" text-anchor="start">VT</text><text x="720" y="965" font-family="Arial" font-size="24" font-weight="400" fill="#334E68" text-anchor="start">zero de volume</text><rect x="70" y="1230" width="1060" height="180" rx="28" fill="#E4F4F1" stroke="#9BCFC8" stroke-width="4"/><text x="105" y="1300" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">LEITURA CLÍNICA</text><text x="105" y="1360" font-family="Arial" font-size="28" font-weight="400" fill="#334E68" text-anchor="start">A área entre ciclos mostra o volume corrente; a linha de base deve retornar ao zero para não sugerir empilhamento.</text></svg>