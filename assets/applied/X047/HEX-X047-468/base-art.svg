<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Trigger: esforço do paciente</title><desc id="desc">Esforço inspiratório do paciente reduz a pressão de base antes de o ventilador entregar o ciclo assistido.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" font-weight="400" fill="white" text-anchor="start">HEX-X047-468</text> <text x="600" y="245" font-family="Arial" font-size="48" font-weight="700" fill="#0A2E57" text-anchor="middle">Trigger: esforço do paciente</text><rect x="120" y="380" width="960" height="690" rx="28" fill="white" stroke="#A9C4D8" stroke-width="6"/><line x1="220" y1="920" x2="980" y2="920" stroke="#526B7A" stroke-width="5"/><line x1="220" y1="920" x2="220" y2="480" stroke="#526B7A" stroke-width="5"/><text x="998" y="930" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="start">tempo</text><text x="208" y="462" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="end">variável</text><path d="M220 700 L360 700 Q400 700 430 760 Q460 820 500 700 L540 700 L540 520 L760 520 L760 700 L980 700" fill="none" stroke="#1E78B4" stroke-width="14"/><line x1="220" y1="700" x2="980" y2="700" stroke="#526B7A" stroke-width="4" stroke-dasharray="12 10"/><line x1="500" y1="760" x2="500" y2="920" stroke="#D56B45" stroke-width="5" stroke-dasharray="10 10"/><text x="270" y="670" font-family="Arial" font-size="26" font-weight="700" fill="#334E68" text-anchor="start">PEEP</text><text x="380" y="850" font-family="Arial" font-size="27" font-weight="700" fill="#D56B45" text-anchor="start">esforço</text><text x="570" y="480" font-family="Arial" font-size="27" font-weight="700" fill="#1E78B4" text-anchor="start">assistência</text><text x="600" y="1040" font-family="Arial" font-size="30" font-weight="700" fill="#0A2E57" text-anchor="middle">esforço → trigger → ciclo assistido</text><rect x="70" y="1230" width="1060" height="180" rx="28" fill="#E4F4F1" stroke="#9BCFC8" stroke-width="4"/><text x="105" y="1300" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">LEITURA CLÍNICA</text><text x="105" y="1360" font-family="Arial" font-size="28" font-weight="400" fill="#334E68" text-anchor="start">O trigger é a ponte temporal entre esforço neural e assistência; sensibilidade inadequada causa esforço perdido ou auto-disparo.</text></svg>