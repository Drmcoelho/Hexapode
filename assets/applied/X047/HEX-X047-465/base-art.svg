<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Loop fluxo–volume aplicado</title><desc id="desc">Loop fluxo-volume com ramo expiratório côncavo típico de obstrução e ramo inspiratório.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" font-weight="400" fill="white" text-anchor="start">HEX-X047-465</text> <text x="600" y="245" font-family="Arial" font-size="48" font-weight="700" fill="#0A2E57" text-anchor="middle">Loop fluxo–volume aplicado</text><rect x="120" y="380" width="960" height="690" rx="28" fill="white" stroke="#A9C4D8" stroke-width="6"/><line x1="230" y1="760" x2="990" y2="760" stroke="#526B7A" stroke-width="5"/><line x1="610" y1="1000" x2="610" y2="460" stroke="#526B7A" stroke-width="5"/><text x="1000" y="790" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="start">volume</text><text x="590" y="440" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="end">fluxo</text><path d="M260 760 C330 650 430 520 610 480 C760 510 900 600 960 760" fill="none" stroke="#1E78B4" stroke-width="14"/><path d="M960 760 C870 790 810 900 700 920 C590 935 470 925 350 885 C300 865 270 820 260 760" fill="none" stroke="#D56B45" stroke-width="14"/><path d="M960 760 C860 800 800 850 700 870 C580 885 430 880 330 840" fill="none" stroke="#6D4C9A" stroke-width="10" stroke-dasharray="16 12"/><text x="740" y="610" font-family="Arial" font-size="27" font-weight="700" fill="#1E78B4" text-anchor="start">inspiração</text><text x="400" y="935" font-family="Arial" font-size="27" font-weight="700" fill="#D56B45" text-anchor="start">obstrução: concavidade expiratória</text><text x="700" y="850" font-family="Arial" font-size="23" font-weight="400" fill="#6D4C9A" text-anchor="start">referência</text><rect x="70" y="1230" width="1060" height="180" rx="28" fill="#E4F4F1" stroke="#9BCFC8" stroke-width="4"/><text x="105" y="1300" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">LEITURA CLÍNICA</text><text x="105" y="1360" font-family="Arial" font-size="28" font-weight="400" fill="#334E68" text-anchor="start">A concavidade expiratória sugere limitação ao fluxo; diferencie obstrução de erro técnico e correlacione com a clínica.</text></svg>