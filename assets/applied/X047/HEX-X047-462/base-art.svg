<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Pressão × tempo aplicada</title><desc id="desc">Curvas de pressão em ventilação controlada a pressão e no estado de PEEP basal.</desc><rect width="1200" height="1600" fill="#F7FAFC"/><rect width="1200" height="150" fill="#073B66"/><text x="50" y="92" font-family="Arial" font-size="42" font-weight="400" fill="white" text-anchor="start">HEX-X047-462</text> <text x="600" y="245" font-family="Arial" font-size="48" font-weight="700" fill="#0A2E57" text-anchor="middle">Pressão × tempo aplicada</text><rect x="120" y="380" width="960" height="690" rx="28" fill="white" stroke="#A9C4D8" stroke-width="6"/><line x1="220" y1="920" x2="980" y2="920" stroke="#526B7A" stroke-width="5"/><line x1="220" y1="920" x2="220" y2="480" stroke="#526B7A" stroke-width="5"/><text x="998" y="930" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="start">tempo</text><text x="208" y="462" font-family="Arial" font-size="24" font-weight="400" fill="#0A2E57" text-anchor="end">variável</text><path d="M220 920 L280 920 L280 540 L560 540 L560 920" fill="none" stroke="#6D4C9A" stroke-width="14"/><path d="M620 920 L680 920 L680 620 Q700 560 760 560 L900 560 Q950 575 980 640 L980 920" fill="none" stroke="#0B8F87" stroke-width="14"/><line x1="220" y1="760" x2="980" y2="760" stroke="#D3DFE7" stroke-width="3" stroke-dasharray="10 10"/><text x="300" y="500" font-family="Arial" font-size="28" font-weight="700" fill="#6D4C9A" text-anchor="start">PCV: pressão limitada</text><text x="700" y="510" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">curva com assistência</text><text x="850" y="745" font-family="Arial" font-size="24" font-weight="400" fill="#334E68" text-anchor="start">PEEP</text><rect x="70" y="1230" width="1060" height="180" rx="28" fill="#E4F4F1" stroke="#9BCFC8" stroke-width="4"/><text x="105" y="1300" font-family="Arial" font-size="28" font-weight="700" fill="#0B8F87" text-anchor="start">LEITURA CLÍNICA</text><text x="105" y="1360" font-family="Arial" font-size="28" font-weight="400" fill="#334E68" text-anchor="start">Em PCV, a pressão inspiratória é limitada e a forma do fluxo pode variar; sempre interprete junto do volume entregue.</text></svg>