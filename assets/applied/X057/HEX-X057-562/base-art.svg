<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><rect width="1600" height="1000" fill="#F4E7C5"/><rect width="1600" height="150" fill="#0B3C49"/><text x="70" y="78" font-family="Georgia" font-size="60" font-weight="700" fill="white">A CIDADE DA PERFUSÃO</text><text x="72" y="125" font-family="Arial" font-size="28" fill="#D6EEF0">Bomba, rede, resistência e entrega aos órgãos</text><rect x="90" y="220" width="1420" height="570" rx="40" fill="#C9E3E6" stroke="#0B3C49" stroke-width="8"/><rect x="650" y="350" width="300" height="250" rx="25" fill="#A9432F"/><text x="800" y="455" text-anchor="middle" font-family="Arial" font-size="40" font-weight="700" fill="white">CORAÇÃO</text><text x="800" y="510" text-anchor="middle" font-family="Arial" font-size="28" fill="white">ESTAÇÃO CENTRAL</text><path d="M650 430 H300 V310 M950 430 H1300 V310 M650 520 H300 V690 M950 520 H1300 V690" fill="none" stroke="#176B73" stroke-width="45"/><g fill="#F4E7C5" stroke="#0B3C49" stroke-width="6" font-family="Arial" font-size="30" font-weight="700"><rect x="120" y="220" width="360" height="130" rx="25"/><text x="300" y="295" text-anchor="middle" fill="#0B3C49">CÉREBRO · ALTO</text><rect x="1120" y="220" width="360" height="130" rx="25"/><text x="1300" y="295" text-anchor="middle" fill="#0B3C49">RIM · FILTRO</text><rect x="120" y="650" width="360" height="130" rx="25"/><text x="300" y="725" text-anchor="middle" fill="#0B3C49">PELE · PERIFERIA</text><rect x="1120" y="650" width="360" height="130" rx="25"/><text x="1300" y="725" text-anchor="middle" fill="#0B3C49">MÚSCULO · DEMANDA</text></g><text x="800" y="690" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0B3C49">PRESSÃO NÃO BASTA: É PRECISO FLUXO ÚTIL ATÉ O BAIRRO</text><rect y="900" width="1600" height="100" fill="#0B3C49"/><text x="70" y="962" font-family="Arial" font-size="30" font-weight="700" fill="white">PERFUSÃO = PRESSÃO SUFICIENTE + FLUXO + MICROC