<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#F4E7C5"/><rect width="1600" height="150" fill="#0B3C49"/><text x="70" y="78" font-family="Georgia" font-size="60" font-weight="700" fill="white">O ELEVADOR DA VENTILAÇÃO</text><text x="72" y="125" font-family="Arial" font-size="28" fill="#D6EEF0">O paciente pede; o ventilador ajuda; as portas fecham na hora certa</text><rect x="180" y="240" width="1240" height="520" rx="35" fill="#D8D2C1" stroke="#0B3C49" stroke-width="10"/><rect x="600" y="280" width="400" height="420" fill="#607982" stroke="#0B3C49" stroke-width="8"/><line x1="800" y1="280" x2="800" y2="700" stroke="#0B3C49" stroke-width="8"/><circle cx="350" cy="420" r="90" fill="#F0C928" stroke="#7B5B00" stroke-width="8"/><text x="350" y="430" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">PACIENTE</text><rect x="260" y="570" width="180" height="90" rx="18" fill="#D9982F" stroke="#0B3C49" stroke-width="6"/><text x="350" y="625" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">TRIGGER</text><circle cx="1220" cy="430" r="110" fill="#176B73" stroke="#0B3C49" stroke-width="8"/><text x="1220" y="420" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="white">VENTILADOR</text><path d="M440 420 H600 M1000 420 H1110" stroke="#4C9BB0" stroke-width="20"/><text x="800" y="820" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#A9432F">GATILHO · ASSISTÊNCIA · CICLAGEM — DESALINHAMENTO = ASSINCRONIA</text><rect y="900" width="1600" height="100" fill="#0B3C49"/><text x="70" y="962" font-family="Arial" font-size="30" font-weight="700" fill="white">SINCRONIA REDUZ ESFORÇO. O AJUSTE SEGUE A NECESSIDADE DO PACIENTE.</text></svg>