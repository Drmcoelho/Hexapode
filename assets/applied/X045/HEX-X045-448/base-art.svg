<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Curva da oxiemoglobina aplicada</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#1D4E7A"/><text x="55" y="78" fill="white" font-size="30">HEXÁPODE · FISIOLOGIA APLICADA</text><text x="60" y="220" fill="#1D4E7A" font-size="52">Curva da oxiemoglobina aplicada</text><path d="M130 720C240 700 300 650 370 520C450 370 610 330 1060 350" fill="none" stroke="#1D4E7A" stroke-width="11"/><path d="M130 720C300 680 380 540 470 410C580 300 780 320 1060 330" fill="none" stroke="#D65A4A" stroke-width="8" stroke-dasharray="18 12"/><path d="M130 720C200 715 270 680 330 590C410 450 500 380 1060 410" fill="none" stroke="#4DA06B" stroke-width="8" stroke-dasharray="12 10"/><text x="70" y="900" font-size="30">Direita: ↑CO₂, ↑H⁺, ↑temperatura, ↑2,3-DPG → descarga tecidual.</text><text x="70" y="970" font-size="30">Esquerda: maior afinidade → carga pulmonar, menor liberação periférica.</text><text x="55" y="1550" fill="#1D4E7A" font-size="24">HEX-X045-448</text></svg>