<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Desequilíbrio ventilação perfusão aplicado</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#1D4E7A"/><text x="55" y="78" fill="white" font-size="30">HEXÁPODE · FISIOLOGIA APLICADA</text><text x="60" y="220" fill="#1D4E7A" font-size="52">Desequilíbrio V/Q aplicado</text><circle cx="220" cy="520" r="130" fill="#FDEDE8" stroke="#D65A4A" stroke-width="7"/><text x="220" y="515" text-anchor="middle" font-size="36">V/Q baixo</text><text x="220" y="560" text-anchor="middle" font-size="26">shunt-like</text><circle cx="600" cy="520" r="130" fill="#E9F3E8" stroke="#4DA06B" stroke-width="7"/><text x="600" y="515" text-anchor="middle" font-size="36">V/Q ≈ 1</text><circle cx="980" cy="520" r="130" fill="#DDEAF6" stroke="#2F6FAE" stroke-width="7"/><text x="980" y="515" text-anchor="middle" font-size="36">V/Q alto</text><text x="980" y="560" text-anchor="middle" font-size="26">dead-space-like</text><text x="70" y="900" font-size="30">Baixo V/Q responde melhor ao oxigênio que shunt verdadeiro.</text><text x="70" y="970" font-size="30">Alto V/Q desperdiça ventilação por perfusão insuficiente.</text><text x="55" y="1550" fill="#1D4E7A" font-size="24">HEX-X045-445</text></svg>