<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Oferta de oxigênio à beira-leito</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#1D4E7A"/><text x="55" y="78" fill="white" font-size="30">HEXÁPODE · FISIOLOGIA APLICADA</text><text x="60" y="220" fill="#1D4E7A" font-size="52">Oferta de oxigênio: DO₂</text><circle cx="260" cy="520" r="150" fill="#F4B4A7" stroke="#D65A4A" stroke-width="8"/><text x="260" y="530" text-anchor="middle" font-size="34">Débito cardíaco</text><path d="M420 520H600" stroke="#1D4E7A" stroke-width="8"/><rect x="620" y="400" width="420" height="240" rx="30" fill="#E8F4F3" stroke="#0F5863" stroke-width="6"/><text x="830" y="500" text-anchor="middle" font-size="38">DO₂ = DC × CaO₂ × 10</text><text x="830" y="560" text-anchor="middle" font-size="28">Oferta sistêmica aos tecidos</text><text x="70" y="900" font-size="30">CaO₂ depende de Hb, SaO₂ e PaO₂ dissolvida.</text><text x="70" y="970" font-size="30">DO₂ baixo pode resultar de anemia, hipoxemia ou baixo débito.</text><text x="55" y="1550" fill="#1D4E7A" font-size="24">HEX-X045-441</text></svg>