<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Ventilação alveolar e PaCO2</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#1D4E7A"/><text x="55" y="78" fill="white" font-size="30">HEXÁPODE · FISIOLOGIA APLICADA</text><text x="60" y="220" fill="#1D4E7A" font-size="52">Ventilação alveolar e PaCO₂</text><rect x="100" y="390" width="350" height="260" rx="30" fill="#FDEDE8" stroke="#D65A4A" stroke-width="7"/><text x="275" y="490" text-anchor="middle" font-size="42">V̇A ↓</text><text x="275" y="555" text-anchor="middle" font-size="42">PaCO₂ ↑</text><rect x="750" y="390" width="350" height="260" rx="30" fill="#DDEAF6" stroke="#2F6FAE" stroke-width="7"/><text x="925" y="490" text-anchor="middle" font-size="42">V̇A ↑</text><text x="925" y="555" text-anchor="middle" font-size="42">PaCO₂ ↓</text><text x="600" y="760" text-anchor="middle" font-size="36">PaCO₂ ∝ VCO₂ / V̇A</text><text x="70" y="920" font-size="30">Hipoventilação eleva PaCO₂; hiperventilação reduz PaCO₂.</text><text x="70" y="990" font-size="30">Espaço morto reduz a fração efetiva da ventilação minuto.</text><text x="55" y="1550" fill="#1D4E7A" font-size="24">HEX-X045-449</text></svg>