<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Equação do gás alveolar</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#1D4E7A"/><text x="55" y="78" fill="white" font-size="30">HEXÁPODE · FISIOLOGIA APLICADA</text><text x="60" y="220" fill="#1D4E7A" font-size="52">Equação do gás alveolar</text><path d="M180 650C120 520 160 360 300 320C440 360 480 520 420 650Z" fill="#E8F4F3" stroke="#0F5863" stroke-width="7"/><text x="300" y="510" text-anchor="middle" font-size="38">Alvéolo</text><rect x="520" y="360" width="590" height="300" rx="30" fill="#FFFFFF" stroke="#1D4E7A" stroke-width="6"/><text x="815" y="470" text-anchor="middle" font-size="34">PAO₂ = FiO₂(Patm − PH₂O)</text><text x="815" y="530" text-anchor="middle" font-size="34">− PaCO₂/R</text><text x="70" y="900" font-size="30">Ajuda a separar hipoventilação de distúrbio V/Q, shunt e difusão.</text><text x="70" y="970" font-size="30">O gradiente A–a exige PAO₂ estimada e PaO₂ medida.</text><text x="55" y="1550" fill="#1D4E7A" font-size="24">HEX-X045-444</text></svg>