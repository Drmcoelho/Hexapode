<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Extração de oxigênio e ScvO2</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#1D4E7A"/><text x="55" y="78" fill="white" font-size="30">HEXÁPODE · FISIOLOGIA APLICADA</text><text x="60" y="220" fill="#1D4E7A" font-size="52">Extração de O₂ e ScvO₂</text><rect x="90" y="400" width="280" height="250" rx="25" fill="#FDEDE8" stroke="#D65A4A" stroke-width="6"/><text x="230" y="500" text-anchor="middle" font-size="35">Oferta 100%</text><rect x="460" y="400" width="280" height="250" rx="25" fill="#E8F4F3" stroke="#0F5863" stroke-width="6"/><text x="600" y="500" text-anchor="middle" font-size="35">Extração 25%</text><rect x="830" y="400" width="280" height="250" rx="25" fill="#E9F3E8" stroke="#4DA06B" stroke-width="6"/><text x="970" y="500" text-anchor="middle" font-size="35">ScvO₂ 70–75%</text><text x="70" y="900" font-size="30">ScvO₂ baixa sugere extração aumentada ou oferta inadequada.</text><text x="70" y="970" font-size="30">ScvO₂ alta não exclui choque: pode refletir falha de extração.</text><text x="55" y="1550" fill="#1D4E7A" font-size="24">HEX-X045-442</text></svg>