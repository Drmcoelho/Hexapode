<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Bougie avançado</title><desc id="d">Introdução do bougie, sinais táteis e passagem do tubo em esquema educacional.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="72" fill="#1D4E7A"/><text x="90" y="48" font-family="Arial" font-size="25" font-weight="700" fill="white">HEXÁPODE · VIA AÉREA AVANÇADA</text><text x="90" y="155" font-family="Georgia" font-size="60" fill="#2B2E34">Bougie avançado</text><text x="90" y="205" font-family="Arial" font-size="24" fill="#6A727A">Introdução sob visão, sinais táteis e progressão controlada</text><line x1="90" y1="235" x2="1510" y2="235" stroke="#DCD2BE" stroke-width="3"/><path d="M210 350Q470 500 640 880" fill="none" stroke="#D39A2E" stroke-width="25"/><path d="M210 350Q470 500 640 880" fill="none" stroke="#2B2E34" stroke-width="4"/><g stroke="#1D4E7A" stroke-width="7"><line x1="360" y1="470" x2="395" y2="450"/><line x1="408" y1="544" x2="443" y2="524"/><line x1="456" y1="618" x2="491" y2="598"/><line x1="504" y1="692" x2="539" y2="672"/><line x1="552" y1="766" x2="587" y2="746"/></g><rect x="790" y="320" width="600" height="530" rx="28" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><g font-family="Arial" font-size="25" fill="#2B2E34"><text x="900" y="410">1. Introduzir sob visão laríngea</text><text x="900" y="510">2. Cliques traqueais podem ocorrer</text><text x="900" y="610">3. Evitar avanço profundo ou forçado</text><text x="900" y="710">4. Passar o tubo mantendo estabilidade</text></g><g fill="#1696A3"><circle cx="850" cy="400" r="30"/><circle cx="850" cy="500" r="30"/><circle cx="850" cy="600" r="30"/><circle cx="850" cy="700" r="30"/></g><g font-family="Arial" font-size="23" font-weight="700" fill="white" text-anchor="middle"><text x="850" y="408">1</text><text x="850" y="508">2</text><text x="850" y="608">3</text><text x="850" y="708">4</text></g><rect x="250" y="900" width="1100" height="90" rx="20" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="290" y="958" font-family="Arial" font-size="24" fill="#B2473F">O chamado “hold-up” distal não deve ser provocado de forma agressiva.</text><text x="90" y="1125" font-family="Arial" font-size="21" fill="#6A727A">HEX-A031-307 · Hexápode</text></svg>