<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Cuff traqueal avançado</title><desc id="d">Vedação traqueal, pressão segura e riscos de sub e hiperinsuflação.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="72" fill="#1D4E7A"/><text x="90" y="48" font-family="Arial" font-size="25" font-weight="700" fill="white">HEXÁPODE · VIA AÉREA AVANÇADA</text><text x="90" y="155" font-family="Georgia" font-size="60" fill="#2B2E34">Cuff traqueal avançado</text><text x="90" y="205" font-family="Arial" font-size="24" fill="#6A727A">Pressão suficiente para vedar, sem comprometer a perfusão da mucosa</text><line x1="90" y1="235" x2="1510" y2="235" stroke="#DCD2BE" stroke-width="3"/><rect x="250" y="330" width="300" height="540" rx="150" fill="#F3D6C8" stroke="#2B2E34" stroke-width="5"/><rect x="350" y="300" width="100" height="590" rx="48" fill="#F4C6B8" stroke="#C45A3C" stroke-width="8"/><ellipse cx="400" cy="620" rx="88" ry="68" fill="#1696A3" opacity=".55" stroke="#1D4E7A" stroke-width="5"/><line x1="490" y1="620" x2="900" y2="620" stroke="#1D4E7A" stroke-width="6"/><circle cx="1040" cy="620" r="120" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="1040" y="605" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#2E7D69">20–30</text><text x="1040" y="660" text-anchor="middle" font-family="Arial" font-size="28" fill="#2B2E34">cmH₂O</text><rect x="900" y="330" width="500" height="190" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="940" y="400" font-family="Arial" font-size="27" font-weight="700" fill="#B2473F">Fora da faixa</text><text x="940" y="455" font-family="Arial" font-size="24" fill="#2B2E34">Baixa: vazamento e microaspiração</text><text x="940" y="500" font-family="Arial" font-size="24" fill="#2B2E34">Alta: isquemia e lesão da mucosa</text><rect x="220" y="900" width="1160" height="90" rx="20" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="260" y="958" font-family="Arial" font-size="25" fill="#2B2E34">A pressão deve ser medida com manômetro; palpação do balonete piloto não é confiável.</text><text x="90" y="1125" font-family="Arial" font-size="21" fill="#6A727A">HEX-A031-305 · Hexápode</text></svg>