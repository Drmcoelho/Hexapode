<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Mallampati avançado</title><desc id="d">Quatro classes de Mallampati e limites da avaliação isolada.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="72" fill="#1D4E7A"/><text x="90" y="48" font-family="Arial" font-size="25" font-weight="700" fill="white">HEXÁPODE · VIA AÉREA AVANÇADA</text><text x="90" y="155" font-family="Georgia" font-size="60" fill="#2B2E34">Mallampati avançado</text><text x="90" y="205" font-family="Arial" font-size="24" fill="#6A727A">Visibilidade orofaríngea em quatro classes — útil, mas insuficiente isoladamente</text><line x1="90" y1="235" x2="1510" y2="235" stroke="#DCD2BE" stroke-width="3"/><g font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A" text-anchor="middle"><text x="220" y="710">Classe I</text><text x="600" y="710">Classe II</text><text x="980" y="710">Classe III</text><text x="1360" y="710">Classe IV</text></g><g stroke="#2B2E34" stroke-width="5" fill="#F3D6C8"><circle cx="220" cy="500" r="135"/><circle cx="600" cy="500" r="135"/><circle cx="980" cy="500" r="135"/><circle cx="1360" cy="500" r="135"/></g><g fill="#C45A3C" opacity=".8"><path d="M130 520Q220 440 310 520Q220 600 130 520"/><path d="M510 520Q600 465 690 520Q600 580 510 520"/><path d="M890 520Q980 490 1070 520Q980 565 890 520"/><path d="M1270 520Q1360 510 1450 520Q1360 550 1270 520"/></g><rect x="180" y="790" width="1240" height="160" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="220" y="850" font-family="Arial" font-size="27" fill="#2B2E34">Maior classe aumenta a suspeita, mas não prediz sozinha laringoscopia difícil.</text><text x="220" y="905" font-family="Arial" font-size="24" fill="#6A727A">Combine com abertura oral, mobilidade cervical, distância tireomentoniana e contexto.</text><text x="90" y="1125" font-family="Arial" font-size="21" fill="#6A727A">HEX-A031-301 · Hexápode</text></svg>