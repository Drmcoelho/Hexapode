<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Dispositivo supraglótico avançado</title><desc id="d">Posição da máscara laríngea, vedação e função de resgate.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="72" fill="#1D4E7A"/><text x="90" y="48" font-family="Arial" font-size="25" font-weight="700" fill="white">HEXÁPODE · VIA AÉREA AVANÇADA</text><text x="90" y="155" font-family="Georgia" font-size="60" fill="#2B2E34">Dispositivo supraglótico avançado</text><text x="90" y="205" font-family="Arial" font-size="24" fill="#6A727A">Vedação sobre a entrada laríngea para ventilação de resgate</text><line x1="90" y1="235" x2="1510" y2="235" stroke="#DCD2BE" stroke-width="3"/><path d="M250 340Q500 280 720 470Q820 600 720 820Q520 930 300 760Z" fill="#F3D6C8" stroke="#2B2E34" stroke-width="5"/><ellipse cx="510" cy="620" rx="155" ry="110" fill="#1696A3" opacity=".45" stroke="#1D4E7A" stroke-width="8"/><ellipse cx="510" cy="620" rx="75" ry="45" fill="#C45A3C" opacity=".8"/><path d="M510 620C790 620 930 640 1080 790" fill="none" stroke="#1D4E7A" stroke-width="28"/><rect x="930" y="330" width="470" height="300" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="970" y="400" font-family="Arial" font-size="28" font-weight="700" fill="#2E7D69">Vantagens</text><text x="970" y="455" font-family="Arial" font-size="24" fill="#2B2E34">• ventilação de resgate rápida</text><text x="970" y="500" font-family="Arial" font-size="24" fill="#2B2E34">• ponte para estratégia definitiva</text><text x="970" y="565" font-family="Arial" font-size="28" font-weight="700" fill="#B2473F">Limite</text><text x="970" y="610" font-family="Arial" font-size="24" fill="#2B2E34">Proteção incompleta contra aspiração</text><rect x="250" y="880" width="1100" height="100" rx="20" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="290" y="942" font-family="Arial" font-size="25" fill="#2B2E34">Tamanho, profundidade e pressão do cuff determinam a qualidade da vedação.</text><text x="90" y="1125" font-family="Arial" font-size="21" fill="#6A727A">HEX-A031-308 · Hexápode</text></svg>