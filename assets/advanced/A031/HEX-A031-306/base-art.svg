<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Videolaringoscopia avançada</title><desc id="d">Comparação entre lâmina padrão e hiperangulada em esquema educacional.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="72" fill="#1D4E7A"/><text x="90" y="48" font-family="Arial" font-size="25" font-weight="700" fill="white">HEXÁPODE · VIA AÉREA AVANÇADA</text><text x="90" y="155" font-family="Georgia" font-size="60" fill="#2B2E34">Videolaringoscopia avançada</text><text x="90" y="205" font-family="Arial" font-size="24" fill="#6A727A">Imagem da glote e trajetória do dispositivo devem ser planejadas em conjunto</text><line x1="90" y1="235" x2="1510" y2="235" stroke="#DCD2BE" stroke-width="3"/><path d="M210 730Q300 380 520 340Q710 320 830 520L770 790Z" fill="#F3D6C8" stroke="#2B2E34" stroke-width="5"/><rect x="650" y="300" width="200" height="110" rx="25" fill="#2B2E34"/><circle cx="750" cy="355" r="32" fill="#1696A3"/><path d="M760 410Q960 520 1130 770" fill="none" stroke="#1D4E7A" stroke-width="34"/><path d="M720 420Q900 580 1030 730" fill="none" stroke="#D39A2E" stroke-width="12"/><rect x="1030" y="320" width="390" height="330" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="1070" y="390" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Lâmina padrão</text><text x="1070" y="440" font-family="Arial" font-size="24" fill="#2B2E34">Trajetória mais direta</text><text x="1070" y="520" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Hiperangulada</text><text x="1070" y="570" font-family="Arial" font-size="24" fill="#2B2E34">Curvatura pré-modelada</text><text x="1070" y="620" font-family="Arial" font-size="24" fill="#B2473F">Evitar aproximação excessiva</text><rect x="240" y="870" width="1120" height="100" rx="20" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="280" y="932" font-family="Arial" font-size="25" fill="#2B2E34">Boa visualização não elimina a necessidade de alinhar cuidadosamente a trajetória.</text><text x="90" y="1125" font-family="Arial" font-size="21" fill="#6A727A">HEX-A031-306 · Hexápode</text></svg>