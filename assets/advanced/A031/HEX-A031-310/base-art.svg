<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Sequência rápida de intubação</title><desc id="d">Fluxo temporal da preparação à confirmação por capnografia.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="72" fill="#1D4E7A"/><text x="90" y="48" font-family="Arial" font-size="25" font-weight="700" fill="white">HEXÁPODE · VIA AÉREA AVANÇADA</text><text x="90" y="155" font-family="Georgia" font-size="60" fill="#2B2E34">Sequência rápida de intubação</text><text x="90" y="205" font-family="Arial" font-size="24" fill="#6A727A">Preparar a falha antes da indução e confirmar a via aérea por capnografia</text><line x1="90" y1="235" x2="1510" y2="235" stroke="#DCD2BE" stroke-width="3"/><g font-family="Arial" font-size="25" fill="#2B2E34" text-anchor="middle"><text x="150" y="650">Preparar</text><text x="350" y="650">Pré-O₂</text><text x="550" y="650">Induzir</text><text x="750" y="650">Bloquear</text><text x="950" y="650">Intubar</text><text x="1150" y="650">Confirmar</text><text x="1350" y="650">Pós-IOT</text></g><g fill="#1696A3"><circle cx="150" cy="540" r="65"/><circle cx="350" cy="540" r="65"/><circle cx="550" cy="540" r="65"/><circle cx="750" cy="540" r="65"/><circle cx="950" cy="540" r="65"/></g><g fill="#2E7D69"><circle cx="1150" cy="540" r="65"/><circle cx="1350" cy="540" r="65"/></g><g font-family="Arial" font-size="30" font-weight="700" fill="white" text-anchor="middle"><text x="150" y="550">1</text><text x="350" y="550">2</text><text x="550" y="550">3</text><text x="750" y="550">4</text><text x="950" y="550">5</text><text x="1150" y="550">6</text><text x="1350" y="550">7</text></g><g stroke="#1D4E7A" stroke-width="8"><line x1="220" y1="540" x2="280" y2="540"/><line x1="420" y1="540" x2="480" y2="540"/><line x1="620" y1="540" x2="680" y2="540"/><line x1="820" y1="540" x2="880" y2="540"/><line x1="1020" y1="540" x2="1080" y2="540"/><line x1="1220" y1="540" x2="1280" y2="540"/></g><rect x="280" y="760" width="1040" height="170" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="330" y="820" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Pontos críticos</text><text x="330" y="870" font-family="Arial" font-size="24" fill="#2B2E34">• plano de falha e resgate definido antes da indução</text><text x="330" y="915" font-family="Arial" font-size="24" fill="#2B2E34">• confirmação primária: onda persistente de ETCO₂; iniciar analgesia e sedação pós-IOT</text><text x="90" y="1125" font-family="Arial" font-size="21" fill="#6A727A">HEX-A031-310 · Hexápode</text></svg>