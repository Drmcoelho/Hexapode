<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Manipulação laríngea externa</title><desc id="d">BURP e manipulação bimanual para otimizar a visão glótica.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="72" fill="#1D4E7A"/><text x="90" y="48" font-family="Arial" font-size="25" font-weight="700" fill="white">HEXÁPODE · VIA AÉREA AVANÇADA</text><text x="90" y="155" font-family="Georgia" font-size="60" fill="#2B2E34">Manipulação laríngea externa</text><text x="90" y="205" font-family="Arial" font-size="24" fill="#6A727A">Reposicionamento da laringe para melhorar a exposição da glote</text><line x1="90" y1="235" x2="1510" y2="235" stroke="#DCD2BE" stroke-width="3"/><path d="M220 340Q430 290 650 410L600 790Q430 850 270 730Z" fill="#F3D6C8" stroke="#2B2E34" stroke-width="5"/><ellipse cx="440" cy="570" rx="115" ry="70" fill="#C45A3C" opacity=".75"/><path d="M355 585Q440 505 525 585" fill="none" stroke="#1696A3" stroke-width="16"/><line x1="820" y1="520" x2="610" y2="520" stroke="#D39A2E" stroke-width="16"/><line x1="440" y1="900" x2="440" y2="705" stroke="#D39A2E" stroke-width="16"/><line x1="870" y1="670" x2="625" y2="610" stroke="#D39A2E" stroke-width="16"/><rect x="930" y="330" width="470" height="430" rx="28" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="975" y="410" font-family="Arial" font-size="31" font-weight="700" fill="#1D4E7A">BURP</text><text x="975" y="475" font-family="Arial" font-size="27" fill="#2B2E34">Posterior</text><text x="975" y="530" font-family="Arial" font-size="27" fill="#2B2E34">Superior</text><text x="975" y="585" font-family="Arial" font-size="27" fill="#2B2E34">Para a direita</text><text x="975" y="670" font-family="Arial" font-size="24" fill="#B2473F">Não equivale à pressão cricoide.</text><rect x="220" y="850" width="1180" height="110" rx="20" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="260" y="915" font-family="Arial" font-size="25" fill="#2B2E34">A manipulação bimanual permite ajuste fino pelo operador antes de o auxiliar manter a posição.</text><text x="90" y="1125" font-family="Arial" font-size="21" fill="#6A727A">HEX-A031-303 · Hexápode</text></svg>