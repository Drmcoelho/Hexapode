<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><title>BiPAP avançado</title><rect width="1200" height="900" fill="#F7F4EC"/><rect width="1200" height="70" fill="#12345B"/><text x="35" y="47" font-family="Arial" font-size="23" font-weight="700" fill="white">HEXÁPODE · MODOS VENTILATÓRIOS AVANÇADOS</text><text x="45" y="135" font-family="Georgia" font-size="44" fill="#12345B">BiPAP avançado</text><text x="45" y="175" font-family="Arial" font-size="20" fill="#5B6570">Dois níveis de pressão não invasiva: IPAP e EPAP.</text><path d="M100 650Q200 430 300 520T500 650T700 520T900 650" fill="none" stroke="#2F6FAE" stroke-width="10"/><line x1="100" y1="720" x2="900" y2="720" stroke="#168A8A" stroke-width="8"/><rect x="790" y="240" width="350" height="360" rx="18" fill="#FFFDF8" stroke="#D9D5C9"/><text x="825" y="300" font-family="Arial" font-size="24" font-weight="700" fill="#12345B">Leitura clínica</text><text x="825" y="370" font-family="Arial" font-size="22" fill="#168A8A">IPAP: ventilação</text><text x="825" y="440" font-family="Arial" font-size="22" fill="#2F6FAE">EPAP: recrutamento</text><text x="825" y="510" font-family="Arial" font-size="22" fill="#E58A2B">Vazamento e sincronia</text><text x="45" y="855" font-family="Arial" font-size="18" fill="#5B6570">HEX-A028-278 · imagem didática médica</text></svg>