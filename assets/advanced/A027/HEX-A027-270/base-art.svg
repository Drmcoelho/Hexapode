<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img"><title>Driving pressure avançada</title><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="92" fill="#12335B"/><text x="70" y="60" font-family="Arial" font-size="28" font-weight="700" fill="white">HEXÁPODE · CURVAS AVANÇADAS</text><text x="70" y="170" font-family="Georgia" font-size="58" fill="#12335B">Driving pressure avançada</text><rect x="180" y="330" width="1220" height="480" rx="26" fill="#FFFDF8" stroke="#D8CFBF" stroke-width="3"/><line x1="260" y1="690" x2="1320" y2="690" stroke="#D89B2B" stroke-width="8"/><line x1="260" y1="450" x2="1320" y2="450" stroke="#276FBF" stroke-width="8"/><line x1="520" y1="450" x2="520" y2="690" stroke="#118C8C" stroke-width="12"/><polygon points="520,440 500,480 540,480" fill="#118C8C"/><polygon points="520,700 500,660 540,660" fill="#118C8C"/><text x="290" y="430" font-family="Arial" font-size="28" fill="#276FBF">Pplat</text><text x="290" y="735" font-family="Arial" font-size="28" fill="#D89B2B">PEEP</text><text x="550" y="585" font-family="Arial" font-size="36" font-weight="700" fill="#118C8C">ΔP = Pplat − PEEP</text><rect x="830" y="520" width="450" height="150" rx="18" fill="#E6F4F1"/><text x="865" y="575" font-family="Arial" font-size="24" fill="#667085">Relaciona pressão aplicada</text><text x="865" y="615" font-family="Arial" font-size="24" fill="#667085">ao volume corrente e à complacência.</text><text x="500" y="890" font-family="Arial" font-size="29" fill="#12335B">menor ΔP tende a indicar menor estresse cíclico</text><text x="70" y="1145" font-family="Arial" font-size="21" fill="#667085">HEX-A027-270</text></svg>