<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Diafragma em M-mode</title><desc id="d">Medida da excursão e do espessamento diafragmático durante a inspiração.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0F3B5D"/><text x="55" y="76" fill="white" font-family="Arial" font-size="38">HEXÁPODE · ULTRASSOM AVANÇADO</text><text x="55" y="195" fill="#0F3B5D" font-family="Arial" font-size="52" font-weight="700">Diafragma em M-mode</text><rect x="90" y="320" width="1020" height="800" rx="22" fill="#15191D"/><polyline points="130,860 220,820 310,720 400,600 490,720 580,850 670,780 760,640 850,760 960,870 1060,840" fill="none" stroke="#F7F4EC" stroke-width="8"/><line x1="400" y1="580" x2="400" y2="900" stroke="#2A8C82" stroke-width="6"/><line x1="760" y1="620" x2="760" y2="900" stroke="#F0B14A" stroke-width="6"/><text x="260" y="520" font-family="Arial" font-size="30" fill="white">Excursão inspiratória</text><text x="700" y="520" font-family="Arial" font-size="30" fill="white">Retorno expiratório</text><rect x="80" y="1180" width="1040" height="240" rx="20" fill="#EAF3F1" stroke="#2A8C82" stroke-width="3"/><text x="110" y="1250" font-family="Arial" font-size="34" font-weight="700" fill="#0F3B5D">Ponto-chave</text><text x="110" y="1310" font-family="Arial" font-size="26" fill="#2F4858">Excursão e fração de espessamento devem ser interpretadas com esforço e ventilação.</text><text x="55" y="1540" font-family="Arial" font-size="25" fill="#0F3B5D">HEX-A039-389 · Revisão clínica pendente</text></svg>