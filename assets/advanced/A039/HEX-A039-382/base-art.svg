<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Doppler colorido</title><desc id="d">Diagrama da direção do fluxo, escala de velocidades, aliasing e ângulo de insonação.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0F3B5D"/><text x="55" y="76" fill="white" font-family="Arial" font-size="38">HEXÁPODE · ULTRASSOM AVANÇADO</text><text x="55" y="195" fill="#0F3B5D" font-family="Arial" font-size="52" font-weight="700">Doppler colorido</text><text x="55" y="245" fill="#2F4858" font-family="Arial" font-size="28">Direção, velocidade e aliasing</text><rect x="70" y="300" width="1060" height="850" rx="24" fill="#15191D"/><path d="M600 360 L300 1040 A430 430 0 0 0 900 1040 Z" fill="#30363B" stroke="#D7DEE3" stroke-width="5"/><path d="M400 690 C520 560 660 580 820 720" fill="none" stroke="#E04B4B" stroke-width="55"/><path d="M390 800 C530 920 680 880 830 760" fill="none" stroke="#2F6FB0" stroke-width="55"/><line x1="600" y1="350" x2="690" y2="750" stroke="#F0B14A" stroke-width="6"/><text x="760" y="520" font-family="Arial" font-size="30" fill="white">Ângulo</text><rect x="80" y="1200" width="1040" height="250" rx="20" fill="#EAF3F1" stroke="#2A8C82" stroke-width="3"/><text x="110" y="1270" font-family="Arial" font-size="34" font-weight="700" fill="#0F3B5D">Ponto-chave</text><text x="110" y="1330" font-family="Arial" font-size="26" fill="#2F4858">Cor representa direção relativa à sonda; aliasing surge quando a escala é insuficiente.</text><text x="55" y="1540" font-family="Arial" font-size="25" fill="#0F3B5D">HEX-A039-382 · Revisão clínica pendente</text></svg>