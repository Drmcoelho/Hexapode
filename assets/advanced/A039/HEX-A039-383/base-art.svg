<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Doppler espectral</title><desc id="d">Espectro de velocidade ao longo do tempo com linha de base e medidas sistólica e diastólica.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0F3B5D"/><text x="55" y="76" fill="white" font-family="Arial" font-size="38">HEXÁPODE · ULTRASSOM AVANÇADO</text><text x="55" y="195" fill="#0F3B5D" font-family="Arial" font-size="52" font-weight="700">Doppler espectral</text><rect x="90" y="320" width="1020" height="760" rx="20" fill="#101418"/><line x1="150" y1="700" x2="1040" y2="700" stroke="#D7DEE3" stroke-width="4"/><g fill="#F7F4EC" opacity="0.9"><path d="M180 700 Q230 430 300 700Z"/><path d="M350 700 Q430 360 520 700Z"/><path d="M580 700 Q650 460 720 700Z"/><path d="M760 700 Q850 390 960 700Z"/></g><line x1="430" y1="390" x2="430" y2="700" stroke="#2A8C82" stroke-width="5"/><line x1="520" y1="620" x2="520" y2="700" stroke="#F0B14A" stroke-width="5"/><text x="380" y="360" fill="white" font-family="Arial" font-size="28">Pico sistólico</text><text x="500" y="600" fill="white" font-family="Arial" font-size="28">Diastólica</text><rect x="80" y="1160" width="1040" height="260" rx="20" fill="#EAF3F1" stroke="#2A8C82" stroke-width="3"/><text x="110" y="1230" font-family="Arial" font-size="34" font-weight="700" fill="#0F3B5D">Ponto-chave</text><text x="110" y="1290" font-family="Arial" font-size="26" fill="#2F4858">A amostra, o ângulo e a escala determinam a confiabilidade das velocidades medidas.</text><text x="55" y="1540" font-family="Arial" font-size="25" fill="#0F3B5D">HEX-A039-383 · Revisão clínica pendente</text></svg>