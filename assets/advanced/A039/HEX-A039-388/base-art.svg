<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Consolidação pulmonar</title><desc id="d">Hepatização pulmonar e broncogramas aéreos dinâmicos no ultrassom.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0F3B5D"/><text x="55" y="76" fill="white" font-family="Arial" font-size="38">HEXÁPODE · ULTRASSOM AVANÇADO</text><text x="55" y="195" fill="#0F3B5D" font-family="Arial" font-size="52" font-weight="700">Consolidação pulmonar</text><rect x="90" y="320" width="1020" height="800" rx="22" fill="#15191D"/><path d="M220 500 C380 400 820 400 980 500 L920 980 C760 1080 440 1080 280 980Z" fill="#777"/><g fill="#F7F4EC"><circle cx="400" cy="650" r="16"/><circle cx="520" cy="720" r="14"/><circle cx="650" cy="610" r="15"/><circle cx="760" cy="780" r="14"/><circle cx="860" cy="660" r="12"/></g><path d="M330 880 Q600 680 880 900" fill="none" stroke="#D9D9D9" stroke-width="18"/><text x="320" y="470" font-family="Arial" font-size="30" fill="white">Ecotextura semelhante ao fígado</text><text x="420" y="1020" font-family="Arial" font-size="30" fill="white">Broncogramas aéreos</text><rect x="80" y="1180" width="1040" height="240" rx="20" fill="#EAF3F1" stroke="#2A8C82" stroke-width="3"/><text x="110" y="1250" font-family="Arial" font-size="34" font-weight="700" fill="#0F3B5D">Ponto-chave</text><text x="110" y="1310" font-family="Arial" font-size="26" fill="#2F4858">Broncogramas dinâmicos favorecem pneumonia; os estáticos podem ocorrer em atelectasia.</text><text x="55" y="1540" font-family="Arial" font-size="25" fill="#0F3B5D">HEX-A039-388 · Revisão clínica pendente</text></svg>