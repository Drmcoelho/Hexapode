<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Pneumotórax no ultrassom</title><desc id="d">Comparação entre deslizamento pleural normal e ausência de deslizamento com lung point.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0F3B5D"/><text x="55" y="76" fill="white" font-family="Arial" font-size="38">HEXÁPODE · ULTRASSOM AVANÇADO</text><text x="55" y="195" fill="#0F3B5D" font-family="Arial" font-size="52" font-weight="700">Pneumotórax</text><rect x="70" y="300" width="500" height="820" rx="20" fill="white" stroke="#A8BAC7" stroke-width="3"/><rect x="630" y="300" width="500" height="820" rx="20" fill="white" stroke="#A8BAC7" stroke-width="3"/><text x="210" y="360" font-family="Arial" font-size="32" fill="#2A8C82">Normal</text><text x="740" y="360" font-family="Arial" font-size="32" fill="#E04B4B">Pneumotórax</text><line x1="130" y1="510" x2="510" y2="510" stroke="#0F3B5D" stroke-width="10"/><path d="M150 650 Q320 560 490 650" fill="none" stroke="#2A8C82" stroke-width="8"/><line x1="690" y1="510" x2="1070" y2="510" stroke="#0F3B5D" stroke-width="10"/><g stroke="#888" stroke-width="5"><line x1="700" y1="650" x2="1060" y2="650"/><line x1="700" y1="720" x2="1060" y2="720"/><line x1="700" y1="790" x2="1060" y2="790"/></g><circle cx="870" cy="510" r="18" fill="#F0B14A"/><text x="900" y="520" font-family="Arial" font-size="28" fill="#0F3B5D">lung point</text><rect x="80" y="1180" width="1040" height="240" rx="20" fill="#EAF3F1" stroke="#2A8C82" stroke-width="3"/><text x="110" y="1250" font-family="Arial" font-size="34" font-weight="700" fill="#0F3B5D">Ponto-chave</text><text x="110" y="1310" font-family="Arial" font-size="26" fill="#2F4858">Ausência de sliding isoladamente não confirma; lung point é altamente específico.</text><text x="55" y="1540" font-family="Arial" font-size="25" fill="#0F3B5D">HEX-A039-386 · Revisão clínica pendente