<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Janelas acústicas do ultrassom</title><desc id="desc">Mapa didático das principais janelas acústicas e do posicionamento da sonda.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0F3B5D"/><text x="55" y="76" fill="white" font-family="Arial" font-size="38">HEXÁPODE · ULTRASSOM AVANÇADO</text><text x="55" y="195" fill="#0F3B5D" font-family="Arial" font-size="52" font-weight="700">Janelas acústicas</text><text x="55" y="248" fill="#2F4858" font-family="Arial" font-size="28">Escolha da janela e posicionamento da sonda</text><rect x="55" y="290" width="1090" height="930" rx="24" fill="white" stroke="#A8BAC7" stroke-width="3"/><circle cx="600" cy="640" r="260" fill="#F2D3C7" stroke="#7A4A46" stroke-width="6"/><rect x="560" y="430" width="80" height="420" rx="35" fill="#7FC2D4" stroke="#0F3B5D" stroke-width="5"/><g fill="#2A8C82"><circle cx="420" cy="520" r="28"/><circle cx="780" cy="520" r="28"/><circle cx="430" cy="760" r="28"/><circle cx="770" cy="760" r="28"/></g><g stroke="#0F3B5D" stroke-width="5"><line x1="420" y1="520" x2="250" y2="390"/><line x1="780" y1="520" x2="950" y2="390"/><line x1="430" y1="760" x2="250" y2="930"/><line x1="770" y1="760" x2="950" y2="930"/></g><text x="105" y="360" font-family="Arial" font-size="30" fill="#0F3B5D">Cardíaca</text><text x="900" y="360" font-family="Arial" font-size="30" fill="#0F3B5D">Pulmonar</text><text x="90" y="980" font-family="Arial" font-size="30" fill="#0F3B5D">Abdominal</text><text x="880" y="980" font-family="Arial" font-size="30" fill="#0F3B5D">Vascular</text><rect x="80" y="1260" width="1040" height="220" rx="20" fill="#EAF3F1" stroke="#2A8C82" stroke-width="3"/><text x="110" y="1330" font-family="Arial" font-size="34" font-weight="700" fill="#0F3B5D">Ponto-chave</text><text x="110" y="1390" font-family="Arial" font-size="