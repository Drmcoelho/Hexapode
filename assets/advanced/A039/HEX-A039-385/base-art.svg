<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Padrão B-lines</title><desc id="d">Artefatos verticais originados na pleura que alcançam o fundo da tela e apagam linhas A.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0F3B5D"/><text x="55" y="76" fill="white" font-family="Arial" font-size="38">HEXÁPODE · ULTRASSOM AVANÇADO</text><text x="55" y="195" fill="#0F3B5D" font-family="Arial" font-size="52" font-weight="700">Padrão B-lines</text><rect x="130" y="320" width="940" height="760" rx="20" fill="#14181C"/><line x1="210" y1="450" x2="990" y2="450" stroke="#fff" stroke-width="9"/><g stroke="#F7F4EC" stroke-width="18" opacity="0.9"><line x1="360" y1="450" x2="300" y2="1060"/><line x1="560" y1="450" x2="540" y2="1060"/><line x1="760" y1="450" x2="800" y2="1060"/></g><rect x="80" y="1160" width="1040" height="260" rx="20" fill="#EAF3F1" stroke="#2A8C82" stroke-width="3"/><text x="110" y="1230" font-family="Arial" font-size="34" font-weight="700" fill="#0F3B5D">Ponto-chave</text><text x="110" y="1290" font-family="Arial" font-size="26" fill="#2F4858">Múltiplas linhas B bilaterais sugerem aumento de densidade intersticial ou alveolar.</text><text x="55" y="1540" font-family="Arial" font-size="25" fill="#0F3B5D">HEX-A039-385 · Revisão clínica pendente</text></svg>