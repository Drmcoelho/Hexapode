<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Derrame pleural no ultrassom</title><desc id="d">Líquido anecoico, pulmão atelectasiado e janela segura para avaliação do derrame.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="120" fill="#0F3B5D"/><text x="55" y="76" fill="white" font-family="Arial" font-size="38">HEXÁPODE · ULTRASSOM AVANÇADO</text><text x="55" y="195" fill="#0F3B5D" font-family="Arial" font-size="52" font-weight="700">Derrame pleural</text><rect x="90" y="320" width="1020" height="800" rx="22" fill="#15191D"/><path d="M180 850 Q600 520 1020 850 L1020 1060 L180 1060Z" fill="#58AFCB" opacity="0.75"/><path d="M420 650 Q600 500 780 650 Q700 760 600 790 Q500 760 420 650Z" fill="#B9B9B9" stroke="#F7F4EC" stroke-width="5"/><line x1="210" y1="460" x2="990" y2="460" stroke="#F7F4EC" stroke-width="8"/><text x="220" y="920" font-family="Arial" font-size="30" fill="white">Líquido anecoico</text><text x="470" y="620" font-family="Arial" font-size="30" fill="white">Pulmão atelectasiado</text><rect x="80" y="1180" width="1040" height="240" rx="20" fill="#EAF3F1" stroke="#2A8C82" stroke-width="3"/><text x="110" y="1250" font-family="Arial" font-size="34" font-weight="700" fill="#0F3B5D">Ponto-chave</text><text x="110" y="1310" font-family="Arial" font-size="26" fill="#2F4858">A imagem deve confirmar líquido, profundidade e ausência de estruturas interpostas antes de punção.</text><text x="55" y="1540" font-family="Arial" font-size="25" fill="#0F3B5D">HEX-A039-387 · Revisão clínica pendente</text></svg>