<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Vasoplegia e perda de tônus vascular</title><desc>Vasodilatação, queda da resistência vascular, aumento da capacitância venosa e maldistribuição do fluxo.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="96" fill="#183153"/><text x="50" y="62" font-family="Arial" font-size="28" font-weight="700" fill="white">HEXÁPODE · HEMODINÂMICA AVANÇADA</text><text x="70" y="155" font-family="Georgia" font-size="44" font-weight="700" fill="#183153">Vasoplegia</text><text x="70" y="205" font-family="Arial" font-size="23" fill="#6A727A">Perda de tônus vascular e redistribuição inadequada do fluxo</text><rect x="70" y="260" width="1060" height="520" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><rect x="140" y="390" width="420" height="180" rx="90" fill="#F8DADA" stroke="#C84C4C" stroke-width="5"/><rect x="190" y="435" width="320" height="90" rx="45" fill="#C84C4C" opacity=".4"/><line x1="220" y1="480" x2="480" y2="480" stroke="#2F6FAE" stroke-width="18"/><polygon points="480,480 440,450 440,510" fill="#2F6FAE"/><text x="195" y="630" font-family="Arial" font-size="24" fill="#C84C4C">vasodilatação arterial</text><rect x="650" y="365" width="390" height="260" rx="24" fill="#FDECEC" stroke="#C84C4C" stroke-width="3"/><text x="700" y="430" font-family="Arial" font-size="24" fill="#183153">↓ resistência vascular sistêmica</text><text x="700" y="482" font-family="Arial" font-size="24" fill="#183153">↑ capacitância venosa</text><text x="700" y="534" font-family="Arial" font-size="24" fill="#183153">DC normal ou alto</text><text x="700" y="586" font-family="Arial" font-size="24" fill="#183153">fluxo mal distribuído</text><rect x="70" y="830" width="1060" height="490" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><text x="100" y="885" font-family="Arial" font-size="27" font-weight="700" fill="#C84C4C">POR QUE A PRESSÃO CAI?</text><circle cx="250" cy="1060" r="100" fill="#FDECEC" stroke="#C84C4C" stroke-width="5"/><text x="250" y="1050" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#C84C4C">TÔNUS</text><text x="250" y="1095" text-anchor="middle" font-family="Arial" font-size="22" fill="#183153">arterial ↓</text><circle cx="600" cy="1060" r="100" fill="#FFF3D9" stroke="#E29A2D" stroke-width="5"/><text x="600" y="1050" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#E29A2D">VOLUME</text><text x="600" y="1095" text-anchor="middle" font-family="Arial" font-size="22" fill="#183153">estressado ↓</text><circle cx="950" cy="1060" r="100" fill="#EEF5F6" stroke="#0F8B8D" stroke-width="5"/><text x="950" y="1050" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#0F8B8D">FLUXO</text><text x="950" y="1095" text-anchor="middle" font-family="Arial" font-size="22" fill="#183153">heterogêneo</text><rect x="160" y="1360" width="880" height="82" rx="18" fill="#FDECEC" stroke="#C84C4C"/><text x="210" y="1410" font-family="Arial" font-size="24" fill="#183153">Pressão recuperada não garante microcirculação normal.</text><text x="70" y="1550" font-family="Arial" font-size="20" fill="#6A727A">HEX-A033-327 · origem HEX-G013-127</text></svg>