<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Frank-Starling e responsividade a fluidos</title><desc>Curva de Frank-Starling com zona responsiva, platô e três perguntas antes de administrar fluidos.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="96" fill="#183153"/><text x="50" y="62" font-family="Arial" font-size="28" font-weight="700" fill="white">HEXÁPODE · HEMODINÂMICA AVANÇADA</text><text x="70" y="155" font-family="Georgia" font-size="44" font-weight="700" fill="#183153">Frank-Starling e fluidos</text><rect x="70" y="240" width="1060" height="650" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><line x1="180" y1="760" x2="1040" y2="760" stroke="#183153" stroke-width="4"/><line x1="180" y1="760" x2="180" y2="350" stroke="#183153" stroke-width="4"/><path d="M210 730 C390 560 560 390 760 370 C900 355 990 365 1020 375" fill="none" stroke="#0F8B8D" stroke-width="12"/><line x1="620" y1="350" x2="620" y2="760" stroke="#D8D2C4" stroke-width="4" stroke-dasharray="12 12"/><text x="310" y="480" font-family="Arial" font-size="24" fill="#2E8B57">zona responsiva</text><text x="810" y="345" font-family="Arial" font-size="24" fill="#E29A2D">platô</text><text x="490" y="825" font-family="Arial" font-size="24" fill="#183153">pré-carga</text><text x="95" y="600" font-family="Arial" font-size="24" fill="#183153" transform="rotate(-90 95 600)">volume sistólico</text><rect x="70" y="930" width="1060" height="380" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><text x="100" y="985" font-family="Arial" font-size="27" font-weight="700" fill="#E29A2D">RESPONDE? TOLERA? PRECISA?</text><circle cx="250" cy="1120" r="90" fill="#EAF6EF" stroke="#2E8B57" stroke-width="4"/><text x="250" y="1110" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2E8B57">RESPONDE</text><text x="250" y="1150" text-anchor="middle" font-family="Arial" font-size="20" fill="#183153">↑ volume sistólico</text><circle cx="600" cy="1120" r="90" fill="#FFF3D9" stroke="#E29A2D" stroke-width="4"/><text x="600" y="1110" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#E29A2D">TOLERA</text><text x="600" y="1150" text-anchor="middle" font-family="Arial" font-size="20" fill="#183153">sem congestão</text><circle cx="950" cy="1120" r="90" fill="#E9F4FA" stroke="#2F6FAE" stroke-width="4"/><text x="950" y="1110" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2F6FAE">PRECISA</text><text x="950" y="1150" text-anchor="middle" font-family="Arial" font-size="20" fill="#183153">hipoperfusão reversível</text><rect x="160" y="1360" width="880" height="82" rx="18" fill="#FFF3D9" stroke="#E29A2D"/><text x="210" y="1410" font-family="Arial" font-size="24" fill="#183153">Responsividade não prova benefício clínico líquido.</text><text x="70" y="1550" font-family="Arial" font-size="20" fill="#6A727A">HEX-A033-326 · origem HEX-G013-126</text></svg>