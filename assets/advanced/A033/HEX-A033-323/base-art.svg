<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Débito cardíaco e seus componentes</title><desc>Débito cardíaco, frequência, volume sistólico e determinantes.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="96" fill="#183153"/><text x="50" y="62" font-family="Arial" font-size="28" font-weight="700" fill="white">HEXÁPODE · HEMODINÂMICA AVANÇADA</text><text x="70" y="155" font-family="Georgia" font-size="46" font-weight="700" fill="#183153">Débito cardíaco</text><text x="600" y="390" text-anchor="middle" font-family="Georgia" font-size="68" font-weight="700" fill="#183153">DC = FC × VS</text><text x="225" y="485" font-family="Arial" font-size="26" fill="#2F6FAE">frequência cardíaca</text><text x="760" y="485" font-family="Arial" font-size="26" fill="#C84C4C">volume sistólico</text><rect x="70" y="580" width="1060" height="670" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><text x="100" y="635" font-family="Arial" font-size="27" font-weight="700" fill="#0F8B8D">DETERMINANTES DO VOLUME SISTÓLICO</text><circle cx="250" cy="850" r="120" fill="#E9F4FA" stroke="#2F6FAE" stroke-width="5"/><text x="250" y="845" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#2F6FAE">PRÉ-CARGA</text><text x="250" y="890" text-anchor="middle" font-family="Arial" font-size="22" fill="#183153">enchimento</text><circle cx="600" cy="850" r="120" fill="#EEF5F6" stroke="#0F8B8D" stroke-width="5"/><text x="600" y="845" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0F8B8D">CONTRATILIDADE</text><text x="600" y="890" text-anchor="middle" font-family="Arial" font-size="22" fill="#183153">força intrínseca</text><circle cx="950" cy="850" r="120" fill="#FFF3D9" stroke="#E29A2D" stroke-width="5"/><text x="950" y="845" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#E29A2D">PÓS-CARGA</text><text x="950" y="890" text-anchor="middle" font-family="Arial" font-size="22" fill="#183153">carga de ejeção</text><rect x="220" y="1060" width="760" height="110" rx="20" fill="#F3EEF9" stroke="#7A5BA6" stroke-width="3"/><text x="600" y="1128" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#7A5BA6">VS = VDF − VSF</text><rect x="160" y="1360" width="880" height="82" rx="18" fill="#EEF5F6" stroke="#0F8B8D"/><text x="210" y="1410" font-family="Arial" font-size="24" fill="#183153">Débito normal não garante distribuição regional adequada.</text><text x="70" y="1550" font-family="Arial" font-size="20" fill="#6A727A">HEX-A033-323 · origem HEX-G013-123</text></svg>