<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Retorno venoso e pressão sistêmica média</title><desc>Curva de retorno venoso, pressão sistêmica média e pressão atrial direita.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="96" fill="#183153"/><text x="50" y="62" font-family="Arial" font-size="28" font-weight="700" fill="white">HEXÁPODE · HEMODINÂMICA AVANÇADA</text><text x="70" y="155" font-family="Georgia" font-size="44" font-weight="700" fill="#183153">Retorno venoso</text><text x="70" y="205" font-family="Arial" font-size="23" fill="#6A727A">Gradiente entre pressão sistêmica média e pressão atrial direita</text><rect x="70" y="260" width="1060" height="560" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><line x1="170" y1="720" x2="1030" y2="720" stroke="#183153" stroke-width="4"/><line x1="170" y1="720" x2="170" y2="350" stroke="#183153" stroke-width="4"/><path d="M220 400 L930 700" stroke="#0F8B8D" stroke-width="10"/><circle cx="930" cy="700" r="14" fill="#C84C4C"/><text x="850" y="760" font-family="Arial" font-size="24" fill="#C84C4C">Pms</text><text x="430" y="480" font-family="Arial" font-size="24" fill="#0F8B8D">inclinação = 1 / resistência venosa</text><text x="460" y="795" font-family="Arial" font-size="24" fill="#183153">pressão atrial direita</text><rect x="70" y="860" width="1060" height="450" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><text x="100" y="915" font-family="Arial" font-size="27" font-weight="700" fill="#7A5BA6">EQUAÇÃO E DESLOCAMENTOS</text><text x="600" y="1010" text-anchor="middle" font-family="Georgia" font-size="42" font-weight="700" fill="#7A5BA6">RV = (Pms − PAD) ÷ Rvenosa</text><line x1="210" y1="1110" x2="430" y2="1110" stroke="#2F6FAE" stroke-width="8"/><polygon points="430,1110 395,1085 395,1135" fill="#2F6FAE"/><text x="470" y="1118" font-family="Arial" font-size="24" fill="#183153">volume ou venoconstrição → ↑ Pms</text><line x1="210" y1="1190" x2="430" y2="1190" stroke="#C84C4C" stroke-width="8"/><polygon points="430,1190 395,1165 395,1215" fill="#C84C4C"/><text x="470" y="1198" font-family="Arial" font-size="24" fill="#183153">↑ PAD sem ↑ Pms → ↓ gradiente</text><rect x="165" y="1360" width="870" height="82" rx="18" fill="#F3EEF9" stroke="#7A5BA6"/><text x="220" y="1410" font-family="Arial" font-size="24" fill="#183153">Congestão venosa pode reduzir retorno e perfusão.</text><text x="70" y="1550" font-family="Arial" font-size="20" fill="#6A727A">HEX-A033-325 · origem HEX-G013-125</text></svg>