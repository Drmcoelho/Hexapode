<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Pressão arterial média e perfusão orgânica</title><desc>Pressão arterial média, contrapressões e gradientes de perfusão cerebral, renal e hepático.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="96" fill="#183153"/><text x="50" y="62" font-family="Arial" font-size="28" font-weight="700" fill="white">HEXÁPODE · HEMODINÂMICA AVANÇADA</text><text x="70" y="155" font-family="Georgia" font-size="44" font-weight="700" fill="#183153">PAM e perfusão orgânica</text><path d="M130 390 C230 220 320 560 420 340 S630 540 740 370 S930 520 1070 400" fill="none" stroke="#2F6FAE" stroke-width="12"/><line x1="130" y1="420" x2="1070" y2="420" stroke="#E29A2D" stroke-width="6" stroke-dasharray="18 14"/><text x="960" y="395" font-family="Arial" font-size="26" font-weight="700" fill="#E29A2D">PAM</text><text x="600" y="575" text-anchor="middle" font-family="Georgia" font-size="38" font-weight="700" fill="#183153">Fluxo ≈ (PAM − contrapressão) ÷ resistência</text><rect x="70" y="690" width="1060" height="620" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><text x="100" y="750" font-family="Arial" font-size="27" font-weight="700" fill="#C84C4C">O MESMO PAM, PERFUSÕES DIFERENTES</text><circle cx="250" cy="970" r="115" fill="#F3EEF9" stroke="#7A5BA6" stroke-width="5"/><text x="250" y="955" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#7A5BA6">CÉREBRO</text><text x="250" y="1005" text-anchor="middle" font-family="Arial" font-size="22" fill="#183153">PPC = PAM − PIC</text><circle cx="600" cy="970" r="115" fill="#EEF5F6" stroke="#0F8B8D" stroke-width="5"/><text x="600" y="955" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#0F8B8D">RIM</text><text x="600" y="1005" text-anchor="middle" font-family="Arial" font-size="22" fill="#183153">gradiente renal</text><circle cx="950" cy="970" r="115" fill="#FFF3D9" stroke="#E29A2D"