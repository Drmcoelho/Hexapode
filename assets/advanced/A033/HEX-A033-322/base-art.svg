<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Pós-carga: ventrículo e impedância arterial</title><desc>Pressão arterial, resistência, complacência e estresse parietal compondo a pós-carga.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="96" fill="#183153"/><text x="50" y="62" font-family="Arial" font-size="28" font-weight="700" fill="white">HEXÁPODE · HEMODINÂMICA AVANÇADA</text><text x="70" y="155" font-family="Georgia" font-size="46" font-weight="700" fill="#183153">Pós-carga e impedância arterial</text><text x="70" y="205" font-family="Arial" font-size="23" fill="#6A727A">Carga enfrentada pelo ventrículo durante a ejeção</text><rect x="70" y="260" width="1060" height="500" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><path d="M250 420 C195 370 135 435 170 535 C205 635 250 680 250 680 C250 680 305 635 340 535 C375 435 305 370 250 420Z" fill="#E7857D" stroke="#C84C4C" stroke-width="5"/><line x1="350" y1="520" x2="1010" y2="520" stroke="#C84C4C" stroke-width="22"/><polygon points="1010,520 965,485 965,555" fill="#C84C4C"/><circle cx="500" cy="430" r="70" fill="#FFF3D9" stroke="#E29A2D" stroke-width="4"/><text x="500" y="440" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#E29A2D">PAM</text><circle cx="705" cy="430" r="70" fill="#E9F4FA" stroke="#2F6FAE" stroke-width="4"/><text x="705" y="440" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2F6FAE">RVS</text><circle cx="910" cy="430" r="80" fill="#EEF5F6" stroke="#0F8B8D" stroke-width="4"/><text x="910" y="425" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0F8B8D">complacência</text><text x="910" y="455" text-anchor="middle" font-family="Arial" font-size="20" fill="#183153">arterial</text><text x="440" y="665" font-family="Arial" font-size="28" fill="#183153">impedância arterial total</text><rect x="70" y="820" width="1060" height="500" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><text x="100" y="875" font-family="Arial" font-size="27" font-weight="700" fill="#7A5BA6">ESTRESSE PARIETAL · LAPLACE</text><circle cx="350" cy="1070" r="165" fill="#F8DADA" stroke="#C84C4C" stroke-width="5"/><circle cx="350" cy="1070" r="95" fill="#F7F4EC" stroke="#183153" stroke-width="4"/><line x1="350" y1="1070" x2="515" y2="1070" stroke="#E29A2D" stroke-width="6"/><rect x="610" y="920" width="430" height="300" rx="24" fill="#F3EEF9" stroke="#7A5BA6" stroke-width="3"/><text x="660" y="995" font-family="Arial" font-size="38" font-weight="700" fill="#7A5BA6">σ ∝ P × r ÷ h</text><text x="650" y="1060" font-family="Arial" font-size="24" fill="#183153">↑ pressão ou raio → ↑ estresse</text><text x="650" y="1115" font-family="Arial" font-size="24" fill="#183153">↑ espessura → ↓ estresse</text><text x="650" y="1170" font-family="Arial" font-size="24" fill="#183153">Pós-carga ≠ apenas RVS</text><rect x="150" y="1360" width="900" height="82" rx="18" fill="#EEF5F6" stroke="#0F8B8D"/><text x="205" y="1410" font-family="Arial" font-size="24" fill="#183153">Inclui pressão, geometria ventricular e pulsatilidade.</text><text x="70" y="1550" font-family="Arial" font-size="20" fill="#6A727A">HEX-A033-322 · origem HEX-G013-122</text></svg>