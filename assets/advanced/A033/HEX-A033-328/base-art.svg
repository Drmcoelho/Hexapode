<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Perfis hemodinâmicos do choque</title><desc>Comparação dos perfis hipovolêmico, cardiogênico, distributivo e obstrutivo.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="96" fill="#183153"/><text x="50" y="62" font-family="Arial" font-size="28" font-weight="700" fill="white">HEXÁPODE · HEMODINÂMICA AVANÇADA</text><text x="70" y="155" font-family="Georgia" font-size="44" font-weight="700" fill="#183153">Perfis hemodinâmicos do choque</text><rect x="70" y="230" width="1060" height="1080" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><g font-family="Arial" fill="#183153"><rect x="110" y="330" width="470" height="360" rx="24" fill="#E9F4FA" stroke="#2F6FAE" stroke-width="4"/><text x="145" y="390" font-size="28" font-weight="700" fill="#2F6FAE">HIPOVOLÊMICO</text><text x="150" y="475" font-size="30">DC ↓</text><text x="150" y="545" font-size="30">RVS ↑</text><text x="150" y="615" font-size="28">pressões de enchimento ↓</text><rect x="620" y="330" width="470" height="360" rx="24" fill="#FDECEC" stroke="#C84C4C" stroke-width="4"/><text x="655" y="390" font-size="28" font-weight="700" fill="#C84C4C">CARDIOGÊNICO</text><text x="660" y="475" font-size="30">DC ↓</text><text x="660" y="545" font-size="30">RVS ↑</text><text x="660" y="615" font-size="28">pressões de enchimento ↑</text><rect x="110" y="760" width="470" height="360" rx="24" fill="#EEF5F6" stroke="#0F8B8D" stroke-width="4"/><text x="145" y="820" font-size="28" font-weight="700" fill="#0F8B8D">DISTRIBUTIVO</text><text x="150" y="905" font-size="30">DC ↔ / ↑</text><text x="150" y="975" font-size="30">RVS ↓</text><text x="150" y="1045" font-size="28">pressões ↓ / ↔</text><rect x="620" y="760" width="470" height="360" rx="24" fill="#F3EEF9" stroke="#7A5BA6" stroke-width="4"/><text x="655" y="820" font-size="28" font-weight="700" fill="#7A5BA6">OBSTRUTIVO</text><text x="660" y="905" font-size="30">DC ↓</text><text x="660" y="975" font-size="30">RVS ↑</text><text x="660" y="1045" font-size="28">pressões variáveis</text></g><rect x="150" y="1360" width="900" height="82" rx="18" fill="#EEF5F6" stroke="#0F8B8D"/><text x="205" y="1410" font-family="Arial" font-size="24" fill="#183153">Perfis podem coexistir e mudar após cada intervenção.</text><text x="70" y="1550" font-family="Arial" font-size="20" fill="#6A727A">HEX-A033-328 · origem HEX-G013-128</text></svg>