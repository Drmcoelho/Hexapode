<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Oferta, consumo e extração de oxigênio</title><desc>Equações de oferta e conteúdo arterial de oxigênio e curva de dependência do consumo.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="96" fill="#183153"/><text x="50" y="62" font-family="Arial" font-size="28" font-weight="700" fill="white">HEXÁPODE · HEMODINÂMICA AVANÇADA</text><text x="70" y="155" font-family="Georgia" font-size="44" font-weight="700" fill="#183153">Oferta e consumo de oxigênio</text><rect x="70" y="240" width="1060" height="450" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><text x="600" y="385" text-anchor="middle" font-family="Georgia" font-size="46" font-weight="700" fill="#183153">DO₂ = DC × CaO₂ × 10</text><text x="600" y="485" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#2F6FAE">CaO₂ ≈ 1,34 × Hb × SaO₂ + 0,003 × PaO₂</text><line x1="190" y1="590" x2="1010" y2="590" stroke="#0F8B8D" stroke-width="14"/><polygon points="1010,590 970,560 970,620" fill="#0F8B8D"/><text x="235" y="645" font-family="Arial" font-size="23" fill="#183153">coração</text><text x="525" y="645" font-family="Arial" font-size="23" fill="#183153">conteúdo arterial</text><text x="885" y="645" font-family="Arial" font-size="23" fill="#183153">tecidos</text><rect x="70" y="740" width="1060" height="570" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><text x="100" y="795" font-family="Arial" font-size="27" font-weight="700" fill="#7A5BA6">RELAÇÃO OFERTA–CONSUMO</text><line x1="180" y1="1240" x2="1030" y2="1240" stroke="#183153" stroke-width="4"/><line x1="180" y1="1240" x2="180" y2="850" stroke="#183153" stroke-width="4"/><path d="M210 1160 C380 1000 520 900 650 900 C800 900 920 900 1010 900" fill="none" stroke="#C84C4C" stroke-width="12"/><line x1="650" y1="850" x2="650" y2="1240" stroke="#E29A2D" stroke-width="5" stroke-dasharray="14 12"/><text x="690" y="880" font-family="Arial" font-size="23" fill="#E29A2D">DO₂ crítica</text><text x="270" y="1100" font-family="Arial" font-size="22" fill="#C84C4C">VO₂ dependente da oferta</text><text x="740" y="960" font-family="Arial" font-size="22" fill="#2E8B57">VO₂ independente da oferta</text><path d="M210 1030 C350 920 500 880 650 870 C820 860 930 865 1010 870" fill="none" stroke="#2E8B57" stroke-width="7" stroke-dasharray="18 12"/><rect x="165" y="1360" width="870" height="82" rx="18" fill="#F3EEF9" stroke="#7A5BA6"/><text x="220" y="1410" font-family="Arial" font-size="24" fill="#183153">Extração elevada compensa até o limiar crítico.</text><text x="70" y="1550" font-family="Arial" font-size="20" fill="#6A727A">HEX-A033-330 · origem HEX-G013-130</text></svg>