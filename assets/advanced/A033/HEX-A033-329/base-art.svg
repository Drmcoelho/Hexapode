<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Microcirculação e heterogeneidade de fluxo</title><desc>Desacoplamento entre macro-hemodinâmica e perfusão capilar.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="96" fill="#183153"/><text x="50" y="62" font-family="Arial" font-size="28" font-weight="700" fill="white">HEXÁPODE · HEMODINÂMICA AVANÇADA</text><text x="70" y="155" font-family="Georgia" font-size="44" font-weight="700" fill="#183153">Macro ≠ microcirculação</text><rect x="70" y="250" width="1060" height="650" rx="24" fill="#FFFDF8" stroke="#D8D2C4"/><rect x="140" y="350" width="390" height="430" rx="24" fill="#EEF5F6" stroke="#0F8B8D" stroke-width="3"/><text x="335" y="410" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#0F8B8D">MACROCIRCULAÇÃO</text><text x="190" y="485" font-family="Arial" font-size="24" fill="#183153">• PAM</text><text x="190" y="540" font-family="Arial" font-size="24" fill="#183153">• débito cardíaco</text><text x="190" y="595" font-family="Arial" font-size="24" fill="#183153">• saturação venosa</text><text x="190" y="650" font-family="Arial" font-size="24" fill="#183153">• lactato</text><circle cx="335" cy="720" r="40" fill="#2E8B57"/><text x="335" y="732" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="white">✓</text><rect x="670" y="350" width="390" height="430" rx="24" fill="#FDECEC" stroke="#C84C4C" stroke-width="3"/><text x="865" y="410" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#C84C4C">MICROCIRCULAÇÃO</text><path d="M720 500 C790 465 850 535 920 500 S1020 480 1030 500" fill="none" stroke="#C84C4C" stroke-width="7"/><path d="M720 570 C790 535 850 605 920 570 S1020 550 1030 570" fill="none" stroke="#C84C4C" stroke-width="7"/><path d="M720 640 C790 605 850 675 920 640 S1020 620 1030 640" fill="none" stroke="#C84C4C" stroke-width="7"/><line x1="850" y1="460" x2="8