<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Hipoglicemia grave</title><desc id="d">Queda da glicose, sintomas autonômicos, neuroglicopenia, contrarregulação e correção.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="70" fill="#16345B"/><text x="70" y="47" font-family="Arial" font-size="27" font-weight="700" fill="white">HEXÁPODE · EMERGÊNCIAS AVANÇADAS</text><text x="70" y="155" font-family="Arial" font-size="43" font-weight="700" fill="#16345B">Hipoglicemia grave</text><text x="70" y="205" font-family="Arial" font-size="27" fill="#0F8C85">neuroglicopenia e resposta contrarregulatória</text><g transform="translate(80 300)"><circle cx="230" cy="230" r="145" fill="#FFF0D6" stroke="#E8A33A" stroke-width="5"/><text x="230" y="215" font-family="Arial" font-size="36" font-weight="700" text-anchor="middle" fill="#E8A33A">GLICOSE</text><text x="230" y="275" font-family="Arial" font-size="50" font-weight="700" text-anchor="middle" fill="#D9574F">↓</text><path d="M390 230H530" stroke="#2F6FAE" stroke-width="10"/><polygon points="530,230 500,212 500,248" fill="#2F6FAE"/><circle cx="720" cy="230" r="155" fill="#EAF3FA" stroke="#2F6FAE" stroke-width="5"/><path d="M650 200c0-80 140-80 140 0v90c0 70-140 70-140 0z" fill="#B9DDF4"/><text x="720" y="455" font-family="Arial" font-size="30" text-anchor="middle" fill="#16345B">neuroglicopenia</text><rect x="40" y="560" width="450" height="280" rx="28" fill="#FFFDF8" stroke="#CDD7E0" stroke-width="3"/><text x="75" y="625" font-family="Arial" font-size="29" font-weight="700" fill="#0F8C85">SINAIS AUTONÔMICOS</text><text x="75" y="690" font-family="Arial" font-size="24" fill="#16345B">sudorese · tremor · palpitação · fome</text><rect x="530" y="560" width="450" height="280" rx="28" fill="#FFFDF8" stroke="#CDD7E0" stroke-width="3"/><text x="565" y="625" font-family="Arial" font-size="29" font-weight="700" fill="#D9574F">SINAIS CEREBRAIS</text><text x="565" y="690" font-family="Arial" font-size="24" fill="#16345B">confusão · convulsão · coma · déficit focal</text><rect x="170" y="920" width="700" height="170" rx="28" fill="#E7F3EF" stroke="#4F9B73" stroke-width="4"/><text x="520" y="990" font-family="Arial" font-size="31" font-weight="700" text-anchor="middle" fill="#4F9B73">CORRIGIR GLICOSE E TRATAR A CAUSA</text><text x="520" y="1040" font-family="Arial" font-size="23" text-anchor="middle" fill="#16345B">reavaliar consciência e prevenir recorrência</text></g><rect y="1500" width="1200" height="100" fill="#16345B"/><text x="70" y="1560" font-family="Arial" font-size="23" fill="white">HEX-A034-339 · uso educacional</text></svg>