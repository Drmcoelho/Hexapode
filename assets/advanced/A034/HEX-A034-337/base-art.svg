<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Tromboembolismo pulmonar maciço</title><desc id="d">Obstrução vascular, aumento da pós-carga do ventrículo direito, desvio septal, baixo débito e choque.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="70" fill="#16345B"/><text x="70" y="47" font-family="Arial" font-size="27" font-weight="700" fill="white">HEXÁPODE · EMERGÊNCIAS AVANÇADAS</text><text x="70" y="155" font-family="Arial" font-size="43" font-weight="700" fill="#16345B">Tromboembolismo pulmonar maciço</text><text x="70" y="205" font-family="Arial" font-size="27" fill="#0F8C85">sobrecarga do VD e choque obstrutivo</text><g transform="translate(70 290)"><path d="M170 190C120 110 45 155 65 250C85 340 170 405 250 470C330 405 415 340 435 250C455 155 380 110 330 190C295 145 205 145 170 190Z" fill="#F7B7AE" stroke="#D9574F" stroke-width="5"/><path d="M250 160V90" stroke="#2F6FAE" stroke-width="24"/><path d="M250 95C420 95 520 170 600 250" fill="none" stroke="#2F6FAE" stroke-width="24"/><circle cx="500" cy="185" r="28" fill="#6B1E1E"/><path d="M620 250H760" stroke="#D9574F" stroke-width="10"/><polygon points="760,250 730,232 730,268" fill="#D9574F"/><rect x="790" y="80" width="300" height="360" rx="28" fill="#FFFDF8" stroke="#CDD7E0" stroke-width="3"/><text x="940" y="140" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#D9574F">VD SOB CARGA</text><circle cx="940" cy="245" r="72" fill="#FDE1DD" stroke="#D9574F" stroke-width="5"/><text x="940" y="255" font-family="Arial" font-size="32" font-weight="700" text-anchor="middle" fill="#D9574F">VD ↑</text><text x="940" y="350" font-family="Arial" font-size="24" text-anchor="middle" fill="#16345B">desvio septal · baixo débito</text><rect x="50" y="570" width="1040" height="280" rx="28" fill="#FFFDF8" stroke="#CDD7E0" stroke-width="3"/><text x="90" y="635" font-family="Arial" font-size="30" font-weight="700" fill="#16345B">CADEIA HEMODINÂMICA</text><text x="90" y="715" font-family="Arial" font-size="24" fill="#16345B">obstrução vascular → ↑ RVP → dilatação do VD → ↓ enchimento do VE → choque</text><text x="90" y="785" font-family="Arial" font-size="24" fill="#D9574F">Pistas: hipotensão, hipoxemia, síncope, VD dilatado ao USG</text></g><rect y="1500" width="1200" height="100" fill="#16345B"/><text x="70" y="1560" font-family="Arial" font-size="23" fill="white">HEX-A034-337 · uso educacional</text></svg>