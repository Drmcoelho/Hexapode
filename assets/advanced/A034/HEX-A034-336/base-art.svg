<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Estado de mal asmático</title><desc id="d">Broncoespasmo, limitação expiratória, hiperinsuflação dinâmica, auto-PEEP e fadiga.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="70" fill="#16345B"/><text x="70" y="47" font-family="Arial" font-size="27" font-weight="700" fill="white">HEXÁPODE · EMERGÊNCIAS AVANÇADAS</text><text x="70" y="155" font-family="Arial" font-size="43" font-weight="700" fill="#16345B">Estado de mal asmático</text><text x="70" y="205" font-family="Arial" font-size="27" fill="#0F8C85">aprisionamento aéreo e fadiga ventilatória</text><g transform="translate(80 300)"><circle cx="250" cy="250" r="150" fill="#F7C5BE" stroke="#D9574F" stroke-width="5"/><circle cx="250" cy="250" r="45" fill="#FFFDF8" stroke="#D9574F" stroke-width="8"/><path d="M195 250H305" stroke="#D9574F" stroke-width="18"/><text x="250" y="455" font-family="Arial" font-size="28" text-anchor="middle" fill="#16345B">broncoespasmo + edema + secreção</text><path d="M450 250H590" stroke="#2F6FAE" stroke-width="10"/><polygon points="590,250 560,232 560,268" fill="#2F6FAE"/><circle cx="770" cy="250" r="165" fill="#EAF3FA" stroke="#2F6FAE" stroke-width="5"/><path d="M690 170C650 260 650 330 690 390" fill="none" stroke="#0F8C85" stroke-width="18"/><path d="M850 170C890 260 890 330 850 390" fill="none" stroke="#0F8C85" stroke-width="18"/><text x="770" y="455" font-family="Arial" font-size="28" text-anchor="middle" fill="#16345B">hiperinsuflação dinâmica</text><rect x="50" y="600" width="940" height="270" rx="28" fill="#FFFDF8" stroke="#CDD7E0" stroke-width="3"/><text x="90" y="665" font-family="Arial" font-size="30" font-weight="700" fill="#16345B">CASCATA DE GRAVIDADE</text><text x="90" y="740" font-family="Arial" font-size="24" fill="#D9574F">limitação expiratória</text><text x="320" y="740" font-family="Arial" font-size="30" fill="#2F6FAE">→</text><text x="370" y="740" font-family="Arial" font-size="24" fill="#16345B">auto-PEEP</text><text x="530" y="740" font-family="Arial" font-size="30" fill="#2F6FAE">→</text><text x="580" y="740" font-family="Arial" font-size="24" fill="#16345B">fadiga</text><text x="730" y="740" font-family="Arial" font-size="30" fill="#2F6FAE">→</text><text x="780" y="740" font-family="Arial" font-size="24" fill="#D9574F">falência</text><text x="90" y="815" font-family="Arial" font-size="24" fill="#16345B">silêncio auscultatório pode significar fluxo crítico, não melhora</text></g><rect y="1500" width="1200" height="100" fill="#16345B"/><text x="70" y="1560" font-family="Arial" font-size="23" fill="white">HEX-A034-336 · uso educacional</text></svg>