<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Choque séptico</title><desc id="d">Vasoplegia, disfunção endotelial, heterogeneidade microcirculatória e elevação do lactato.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="70" fill="#16345B"/><text x="70" y="47" font-family="Arial" font-size="27" font-weight="700" fill="white">HEXÁPODE · EMERGÊNCIAS AVANÇADAS</text><text x="70" y="155" font-family="Arial" font-size="43" font-weight="700" fill="#16345B">Choque séptico</text><text x="70" y="205" font-family="Arial" font-size="27" fill="#0F8C85">vasoplegia, microcirculação e lactato</text><g transform="translate(90 300)"><circle cx="510" cy="180" r="125" fill="#FDE1DD" stroke="#D9574F" stroke-width="5"/><text x="510" y="170" font-family="Arial" font-size="34" font-weight="700" text-anchor="middle" fill="#D9574F">INFECÇÃO</text><text x="510" y="215" font-family="Arial" font-size="25" text-anchor="middle" fill="#16345B">resposta desregulada</text><path d="M510 305V430" stroke="#D9574F" stroke-width="10"/><polygon points="510,450 490,415 530,415" fill="#D9574F"/><rect x="20" y="480" width="300" height="230" rx="26" fill="#E7F3EF" stroke="#4F9B73" stroke-width="4"/><text x="170" y="545" font-family="Arial" font-size="29" font-weight="700" text-anchor="middle" fill="#4F9B73">VASOPLEGIA</text><text x="170" y="610" font-family="Arial" font-size="23" text-anchor="middle" fill="#16345B">↓ RVS · hipotensão</text><text x="170" y="655" font-family="Arial" font-size="23" text-anchor="middle" fill="#16345B">maldistribuição de fluxo</text><rect x="360" y="480" width="300" height="230" rx="26" fill="#EAF3FA" stroke="#2F6FAE" stroke-width="4"/><text x="510" y="545" font-family="Arial" font-size="29" font-weight="700" text-anchor="middle" fill="#2F6FAE">ENDOTÉLIO</text><text x="510" y="610" font-family="Arial" font-size="23" text-anchor="middle" fill="#16345B">permeabilidade</text><text x="510" y="655" font-family="Arial" font-size="23" text-anchor="middle" fill="#16345B">microtrombos</text><rect x="700" y="480" width="300" height="230" rx="26" fill="#FFF0D6" stroke="#E8A33A" stroke-width="4"/><text x="850" y="545" font-family="Arial" font-size="29" font-weight="700" text-anchor="middle" fill="#E8A33A">METABOLISMO</text><text x="850" y="610" font-family="Arial" font-size="23" text-anchor="middle" fill="#16345B">extração alterada</text><text x="850" y="655" font-family="Arial" font-size="23" text-anchor="middle" fill="#16345B">lactato ↑</text><path d="M170 710C230 860 790 860 850 710" fill="none" stroke="#D9574F" stroke-width="8"/><rect x="150" y="850" width="720" height="190" rx="28" fill="#FFFDF8" stroke="#CDD7E0" stroke-width="3"/><text x="510" y="925" font-family="Arial" font-size="31" font-weight="700" text-anchor="middle" fill="#D9574F">HIPOPERFUSÃO E DISFUNÇÃO ORGÂNICA</text><text x="510" y="985" font-family="Arial" font-size="24" text-anchor="middle" fill="#16345B">pressão normal não garante perfusão microvascular adequada</text></g><rect y="1500" width="1200" height="100" fill="#16345B"/><text x="70" y="1560" font-family="Arial" font-size="23" fill="white">HEX-A034-334 · uso educacional</text></svg>