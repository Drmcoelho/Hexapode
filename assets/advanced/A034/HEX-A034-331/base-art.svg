text x="55" y="565" font-family="Arial" font-size="25" fill="#16345B">FV / TV sem pulso → choque + RCP</text><rect x="540" y="300" width="490" height="330" rx="28" fill="#FFFDF8" stroke="#CDD7E0" stroke-width="3"/><text x="575" y="360" font-family="Arial" font-size="30" font-weight="700" fill="#2F6FAE">NÃO CHOCÁVEIS</text><path d="M575 450h390" stroke="#6B7785" stroke-width="7"/><circle cx="730" cy="450" r="12" fill="#6B7785"/><text x="575" y="565" font-family="Arial" font-size="25" fill="#16345B">AESP / assistolia → RCP + causa reversível</text><rect x="130" y="710" width="790" height="200" rx="28" fill="#E7F3EF" stroke="#4F9B73" stroke-width="4"/><text x="525" y="785" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#4F9B73">ROSC: estabilizar oxigenação, perfusão e causa</text><text x="525" y="850" font-family="Arial" font-size="24" text-anchor="middle" fill="#16345B">qualidade das compressões e desfibrilação precoce mudam o prognóstico</text></g><rect y="1500" width="1200" height="100" fill="#16345B"/><text x="70" y="1560" font-family="Arial" font-size="23" fill="white">HEX-A034-331 · uso educacional</text></svg>