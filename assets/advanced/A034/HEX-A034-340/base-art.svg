<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Via aérea crítica</title><desc id="d">Algoritmo de falha de intubação e oxigenação com planos A, B, C e D.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="70" fill="#16345B"/><text x="70" y="47" font-family="Arial" font-size="27" font-weight="700" fill="white">HEXÁPODE · EMERGÊNCIAS AVANÇADAS</text><text x="70" y="155" font-family="Arial" font-size="43" font-weight="700" fill="#16345B">Via aérea crítica</text><text x="70" y="205" font-family="Arial" font-size="27" fill="#0F8C85">falha de intubação e oxigenação</text><g transform="translate(90 300)"><rect x="370" y="20" width="300" height="110" rx="28" fill="#EAF3FA" stroke="#2F6FAE" stroke-width="4"/><text x="520" y="88" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#16345B">OXIGENAR E PLANEJAR</text><path d="M520 130V210" stroke="#2F6FAE" stroke-width="10"/><polygon points="520,230 500,195 540,195" fill="#2F6FAE"/><rect x="40" y="250" width="220" height="180" rx="24" fill="#E7F3EF" stroke="#4F9B73" stroke-width="4"/><text x="150" y="320" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#4F9B73">PLANO A</text><text x="150" y="375" font-family="Arial" font-size="22" text-anchor="middle" fill="#16345B">intubação otimizada</text><rect x="290" y="250" width="220" height="180" rx="24" fill="#EAF3FA" stroke="#2F6FAE" stroke-width="4"/><text x="400" y="320" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#2F6FAE">PLANO B</text><text x="400" y="375" font-family="Arial" font-size="22" text-anchor="middle" fill="#16345B">dispositivo supraglótico</text><rect x="540" y="250" width="220" height="180" rx="24" fill="#FFF0D6" stroke="#E8A33A" stroke-width="4"/><text x="650" y="320" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#E8A33A">PLANO C</text><text x="650" y="375" font-family="Arial" font-size="22" text-anchor="middle" fill="#16345B">ventilação por máscara</text><rect x="790" y="250" width="220" height="180" rx="24" fill="#FDE1DD" stroke="#D9574F" stroke-width="4"/><text x="900" y="320" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#D9574F">PLANO D</text><text x="900" y="375" font-family="Arial" font-size="22" text-anchor="middle" fill="#16345B">acesso frontal ao pescoço</text><rect x="120" y="560" width="800" height="280" rx="28" fill="#FFFDF8" stroke="#CDD7E0" stroke-width="3"/><text x="520" y="630" font-family="Arial" font-size="31" font-weight="700" text-anchor="middle" fill="#D9574F">NÃO INTUBA, NÃO OXIGENA</text><text x="520" y="700" font-family="Arial" font-size="25" text-anchor="middle" fill="#16345B">declarar cedo · chamar ajuda · limitar tentativas</text><text x="520" y="760" font-family="Arial" font-size="25" text-anchor="middle" fill="#16345B">priorizar oxigenação sobre instrumentação repetida</text><text x="520" y="815" font-family="Arial" font-size="24" text-anchor="middle" fill="#0F8C85">cada tentativa deve alterar técnica, operador ou dispositivo</text></g><rect y="1500" width="1200" height="100" fill="#16345B"/><text x="70" y="1560" font-family="Arial" font-size="23" fill="white">HEX-A034-340 · uso educacional</text></svg>