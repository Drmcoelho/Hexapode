<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Hipercalemia grave</title><desc id="d">Progressão eletrocardiográfica e três eixos terapêuticos: estabilizar, deslocar e remover potássio.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="70" fill="#16345B"/><text x="70" y="47" font-family="Arial" font-size="27" font-weight="700" fill="white">HEXÁPODE · EMERGÊNCIAS AVANÇADAS</text><text x="70" y="155" font-family="Arial" font-size="43" font-weight="700" fill="#16345B">Hipercalemia grave</text><text x="70" y="205" font-family="Arial" font-size="27" fill="#0F8C85">membrana, ECG e estabilização</text><g transform="translate(70 300)"><rect x="30" y="40" width="1000" height="240" rx="28" fill="#FFFDF8" stroke="#CDD7E0" stroke-width="3"/><text x="70" y="100" font-family="Arial" font-size="30" font-weight="700" fill="#16345B">PROGRESSÃO ELETROCARDIOGRÁFICA</text><path d="M80 190h80l20-35 25 70 25-35h80l15-20 20 40 20-20h100l20-55 35 110 35-55h90l20-80 40 160 40-80h120" fill="none" stroke="#D9574F" stroke-width="6"/><text x="95" y="255" font-family="Arial" font-size="20" fill="#6B7785">T apiculada → PR prolongado → QRS largo → padrão sinusoidal</text><rect x="30" y="350" width="300" height="360" rx="28" fill="#EAF3FA" stroke="#2F6FAE" stroke-width="4"/><text x="180" y="415" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle" fill="#2F6FAE">1. ESTABILIZAR</text><text x="180" y="485" font-family="Arial" font-size="24" text-anchor="middle" fill="#16345B">cálcio</text><text x="180" y="535" font-family="Arial" font-size="22" text-anchor="middle" fill="#6B7785">protege a membrana</text><rect x="365" y="350" width="300" height="360" rx="28" fill="#E7F3EF" stroke="#4F9B73" stroke-width="4"/><text x="515" y="415" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle" fill="#4F9B73">2. DESLOCAR</text><text x="515" y="485" font-family="Arial" font-size="24" text-anchor="middle" fill="#16345B">insulina + glicose</text><text x="515" y="535" font-family="Arial" font-size="22" text-anchor="middle" fill="#6B7785">β₂-agonista · bicarbonato em contexto</text><rect x="700" y="350" width="300" height="360" rx="28" fill="#FFF0D6" stroke="#E8A33A" stroke-width="4"/><text x="850" y="415" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle" fill="#E8A33A">3. REMOVER</text><text x="850" y="485" font-family="Arial" font-size="24" text-anchor="middle" fill="#16345B">diurético · resina · diálise</text><text x="850" y="535" font-family="Arial" font-size="22" text-anchor="middle" fill="#6B7785">corrige o excesso corporal</text><rect x="190" y="820" width="650" height="170" rx="28" fill="#FDE1DD" stroke="#D9574F" stroke-width="4"/><text x="515" y="890" font-family="Arial" font-size="29" font-weight="700" text-anchor="middle" fill="#D9574F">ECG grave exige cálcio imediato</text><text x="515" y="945" font-family="Arial" font-size="23" text-anchor="middle" fill="#16345B">a redução sérica transitória não remove potássio do corpo</text></g><rect y="1500" width="1200" height="100" fill="#16345B"/><text x="70" y="1560" font-family="Arial" font-size="23" fill="white">HEX-A034-338 · uso educacional</text></svg>