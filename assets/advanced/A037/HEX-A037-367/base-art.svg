<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>AVC isquêmico: núcleo e penumbra</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="112" fill="#1D4E7A"/><text x="64" y="72" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEUROLOGIA AVANÇADA</text><text x="70" y="180" font-family="Georgia" font-size="48" fill="#2B2E34">AVC isquêmico: núcleo e penumbra</text><path d="M200 720C160 520 330 390 560 420C800 360 1030 520 980 770C950 950 750 1040 540 990C330 1040 230 900 200 720Z" fill="#F0C9BC" stroke="#B2473F" stroke-width="8"/><circle cx="650" cy="690" r="200" fill="#F2C94C" opacity=".55" stroke="#D39A2E" stroke-width="7"/><circle cx="650" cy="690" r="105" fill="#B2473F" opacity=".85"/><path d="M190 520Q390 520 570 650" fill="none" stroke="#1D4E7A" stroke-width="18"/><circle cx="500" cy="615" r="23" fill="#2B2E34"/><text x="705" y="660" font-family="Arial" font-size="32" font-weight="700" fill="#B2473F">Núcleo</text><text x="720" y="810" font-family="Arial" font-size="32" font-weight="700" fill="#D39A2E">Penumbra</text><path d="M170 1130H1030" stroke="#1696A3" stroke-width="12"/><polygon points="1030,1130 985,1105 985,1155" fill="#1696A3"/><text x="170" y="1080" font-family="Arial" font-size="29" fill="#1D4E7A">Oclusão → falha energética → morte celular</text><rect x="130" y="1220" width="940" height="200" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="170" y="1280" font-family="Arial" font-size="27" fill="#2B2E34">Reperfusão precoce pode salvar a penumbra, não o núcleo infartado.</text><text x="170" y="1340" font-family="Arial" font-size="27" fill="#2B2E34">Tempo, colaterais e carga trombótica determinam tecido viável.</text><text x="170" y="1390" font-family="Arial" font-size="28" font-weight="700" fill="#B2473F">Tempo é cérebro.</text><rect y="1510" width="1200" height="90" fill="#1D4E7A"/><text x="64" y="1568" font-family="Arial" font-size="25" fill="white">HEX-A037-367 · Fonte avançada</text></svg>