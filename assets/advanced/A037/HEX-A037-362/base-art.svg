<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Sinapse excitatória e inibitória</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="112" fill="#1D4E7A"/><text x="64" y="72" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEUROLOGIA AVANÇADA</text><text x="70" y="180" font-family="Georgia" font-size="48" fill="#2B2E34">Sinapse excitatória e inibitória</text><path d="M130 500Q350 350 540 500V720Q350 820 130 720Z" fill="#E8DDF2" stroke="#6F4AA8" stroke-width="8"/><path d="M660 500Q880 350 1070 500V720Q880 820 660 720Z" fill="#DDF0E9" stroke="#2E7D69" stroke-width="8"/><g fill="#D39A2E"><circle cx="300" cy="600" r="20"/><circle cx="370" cy="640" r="20"/><circle cx="440" cy="585" r="20"/></g><g fill="#1696A3"><circle cx="820" cy="600" r="20"/><circle cx="890" cy="640" r="20"/><circle cx="960" cy="585" r="20"/></g><text x="150" y="900" font-family="Arial" font-size="34" font-weight="700" fill="#B2473F">Excitatória: Na⁺/Ca²⁺ entram</text><text x="650" y="900" font-family="Arial" font-size="34" font-weight="700" fill="#2E7D69">Inibitória: Cl⁻ entra / K⁺ sai</text><rect x="110" y="1020" width="980" height="320" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="150" y="1090" font-family="Arial" font-size="28" fill="#2B2E34">Glutamato despolariza e aumenta a probabilidade de potencial de ação.</text><text x="150" y="1160" font-family="Arial" font-size="28" fill="#2B2E34">GABA hiperpolariza e reduz a probabilidade de disparo.</text><text x="150" y="1260" font-family="Arial" font-size="30" font-weight="700" fill="#1D4E7A">Função de rede = balanço entre excitação e inibição.</text><rect y="1510" width="1200" height="90" fill="#1D4E7A"/><text x="64" y="1568" font-family="Arial" font-size="25" fill="white">HEX-A037-362 · Fonte avançada</text></svg>