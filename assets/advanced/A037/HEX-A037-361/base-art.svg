<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Neurônio integrado e vias axonais</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="112" fill="#1D4E7A"/><text x="64" y="72" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEUROLOGIA AVANÇADA</text><text x="70" y="180" font-family="Georgia" font-size="48" fill="#2B2E34">Neurônio integrado e vias axonais</text><circle cx="390" cy="650" r="135" fill="#F1D4C9" stroke="#B2473F" stroke-width="8"/><g stroke="#1696A3" stroke-width="18" fill="none" stroke-linecap="round"><path d="M300 580Q180 470 100 430"/><path d="M290 660Q160 640 90 600"/><path d="M310 750Q190 850 120 930"/></g><path d="M525 690Q760 730 1080 840" fill="none" stroke="#D39A2E" stroke-width="24"/><g fill="#E6EEF5" stroke="#1D4E7A" stroke-width="5"><rect x="620" y="705" width="120" height="60" rx="30"/><rect x="780" y="755" width="120" height="60" rx="30"/><rect x="940" y="810" width="100" height="60" rx="30"/></g><polygon points="1090,842 1040,810 1045,875" fill="#B2473F"/><text x="100" y="1110" font-family="Arial" font-size="30" fill="#1D4E7A">Dendritos → soma → axônio → terminal</text><rect x="100" y="1190" width="1000" height="210" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="140" y="1260" font-family="Arial" font-size="28" fill="#2B2E34">Mielina acelera a condução; nós de Ranvier regeneram o impulso.</text><text x="140" y="1320" font-family="Arial" font-size="28" fill="#2B2E34">A direção funcional une entrada, processamento e saída sináptica.</text><rect y="1510" width="1200" height="90" fill="#1D4E7A"/><text x="64" y="1568" font-family="Arial" font-size="25" fill="white">HEX-A037-361 · Fonte avançada</text></svg>