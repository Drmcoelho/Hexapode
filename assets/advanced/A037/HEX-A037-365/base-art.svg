<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Cerebelo e coordenação motora</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="112" fill="#1D4E7A"/><text x="64" y="72" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEUROLOGIA AVANÇADA</text><text x="70" y="180" font-family="Georgia" font-size="48" fill="#2B2E34">Cerebelo e coordenação motora</text><path d="M240 560C280 410 490 390 600 500C710 390 920 410 960 560C1010 720 850 880 600 900C350 880 190 720 240 560Z" fill="#E6C2B4" stroke="#B2473F" stroke-width="8"/><g stroke="#B2473F" stroke-width="5" fill="none"><path d="M300 570Q600 430 900 570"/><path d="M270 650Q600 510 930 650"/><path d="M290 740Q600 610 910 740"/><path d="M350 820Q600 720 850 820"/></g><circle cx="600" cy="650" r="75" fill="#F4D8A8" stroke="#D39A2E" stroke-width="5"/><path d="M120 1050H420" stroke="#1696A3" stroke-width="12"/><polygon points="420,1050 380,1025 380,1075" fill="#1696A3"/><path d="M780 1050H1080" stroke="#2E7D69" stroke-width="12"/><polygon points="1080,1050 1040,1025 1040,1075" fill="#2E7D69"/><text x="120" y="1000" font-family="Arial" font-size="28" fill="#1D4E7A">Comando + propriocepção</text><text x="775" y="1000" font-family="Arial" font-size="28" fill="#1D4E7A">Correção motora</text><rect x="130" y="1170" width="940" height="250" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="170" y="1230" font-family="Arial" font-size="27" fill="#2B2E34">Compara movimento planejado com o executado.</text><text x="170" y="1280" font-family="Arial" font-size="27" fill="#2B2E34">Ajusta força, tempo, precisão e equilíbrio.</text><text x="170" y="1350" font-family="Arial" font-size="27" fill="#B2473F">Lesão: ataxia, dismetria, tremor de intenção e nistagmo.</text><rect y="1510" width="1200" height="90" fill="#1D4E7A"/><text x="64" y="1568" font-family="Arial" font-size="25" fill="white">HEX-A037-365 · Fonte avançada</text></svg>