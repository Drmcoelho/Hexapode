<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Auto-trigger</title><desc id="d">O ventilador inicia ciclos sem esforço verdadeiro do paciente por fuga, ruído ou oscilação do circuito.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="90" fill="#0F3F63"/><text x="70" y="58" font-family="Arial" font-size="30" font-weight="700" fill="white">HEXÁPODE · ASSINCRONIAS AVANÇADAS</text><text x="90" y="175" font-family="Georgia" font-size="60" fill="#2B2E34">Auto-trigger</text><text x="90" y="220" font-family="Arial" font-size="25" fill="#6A727A">Ciclo mecânico sem comando neural verdadeiro</text><line x1="90" y1="250" x2="1510" y2="250" stroke="#DCD2BE" stroke-width="3"/><rect x="90" y="310" width="900" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><line x1="150" y1="540" x2="920" y2="540" stroke="#8B949E" stroke-width="3"/><path d="M170 540 C220 540 235 470 285 470 C335 470 350 540 400 540 M450 540 C500 540 515 470 565 470 C615 470 630 540 680 540 M730 540 C780 540 795 470 845 470 C895 470 910 540 930 540" fill="none" stroke="#1D4E7A" stroke-width="10"/><line x1="150" y1="680" x2="920" y2="680" stroke="#7E57C2" stroke-width="5"/><text x="160" y="720" font-family="Arial" font-size="24" fill="#7E57C2">sem esforço muscular correspondente</text><circle cx="565" cy="470" r="22" fill="#D39A2E"/><text x="557" y="479" font-family="Arial" font-size="24" fill="white">!</text><rect x="1040" y="310" width="470" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="1080" y="375" font-family="Arial" font-size="28" font-weight="700" fill="#B2473F">CAUSAS</text><text x="1080" y="450" font-family="Arial" font-size="25" fill="#2B2E34">• fuga no circuito</text><text x="1080" y="500" font-family="Arial" font-size="25" fill="#2B2E34">• água no tubo</text><text x="1080" y="550" font-family="Arial" font-size="25" fill="#2B2E34">• trigger sensível</text><text x="1080" y="600" font-family="Arial" font-size="25" fill="#2B2E34">• oscilação cardíaca</text><rect x="90" y="835" width="1420" height="190" rx="24" fill="#E8E1D1"/><text x="130" y="905" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Correção</text><text x="130" y="965" font-family="Arial" font-size="25" fill="#2B2E34">Eliminar fugas e condensado; reajustar o limiar sem tornar o disparo excessivamente difícil.</text><text x="90" y="1140" font-family="Arial" font-size="21" fill="#6A727A">HEX-A029-284 · origem G009</text></svg>