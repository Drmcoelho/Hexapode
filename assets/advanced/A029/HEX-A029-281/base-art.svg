<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Disparo ineficaz</title><desc id="d">Esforço inspiratório do paciente que não cruza o limiar de trigger e não produz ciclo assistido.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="90" fill="#0F3F63"/><text x="70" y="58" font-family="Arial" font-size="30" font-weight="700" fill="white">HEXÁPODE · ASSINCRONIAS AVANÇADAS</text><text x="90" y="175" font-family="Georgia" font-size="60" fill="#2B2E34">Disparo ineficaz</text><text x="90" y="220" font-family="Arial" font-size="25" fill="#6A727A">O esforço do paciente não inicia um ciclo ventilatório</text><line x1="90" y1="250" x2="1510" y2="250" stroke="#DCD2BE" stroke-width="3"/><rect x="90" y="310" width="900" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><line x1="150" y1="520" x2="920" y2="520" stroke="#8B949E" stroke-width="3"/><path d="M160 520 C230 520 250 430 320 430 C390 430 410 520 480 520 M500 620 C540 590 580 590 620 620 M640 520 C710 520 730 440 800 440 C870 440 890 520 930 520" fill="none" stroke="#1D4E7A" stroke-width="10"/><line x1="620" y1="620" x2="620" y2="520" stroke="#D39A2E" stroke-width="5" stroke-dasharray="12 10"/><text x="500" y="685" font-family="Arial" font-size="24" fill="#D39A2E">esforço sem ciclo</text><rect x="1040" y="310" width="470" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="1080" y="375" font-family="Arial" font-size="28" font-weight="700" fill="#B2473F">PISTAS</text><text x="1080" y="450" font-family="Arial" font-size="25" fill="#2B2E34">• queda de pressão</text><text x="1080" y="500" font-family="Arial" font-size="25" fill="#2B2E34">• sem fluxo assistido</text><text x="1080" y="550" font-family="Arial" font-size="25" fill="#2B2E34">• auto-PEEP possível</text><rect x="90" y="835" width="1420" height="190" rx="24" fill="#E8E1D1"/><text x="130" y="905" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Correção dirigida</text><text x="130" y="965" font-family="Arial" font-size="25" fill="#2B2E34">Reduzir carga de trigger, tratar auto-PEEP e revisar sedação e fraqueza muscular.</text><text x="90" y="1140" font-family="Arial" font-size="21" fill="#6A727A">HEX-A029-281 · origem G009</text></svg>