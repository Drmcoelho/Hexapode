<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Correção das assincronias</title><desc id="d">Fluxo de raciocínio para reconhecer o padrão, identificar a causa e escolher intervenção dirigida.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="90" fill="#0F3F63"/><text x="70" y="58" font-family="Arial" font-size="30" font-weight="700" fill="white">HEXÁPODE · ASSINCRONIAS AVANÇADAS</text><text x="90" y="175" font-family="Georgia" font-size="60" fill="#2B2E34">Correção das assincronias</text><text x="90" y="220" font-family="Arial" font-size="25" fill="#6A727A">Diagnóstico por padrão, causa e intervenção dirigida</text><line x1="90" y1="250" x2="1510" y2="250" stroke="#DCD2BE" stroke-width="3"/><g font-family="Arial"><rect x="120" y="330" width="360" height="150" rx="24" fill="#E8E1D1" stroke="#1D4E7A" stroke-width="4"/><text x="300" y="390" text-anchor="middle" font-size="29" font-weight="700" fill="#1D4E7A">1. RECONHECER</text><text x="300" y="435" text-anchor="middle" font-size="23" fill="#2B2E34">curvas + esforço + exame</text><path d="M480 405 H610" stroke="#1696A3" stroke-width="12"/><polygon points="610,405 570,380 570,430" fill="#1696A3"/><rect x="620" y="330" width="360" height="150" rx="24" fill="#E8E1D1" stroke="#1D4E7A" stroke-width="4"/><text x="800" y="390" text-anchor="middle" font-size="29" font-weight="700" fill="#1D4E7A">2. DEFINIR CAUSA</text><text x="800" y="435" text-anchor="middle" font-size="23" fill="#2B2E34">paciente, circuito ou modo</text><path d="M980 405 H1110" stroke="#1696A3" stroke-width="12"/><polygon points="1110,405 1070,380 1070,430" fill="#1696A3"/><rect x="1120" y="330" width="360" height="150" rx="24" fill="#E8E1D1" stroke="#1D4E7A" stroke-width="4"/><text x="1300" y="390" text-anchor="middle" font-size="29" font-weight="700" fill="#1D4E7A">3. INTERVIR</text><text x="1300" y="435" text-anchor="middle" font-size="23" fill="#2B2E34">ajuste causal e reavaliação</text><rect x="120" y="560" width="430" height="300" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="155" y="620" font-size="27" font-weight="700" fill="#B2473F">PACIENTE</text><text x="155" y="680" font-size="24" fill="#2B2E34">• dor, ansiedade, febre</text><text x="155" y="730" font-size="24" fill="#2B2E34">• drive elevado ou deprimido</text><text x="155" y="780" font-size="24" fill="#2B2E34">• fraqueza e auto-PEEP</text><rect x="585" y="560" width="430" height="300" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="620" y="620" font-size="27" font-weight="700" fill="#B2473F">CIRCUITO</text><text x="620" y="680" font-size="24" fill="#2B2E34">• fuga e condensado</text><text x="620" y="730" font-size="24" fill="#2B2E34">• obstrução e secreção</text><text x="620" y="780" font-size="24" fill="#2B2E34">• interface e cuff</text><rect x="1050" y="560" width="430" height="300" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="1085" y="620" font-size="27" font-weight="700" fill="#B2473F">VENTILADOR</text><text x="1085" y="680" font-size="24" fill="#2B2E34">• trigger, fluxo e rise time</text><text x="1085" y="730" font-size="24" fill="#2B2E34">• ciclagem e Ti</text><text x="1085" y="780" font-size="24" fill="#2B2E34">• suporte e frequência</text></g><rect x="120" y="920" width="1360" height="110" rx="22" fill="#F3E2D8"/><text x="160" y="985" font-family="Arial" font-size="25" fill="#B2473F">Princípio: tratar o mecanismo clínico; sedação isolada pode apenas esconder a assincronia.</text><text x="90" y="1140" font-family="Arial" font-size="21" fill="#6A727A">HEX-A029-290 · origem G009</text></svg>