<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Fome de fluxo</title><desc id="d">O fluxo inspiratório fornecido é menor que a demanda do paciente, causando concavidade na curva de pressão e desconforto.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="90" fill="#0F3F63"/><text x="70" y="58" font-family="Arial" font-size="30" font-weight="700" fill="white">HEXÁPODE · ASSINCRONIAS AVANÇADAS</text><text x="90" y="175" font-family="Georgia" font-size="60" fill="#2B2E34">Fome de fluxo</text><text x="90" y="220" font-family="Arial" font-size="25" fill="#6A727A">Demanda inspiratória maior que a oferta do ventilador</text><line x1="90" y1="250" x2="1510" y2="250" stroke="#DCD2BE" stroke-width="3"/><rect x="90" y="310" width="900" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="130" y="365" font-family="Arial" font-size="26" fill="#1D4E7A">Fluxo: oferta × demanda</text><line x1="150" y1="650" x2="920" y2="650" stroke="#8B949E" stroke-width="3"/><path d="M170 650 C230 650 260 460 360 460 C460 460 500 650 570 650" fill="none" stroke="#D39A2E" stroke-width="10"/><path d="M170 650 C240 650 280 535 360 535 C440 535 470 650 570 650" fill="none" stroke="#1D4E7A" stroke-width="10" stroke-dasharray="16 10"/><text x="590" y="470" font-family="Arial" font-size="24" fill="#D39A2E">demanda</text><text x="590" y="545" font-family="Arial" font-size="24" fill="#1D4E7A">oferta</text><path d="M170 520 C230 520 250 430 320 430 C360 430 390 500 450 500 C510 500 530 520 590 520" fill="none" stroke="#B2473F" stroke-width="9"/><text x="610" y="510" font-family="Arial" font-size="24" fill="#B2473F">concavidade de pressão</text><rect x="1040" y="310" width="470" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="1080" y="375" font-family="Arial" font-size="28" font-weight="700" fill="#B2473F">PISTAS</text><text x="1080" y="450" font-family="Arial" font-size="25" fill="#2B2E34">• taquipneia</text><text x="1080" y="500" font-family="Arial" font-size="25" fill="#2B2E34">• pressão escavada</text><text x="1080" y="550" font-family="Arial" font-size="25" fill="#2B2E34">• esforço intenso</text><rect x="90" y="835" width="1420" height="190" rx="24" fill="#E8E1D1"/><text x="130" y="905" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Ajuste</text><text x="130" y="965" font-family="Arial" font-size="25" fill="#2B2E34">Aumentar fluxo ou ajustar rise time, modo e suporte conforme a mecânica e o esforço do paciente.</text><text x="90" y="1140" font-family="Arial" font-size="21" fill="#6A727A">HEX-A029-285 · origem G009</text></svg>