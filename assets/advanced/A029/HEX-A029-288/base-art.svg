<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Breath stacking</title><desc id="d">Dois ciclos se acumulam antes do esvaziamento completo, aumentando volume e pressão alveolar.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="90" fill="#0F3F63"/><text x="70" y="58" font-family="Arial" font-size="30" font-weight="700" fill="white">HEXÁPODE · ASSINCRONIAS AVANÇADAS</text><text x="90" y="175" font-family="Georgia" font-size="60" fill="#2B2E34">Breath stacking</text><text x="90" y="220" font-family="Arial" font-size="25" fill="#6A727A">Empilhamento de ciclos sem expiração completa</text><line x1="90" y1="250" x2="1510" y2="250" stroke="#DCD2BE" stroke-width="3"/><rect x="90" y="310" width="900" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><line x1="150" y1="620" x2="920" y2="620" stroke="#8B949E" stroke-width="3"/><path d="M170 620 C220 620 240 470 310 470 C370 470 390 620 430 620 C450 620 465 480 530 480 C600 480 620 620 690 620" fill="none" stroke="#1D4E7A" stroke-width="10"/><path d="M170 700 C240 700 250 580 320 580 C390 580 410 520 480 520 C550 520 570 700 650 700" fill="none" stroke="#B2473F" stroke-width="10"/><text x="690" y="690" font-family="Arial" font-size="24" fill="#B2473F">volume acumulado</text><rect x="1040" y="310" width="470" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="1080" y="375" font-family="Arial" font-size="28" font-weight="700" fill="#B2473F">RISCOS</text><text x="1080" y="450" font-family="Arial" font-size="25" fill="#2B2E34">• Vt excessivo</text><text x="1080" y="500" font-family="Arial" font-size="25" fill="#2B2E34">• pressão alveolar alta</text><text x="1080" y="550" font-family="Arial" font-size="25" fill="#2B2E34">• lesão pulmonar</text><rect x="90" y="835" width="1420" height="190" rx="24" fill="#E8E1D1"/><text x="130" y="905" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Abordagem</text><text x="130" y="965" font-family="Arial" font-size="25" fill="#2B2E34">Alinhar tempo inspiratório, drive respiratório e estratégia protetora; evitar apenas sedar a curva.</text><text x="90" y="1140" font-family="Arial" font-size="21" fill="#6A727A">HEX-A029-288 · origem G009</text></svg>