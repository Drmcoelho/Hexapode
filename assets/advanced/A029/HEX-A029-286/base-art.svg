<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Ciclagem precoce</title><desc id="d">O ventilador encerra a inspiração antes do fim do esforço neural, favorecendo nova demanda inspiratória e duplo disparo.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="90" fill="#0F3F63"/><text x="70" y="58" font-family="Arial" font-size="30" font-weight="700" fill="white">HEXÁPODE · ASSINCRONIAS AVANÇADAS</text><text x="90" y="175" font-family="Georgia" font-size="60" fill="#2B2E34">Ciclagem precoce</text><text x="90" y="220" font-family="Arial" font-size="25" fill="#6A727A">A inspiração mecânica termina antes da inspiração neural</text><line x1="90" y1="250" x2="1510" y2="250" stroke="#DCD2BE" stroke-width="3"/><rect x="90" y="310" width="900" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><line x1="150" y1="560" x2="920" y2="560" stroke="#8B949E" stroke-width="3"/><path d="M170 560 C220 560 240 430 310 430 C360 430 370 500 390 560 M390 560 C430 560 450 460 510 460 C570 460 590 560 650 560" fill="none" stroke="#1D4E7A" stroke-width="10"/><path d="M170 690 C250 600 430 600 520 690" fill="none" stroke="#D39A2E" stroke-width="9"/><line x1="390" y1="380" x2="390" y2="710" stroke="#B2473F" stroke-width="5" stroke-dasharray="12 10"/><text x="410" y="405" font-family="Arial" font-size="24" fill="#B2473F">ciclagem antes do fim do esforço</text><rect x="1040" y="310" width="470" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="1080" y="375" font-family="Arial" font-size="28" font-weight="700" fill="#B2473F">ASSOCIAÇÕES</text><text x="1080" y="450" font-family="Arial" font-size="25" fill="#2B2E34">• tempo inspiratório curto</text><text x="1080" y="500" font-family="Arial" font-size="25" fill="#2B2E34">• critério de fluxo alto</text><text x="1080" y="550" font-family="Arial" font-size="25" fill="#2B2E34">• mecânica restritiva</text><rect x="90" y="835" width="1420" height="190" rx="24" fill="#E8E1D1"/><text x="130" y="905" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Correção</text><text x="130" y="965" font-family="Arial" font-size="25" fill="#2B2E34">Prolongar Ti ou reduzir o percentual de fluxo de ciclagem, sempre conciliando conforto e proteção.</text><text x="90" y="1140" font-family="Arial" font-size="21" fill="#6A727A">HEX-A029-286 · origem G009</text></svg>