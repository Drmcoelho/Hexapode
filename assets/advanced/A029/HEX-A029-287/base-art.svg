<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Ciclagem tardia</title><desc id="d">O ventilador mantém a inspiração depois do fim do esforço neural, produzindo desconforto e esforço expiratório ativo.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="90" fill="#0F3F63"/><text x="70" y="58" font-family="Arial" font-size="30" font-weight="700" fill="white">HEXÁPODE · ASSINCRONIAS AVANÇADAS</text><text x="90" y="175" font-family="Georgia" font-size="60" fill="#2B2E34">Ciclagem tardia</text><text x="90" y="220" font-family="Arial" font-size="25" fill="#6A727A">A inspiração mecânica persiste após o fim da inspiração neural</text><line x1="90" y1="250" x2="1510" y2="250" stroke="#DCD2BE" stroke-width="3"/><rect x="90" y="310" width="900" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><line x1="150" y1="560" x2="920" y2="560" stroke="#8B949E" stroke-width="3"/><path d="M170 560 C220 560 240 430 310 430 C390 430 470 430 510 560 M510 560 C560 560 580 470 640 470" fill="none" stroke="#1D4E7A" stroke-width="10"/><path d="M170 690 C250 600 380 600 450 690" fill="none" stroke="#D39A2E" stroke-width="9"/><line x1="450" y1="380" x2="450" y2="710" stroke="#B2473F" stroke-width="5" stroke-dasharray="12 10"/><text x="470" y="405" font-family="Arial" font-size="24" fill="#B2473F">ventilador ainda inspira</text><rect x="1040" y="310" width="470" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="1080" y="375" font-family="Arial" font-size="28" font-weight="700" fill="#B2473F">ASSOCIAÇÕES</text><text x="1080" y="450" font-family="Arial" font-size="25" fill="#2B2E34">• Ti prolongado</text><text x="1080" y="500" font-family="Arial" font-size="25" fill="#2B2E34">• critério de fluxo baixo</text><text x="1080" y="550" font-family="Arial" font-size="25" fill="#2B2E34">• DPOC e vazamentos</text><rect x="90" y="835" width="1420" height="190" rx="24" fill="#E8E1D1"/><text x="130" y="905" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Correção</text><text x="130" y="965" font-family="Arial" font-size="25" fill="#2B2E34">Encurtar Ti ou elevar o percentual de fluxo de ciclagem; corrigir fugas e suporte excessivo.</text><text x="90" y="1140" font-family="Arial" font-size="21" fill="#6A727A">HEX-A029-287 · origem G009</text></svg>