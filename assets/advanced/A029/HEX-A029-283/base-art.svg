font-family="Arial" font-size="25" fill="#2B2E34">• esforço depois</text><text x="1080" y="550" font-family="Arial" font-size="25" fill="#2B2E34">• acoplamento repetitivo</text><rect x="90" y="835" width="1420" height="190" rx="24" fill="#E8E1D1"/><text x="130" y="905" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Interpretação</text><text x="130" y="965" font-family="Arial" font-size="25" fill="#2B2E34">Diferenciar de duplo disparo espontâneo exige observar a sequência temporal ventilador → esforço.</text><text x="90" y="1140" font-family="Arial" font-size="21" fill="#6A727A">HEX-A029-283 · origem G009</text></svg>