<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Duplo disparo</title><desc id="d">Um único esforço inspiratório dispara dois ciclos consecutivos, causando empilhamento de volume.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><rect width="1600" height="90" fill="#0F3F63"/><text x="70" y="58" font-family="Arial" font-size="30" font-weight="700" fill="white">HEXÁPODE · ASSINCRONIAS AVANÇADAS</text><text x="90" y="175" font-family="Georgia" font-size="60" fill="#2B2E34">Duplo disparo</text><text x="90" y="220" font-family="Arial" font-size="25" fill="#6A727A">Dois ciclos para um único esforço neural prolongado</text><line x1="90" y1="250" x2="1510" y2="250" stroke="#DCD2BE" stroke-width="3"/><rect x="90" y="310" width="900" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><line x1="150" y1="560" x2="920" y2="560" stroke="#8B949E" stroke-width="3"/><path d="M170 560 C220 560 230 420 300 420 C360 420 380 560 430 560 C450 560 460 430 520 430 C590 430 610 560 670 560" fill="none" stroke="#1D4E7A" stroke-width="11"/><path d="M200 680 C310 610 500 610 650 680" fill="none" stroke="#D39A2E" stroke-width="8"/><text x="240" y="730" font-family="Arial" font-size="24" fill="#D39A2E">esforço neural único e prolongado</text><rect x="1040" y="310" width="470" height="470" rx="26" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="4"/><text x="1080" y="375" font-family="Arial" font-size="28" font-weight="700" fill="#B2473F">CONSEQUÊNCIAS</text><text x="1080" y="450" font-family="Arial" font-size="25" fill="#2B2E34">• Vt somado</text><text x="1080" y="500" font-family="Arial" font-size="25" fill="#2B2E34">• hiperinsuflação</text><text x="1080" y="550" font-family="Arial" font-size="25" fill="#2B2E34">• risco de volutrauma</text><rect x="90" y="835" width="1420" height="190" rx="24" fill="#E8E1D1"/><text x="130" y="905" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">Mecanismo</text><text x="130" y="965" font-family="Arial" font-size="25" fill="#2B2E34">Tempo inspiratório mecânico menor que o tempo inspiratório neural do paciente.</text><text x="90" y="1140" font-family="Arial" font-size="21" fill="#6A727A">HEX-A029-282 · origem G009</text></svg>