<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Infecções respiratórias graves</title><desc id="d">Patógeno, resposta imune, exsudato alveolar, hipoxemia e sepse.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><text x="80" y="105" font-family="Georgia" font-size="56" fill="#1D4E7A">Infecções respiratórias graves</text><text x="80" y="155" font-family="Arial" font-size="25" fill="#6A727A">Resposta inflamatória intensa preenche alvéolos, produz shunt e pode evoluir para sepse</text><line x1="80" y1="190" x2="1520" y2="190" stroke="#DCD2BE" stroke-width="3"/><g transform="translate(90 270)" font-family="Arial"><g fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"><rect x="0" y="0" width="280" height="570" rx="22"/><rect x="360" y="0" width="280" height="570" rx="22"/><rect x="720" y="0" width="280" height="570" rx="22"/><rect x="1080" y="0" width="340" height="570" rx="22"/></g><text x="85" y="55" font-size="28" font-weight="700" fill="#2B2E34">PATÓGENO</text><g fill="#2E7D69"><circle cx="100" cy="240" r="35"/><circle cx="185" cy="310" r="45"/><circle cx="115" cy="380" r="28"/></g><text x="425" y="55" font-size="28" font-weight="700" fill="#2B2E34">IMUNIDADE</text><g fill="#6A5AA8"><circle cx="460" cy="230" r="45"/><circle cx="545" cy="310" r="50"/><circle cx="455" cy="390" r="38"/></g><text x="770" y="55" font-size="28" font-weight="700" fill="#2B2E34">ALVÉOLO</text><circle cx="860" cy="300" r="125" fill="#F3E2D8" stroke="#C45A3C" stroke-width="10"/><path d="M750 340 Q860 250 970 340 V420 H750Z" fill="#B2473F" opacity=".55"/><text x="1140" y="55" font-size="28" font-weight="700" fill="#B2473F">DESFECHOS</text><text x="1125" y="180" font-size="25" fill="#2B2E34">Consolidação</text><text x="1125" y="240" font-size="25" fill="#2B2E34">Shunt e hipoxemia</text><text x="1125" y="300" font-size="25" fill="#2B2E34">SDRA</text><text x="1125" y="360" font-size="25" fill="#2B2E34">Sepse / choque</text><g stroke