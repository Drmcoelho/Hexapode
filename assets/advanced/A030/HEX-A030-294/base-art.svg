<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">SDRA — fases e mecânica</title><desc id="d">Fases exsudativa, proliferativa e fibroproliferativa da síndrome do desconforto respiratório agudo.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><text x="80" y="105" font-family="Georgia" font-size="56" fill="#1D4E7A">SDRA — fases e mecânica</text><text x="80" y="155" font-family="Arial" font-size="25" fill="#6A727A">Lesão alveolar difusa com edema de permeabilidade, shunt e baixa complacência</text><line x1="80" y1="190" x2="1520" y2="190" stroke="#DCD2BE" stroke-width="3"/><g transform="translate(80 270)" font-family="Arial"><g transform="translate(0 0)"><rect width="450" height="630" rx="22" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="55" y="55" font-size="28" font-weight="700" fill="#B2473F">1 · EXSUDATIVA</text><circle cx="220" cy="265" r="120" fill="#E8F4F5" stroke="#1696A3" stroke-width="8"/><path d="M110 300 Q220 210 330 300 V360 H110Z" fill="#6AAED6" opacity=".72"/><path d="M100 165 Q220 115 340 165" fill="none" stroke="#B2473F" stroke-width="15"/><text x="55" y="480" font-size="24" fill="#2B2E34">Edema rico em proteínas</text><text x="55" y="525" font-size="24" fill="#2B2E34">Membranas hialinas</text><text x="55" y="570" font-size="24" fill="#2B2E34">Shunt intrapulmonar</text></g><g transform="translate(485 0)"><rect width="450" height="630" rx="22" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="55" y="55" font-size="28" font-weight="700" fill="#D39A2E">2 · PROLIFERATIVA</text><circle cx="220" cy="265" r="110" fill="#F3E2D8" stroke="#C45A3C" stroke-width="12"/><g fill="#2E7D69"><circle cx="150" cy="230" r="22"/><circle cx="250" cy="195" r="22"/><circle cx="290" cy="290" r="22"/><circle cx="180" cy="325" r="22"/></g><text x="55" y="480" font-size="24" fill="#2B2E34">Organização do exsudato</text><text x="55" y="525" font-size="24" fill="#2B2E34">Proliferação epitelial<