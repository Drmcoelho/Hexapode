<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">DPOC — fisiopatologia avançada</title><desc id="d">Inflamação crônica, enfisema, remodelamento brônquico e hipersecreção de muco.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><text x="80" y="105" font-family="Georgia" font-size="56" fill="#1D4E7A">DPOC — fisiopatologia avançada</text><text x="80" y="155" font-family="Arial" font-size="25" fill="#6A727A">Limitação persistente ao fluxo por doença de pequenas vias aéreas e destruição parenquimatosa</text><line x1="80" y1="190" x2="1520" y2="190" stroke="#DCD2BE" stroke-width="3"/><g transform="translate(90 250)"><rect width="620" height="660" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="35" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#2B2E34">VIAS AÉREAS</text><circle cx="220" cy="290" r="120" fill="#F3E2D8" stroke="#B2473F" stroke-width="8"/><circle cx="220" cy="290" r="45" fill="#F7F4EC" stroke="#D39A2E" stroke-width="18"/><path d="M140 200 Q220 150 300 200" fill="none" stroke="#B2473F" stroke-width="18"/><text x="370" y="230" font-family="Arial" font-size="25" fill="#2B2E34">Inflamação crônica</text><text x="370" y="285" font-family="Arial" font-size="25" fill="#2B2E34">Remodelamento</text><text x="370" y="340" font-family="Arial" font-size="25" fill="#2B2E34">Muco intraluminal</text><text x="45" y="540" font-family="Arial" font-size="26" fill="#1D4E7A">↑ resistência expiratória → aprisionamento aéreo</text></g><g transform="translate(790 250)"><rect width="720" height="660" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="35" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#2B2E34">PARÊNQUIMA</text><g fill="none" stroke="#1696A3" stroke-width="6"><circle cx="180" cy="260" r="70"/><circle cx="300" cy="220" r="75"/><circle cx="300" cy="350" r="80"/><circle cx="430" cy="275" r="105"/></g><path d="M115 500 H600" stroke="#1696A3" stroke-width="12"/><polygon points="600,500 560,475 560,525" fill="#1696A3"/><text x="90" y="570" font-family="Arial" font-size="25" fill="#2B2E34">Destruição septal → ↓ recolhimento elástico</text><text x="90" y="615" font-family="Arial" font-size="25" fill="#2B2E34">Hiperinsuflação dinâmica e aumento do trabalho respiratório</text></g><text x="80" y="1115" font-family="Arial" font-size="20" fill="#6A727A">HEX-A030-291 · Hexápode · Patologias Respiratórias Avançadas</text></svg>