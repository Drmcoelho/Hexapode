<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Asma — fisiopatologia avançada</title><desc id="d">Broncoconstrição, edema, muco e inflamação eosinofílica com obstrução variável.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><text x="80" y="105" font-family="Georgia" font-size="56" fill="#1D4E7A">Asma — fisiopatologia avançada</text><text x="80" y="155" font-family="Arial" font-size="25" fill="#6A727A">Hiperresponsividade brônquica com limitação variável e reversível ao fluxo</text><line x1="80" y1="190" x2="1520" y2="190" stroke="#DCD2BE" stroke-width="3"/><g transform="translate(100 260)"><rect width="1400" height="640" rx="24" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><g transform="translate(80 80)"><text x="100" y="0" font-family="Arial" font-size="28" font-weight="700" fill="#2B2E34">NORMAL</text><circle cx="180" cy="220" r="120" fill="#F3E2D8" stroke="#C45A3C" stroke-width="18"/><circle cx="180" cy="220" r="78" fill="#FFFDF8" stroke="#1696A3" stroke-width="8"/></g><g transform="translate(470 80)"><text x="70" y="0" font-family="Arial" font-size="28" font-weight="700" fill="#B2473F">CRISE</text><circle cx="180" cy="220" r="120" fill="#E9B7A8" stroke="#B2473F" stroke-width="34"/><circle cx="180" cy="220" r="35" fill="#F0B14B" stroke="#D39A2E" stroke-width="12"/><g fill="#6A5AA8"><circle cx="95" cy="145" r="14"/><circle cx="250" cy="150" r="14"/><circle cx="100" cy="300" r="14"/><circle cx="255" cy="290" r="14"/></g></g><g transform="translate(900 70)"><rect width="410" height="460" rx="20" fill="#F7F4EC" stroke="#DCD2BE" stroke-width="3"/><text x="25" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#1D4E7A">CADEIA</text><text x="30" y="125" font-family="Arial" font-size="24" fill="#2B2E34">Alérgeno / vírus / irritante</text><text x="170" y="175" font-family="Arial" font-size="34" fill="#1696A3">↓</text><text x="30" y="225" font-family="Arial" font-size="24" fill="#2B2E34">Inflamação tipo 2</text><text x="170" y="275" font-family="Arial" font-size="34" fill="#1696A3">↓</text><text x="30" y="325" font-family="Arial" font-size="24" fill="#2B2E34">Broncoconstrição + edema + muco</text><text x="170" y="375" font-family="Arial" font-size="34" fill="#1696A3">↓</text><text x="30" y="425" font-family="Arial" font-size="24" fill="#B2473F">Fluxo expiratório reduzido</text></g></g><text x="80" y="1115" font-family="Arial" font-size="20" fill="#6A727A">HEX-A030-292 · Hexápode · Patologias Respiratórias Avançadas</text></svg>