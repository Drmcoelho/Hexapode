<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Hipertensão pulmonar</title><desc id="d">Remodelamento vascular pulmonar e falência progressiva do ventrículo direito.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><text x="80" y="105" font-family="Georgia" font-size="56" fill="#1D4E7A">Hipertensão pulmonar</text><text x="80" y="155" font-family="Arial" font-size="25" fill="#6A727A">Remodelamento vascular aumenta a resistência e transfere carga ao ventrículo direito</text><line x1="80" y1="190" x2="1520" y2="190" stroke="#DCD2BE" stroke-width="3"/><g transform="translate(100 270)" font-family="Arial"><g><rect width="620" height="600" rx="22" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="215" y="55" font-size="28" font-weight="700" fill="#2B2E34">ARTÉRIA NORMAL</text><circle cx="310" cy="280" r="150" fill="#F3E2D8" stroke="#C45A3C" stroke-width="28"/><circle cx="310" cy="280" r="100" fill="#FFFDF8"/></g><g transform="translate(700 0)"><rect width="700" height="600" rx="22" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="190" y="55" font-size="28" font-weight="700" fill="#B2473F">ARTÉRIA REMODELADA</text><circle cx="300" cy="280" r="150" fill="#E9B7A8" stroke="#B2473F" stroke-width="55"/><circle cx="300" cy="280" r="55" fill="#FFFDF8"/><text x="480" y="190" font-size="24" fill="#2B2E34">Hipertrofia da média</text><text x="480" y="240" font-size="24" fill="#2B2E34">Proliferação intimal</text><text x="480" y="290" font-size="24" fill="#2B2E34">Vasoconstrição</text><text x="480" y="340" font-size="24" fill="#2B2E34">Trombose in situ</text></g></g><text x="105" y="960" font-family="Arial" font-size="27" fill="#2B2E34">↑ resistência vascular pulmonar → hipertrofia/dilatação do VD → insuficiência direita e baixo débito</text><text x="80" y="1115" font-family="Arial" font-size="20" fill="#6A727A">HEX-A030-299 · Hexápode · Patologias Respiratórias Avançadas</text></svg>