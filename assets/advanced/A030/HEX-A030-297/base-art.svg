<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d"><title id="t">Derrame pleural — fisiopatologia</title><desc id="d">Comparação entre transudato e exsudato e seus efeitos sobre ventilação.</desc><rect width="1600" height="1200" fill="#F7F4EC"/><text x="80" y="105" font-family="Georgia" font-size="56" fill="#1D4E7A">Derrame pleural — fisiopatologia</text><text x="80" y="155" font-family="Arial" font-size="25" fill="#6A727A">Líquido no espaço pleural comprime o pulmão e altera a relação ventilação/perfusão</text><line x1="80" y1="190" x2="1520" y2="190" stroke="#DCD2BE" stroke-width="3"/><g transform="translate(100 270)" font-family="Arial"><g><rect width="650" height="620" rx="22" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="210" y="55" font-size="30" font-weight="700" fill="#1D4E7A">TRANSUDATO</text><path d="M130 150 Q320 70 510 150 V480 Q320 570 130 480Z" fill="#F3E2D8" stroke="#1D4E7A" stroke-width="8"/><path d="M145 390 Q320 330 495 390 V500 Q320 560 145 500Z" fill="#6AAED6" opacity=".72"/><text x="90" y="585" font-size="24" fill="#2B2E34">↑ pressão hidrostática ou ↓ pressão oncótica</text></g><g transform="translate(750 0)"><rect width="650" height="620" rx="22" fill="#FFFDF8" stroke="#DCD2BE" stroke-width="3"/><text x="225" y="55" font-size="30" font-weight="700" fill="#B2473F">EXSUDATO</text><path d="M130 150 Q320 70 510 150 V480 Q320 570 130 480Z" fill="#F3E2D8" stroke="#1D4E7A" stroke-width="8"/><path d="M145 360 Q320 300 495 360 V500 Q320 560 145 500Z" fill="#C45A3C" opacity=".55"/><g fill="#6A5AA8"><circle cx="220" cy="420" r="15"/><circle cx="300" cy="390" r="15"/><circle cx="380" cy="430" r="15"/></g><text x="90" y="585" font-size="24" fill="#2B2E34">Inflamação → ↑ permeabilidade e proteínas</text></g></g><text x="80" y="970" font-family="Arial" font-size="27" fill="#2B2E34">Efeito comum: compressão pulmonar → padrão restritivo, dispneia e hipoxemia</text><text x="80" y="1115" font-family="Arial" font-size="20" fill="#6A727A">HEX-A030-297 · Hexápode · Patologias Respiratórias Avançadas</text></svg>