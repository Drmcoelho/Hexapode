<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Néfron integrado e autorregulação</title><desc id="d">Feedback tubuloglomerular e resposta miogênica.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect x="40" y="35" width="1120" height="95" rx="22" fill="#083B66"/><text x="70" y="95" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEFROLOGIA AVANÇADA</text><text x="60" y="210" font-family="Arial" font-size="51" font-weight="700" fill="#102A56">Néfron integrado e autorregulação</text><text x="60" y="258" font-family="Arial" font-size="27" fill="#40536A">Feedback tubuloglomerular e resposta miogênica</text><ellipse cx="340" cy="520" rx="160" ry="130" fill="#F4C8BC" stroke="#B44A3C" stroke-width="8"/><path d="M235 525 C285 405 420 410 465 525 C420 640 285 640 235 525Z" fill="#D84F45"/><path d="M500 500 C650 420 730 520 650 620 C590 700 760 760 820 640 C875 530 970 640 845 820" fill="none" stroke="#E3A11A" stroke-width="28" stroke-linecap="round"/><circle cx="605" cy="520" r="26" fill="#6C63B8"/><text x="605" y="575" text-anchor="middle" font-family="Arial" font-size="23" fill="#23384E">mácula densa</text><rect x="70" y="980" width="500" height="330" rx="24" fill="white" stroke="#9EB3C7" stroke-width="3"/><text x="95" y="1030" font-family="Arial" font-size="29" font-weight="700" fill="#0E8F86">Resposta miogênica</text><text x="95" y="1090" font-family="Arial" font-size="24" fill="#23384E">• pressão aferente alta → vasoconstrição</text><text x="95" y="1140" font-family="Arial" font-size="24" fill="#23384E">• pressão baixa → vasodilatação</text><text x="95" y="1190" font-family="Arial" font-size="24" fill="#23384E">• estabiliza fluxo e TFG</text><rect x="630" y="980" width="500" height="330" rx="24" fill="white" stroke="#9EB3C7" stroke-width="3"/><text x="655" y="1030" font-family="Arial" font-size="29" font-weight="700" fill="#6C63B8">Feedback tubuloglomerular</text><text x="655" y="1090" font-family="Arial" font-size="24" fill="#23384E">• NaCl alto na mácula densa</text><text x="655" y="1140" font-family="Arial" font-size="24" fill="#23384E">• adenosina contrai aferente</text><text x="655" y="1190" font-family="Arial" font-size="24" fill="#23384E">• renina cai; TFG é contida</text><rect x="40" y="1490" width="1120" height="76" rx="18" fill="#083B66"/><text x="65" y="1538" font-family="Arial" font-size="23" fill="white">Aparelho justaglomerular conecta fluxo tubular e tônus vascular</text></svg>