<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Diálise peritoneal</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect x="40" y="35" width="1120" height="95" rx="22" fill="#083B66"/><text x="70" y="95" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEFROLOGIA AVANÇADA</text><text x="60" y="210" font-family="Arial" font-size="52" font-weight="700" fill="#102A56">Diálise peritoneal</text><text x="60" y="258" font-family="Arial" font-size="27" fill="#40536A">Troca através do peritônio e ciclos de permanência</text><path d="M430 390 C500 340 700 340 770 390 L830 850 C760 950 440 950 370 850 Z" fill="#F6D8C9" stroke="#B78368" stroke-width="6"/><path d="M490 430 C530 400 670 400 710 430 L750 820 C690 880 510 880 450 820 Z" fill="#CFE8F0" stroke="#1E73B7" stroke-width="5"/><path d="M600 280 L600 680" stroke="#0E8F86" stroke-width="24" stroke-linecap="round"/><circle cx="600" cy="250" r="60" fill="white" stroke="#0E8F86" stroke-width="6"/><text x="600" y="258" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0E8F86">BOLSA</text><rect x="60" y="1030" width="330" height="290" rx="24" fill="white" stroke="#1E73B7" stroke-width="4"/><rect x="435" y="1030" width="330" height="290" rx="24" fill="white" stroke="#6C63B8" stroke-width="4"/><rect x="810" y="1030" width="330" height="290" rx="24" fill="white" stroke="#0E8F86" stroke-width="4"/><text x="225" y="1090" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1E73B7">1 · Infusão</text><text x="600" y="1090" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#6C63B8">2 · Permanência</text><text x="975" y="1090" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#0E8F86">3 · Drenagem</text><text x="90" y="1150" font-family="Arial" font-size="23" fill="#23384E">• por gravidade</text><text x="90" y="1200" font-family="Arial" font-size="23" fill="#23384E">• técnica asséptica</text><text x="465" y="1150" font-family="Arial" font-size="23" fill="#23384E">• difusão de solutos</text><text x="465" y="1200" font-family="Arial" font-size="23" fill="#23384E">• glicose puxa água</text><text x="840" y="1150" font-family="Arial" font-size="23" fill="#23384E">• medir volume</text><text x="840" y="1200" font-family="Arial" font-size="23" fill="#23384E">• turbidez = alerta</text><rect x="40" y="1490" width="1120" height="76" rx="18" fill="#083B66"/><text x="65" y="1538" font-family="Arial" font-size="23" fill="white">O peritônio atua como membrana semipermeável em ciclos repetidos</text></svg>