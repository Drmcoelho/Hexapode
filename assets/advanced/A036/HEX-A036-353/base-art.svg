<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Lesão renal aguda</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect x="40" y="35" width="1120" height="95" rx="22" fill="#083B66"/><text x="70" y="95" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEFROLOGIA AVANÇADA</text><text x="60" y="210" font-family="Arial" font-size="52" font-weight="700" fill="#102A56">Lesão renal aguda</text><text x="60" y="258" font-family="Arial" font-size="27" fill="#40536A">KDIGO e raciocínio pré-renal, intrínseco e pós-renal</text><rect x="390" y="340" width="420" height="110" rx="28" fill="#B44A3C"/><text x="600" y="410" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="white">LESÃO RENAL AGUDA</text><rect x="70" y="560" width="320" height="300" rx="24" fill="#EAF3FA" stroke="#1E73B7" stroke-width="4"/><rect x="440" y="560" width="320" height="300" rx="24" fill="#FCE9E5" stroke="#B44A3C" stroke-width="4"/><rect x="810" y="560" width="320" height="300" rx="24" fill="#EEF6E8" stroke="#5F8F3A" stroke-width="4"/><text x="230" y="620" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E73B7">PRÉ-RENAL</text><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#B44A3C">INTRÍNSECA</text><text x="970" y="620" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#5F8F3A">PÓS-RENAL</text><text x="105" y="690" font-family="Arial" font-size="24" fill="#23384E">• hipovolemia</text><text x="105" y="745" font-family="Arial" font-size="24" fill="#23384E">• baixo débito</text><text x="105" y="800" font-family="Arial" font-size="24" fill="#23384E">• vasodilatação</text><text x="475" y="690" font-family="Arial" font-size="24" fill="#23384E">• necrose tubular</text><text x="475" y="745" font-family="Arial" font-size="24" fill="#23384E">• glomerulonefrite</text><text x="475" y="800" font-family="Arial" font-size="24" fill="#23384E">• nefrite intersticial</text><text x="845" y="690" font-family="Arial" font-size="24" fill="#23384E">• cálculo</text><text x="845" y="745" font-family="Arial" font-size="24" fill="#23384E">• próstata</text><text x="845" y="800" font-family="Arial" font-size="24" fill="#23384E">• compressão</text><rect x="70" y="970" width="1060" height="340" rx="24" fill="white" stroke="#9EB3C7" stroke-width="3"/><text x="95" y="1030" font-family="Arial" font-size="30" font-weight="700" fill="#0E8F86">KDIGO — qualquer critério</text><text x="95" y="1095" font-family="Arial" font-size="24" fill="#23384E">• creatinina ↑ ≥ 0,3 mg/dL em 48 h</text><text x="95" y="1150" font-family="Arial" font-size="24" fill="#23384E">• creatinina ≥ 1,5 × basal em 7 dias</text><text x="95" y="1205" font-family="Arial" font-size="24" fill="#23384E">• diurese &lt; 0,5 mL/kg/h por 6 h</text><text x="95" y="1260" font-family="Arial" font-size="24" fill="#23384E">• estabilizar perfusão e excluir obstrução primeiro</text><rect x="40" y="1490" width="1120" height="76" rx="18" fill="#083B66"/><text x="65" y="1538" font-family="Arial" font-size="23" fill="white">Estadiar gravidade sem abandonar a busca de reversibilidade</text></svg>