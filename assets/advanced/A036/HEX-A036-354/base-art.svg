<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Hipercalemia</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect x="40" y="35" width="1120" height="95" rx="22" fill="#083B66"/><text x="70" y="95" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEFROLOGIA AVANÇADA</text><text x="60" y="210" font-family="Arial" font-size="52" font-weight="700" fill="#102A56">Hipercalemia</text><text x="60" y="258" font-family="Arial" font-size="27" fill="#40536A">Membrana, ECG e sequência terapêutica</text><circle cx="250" cy="510" r="150" fill="#EFE9FA" stroke="#6C63B8" stroke-width="6"/><text x="250" y="525" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#6C63B8">K⁺ ↑</text><path d="M470 560 L540 560 L570 490 L600 625 L635 520 L670 560 L750 560 L785 420 L820 700 L855 510 L900 560 L1090 560" fill="none" stroke="#B44A3C" stroke-width="10"/><text x="780" y="750" text-anchor="middle" font-family="Arial" font-size="26" fill="#B44A3C">T apiculada → PR longo → QRS largo → sine wave</text><rect x="60" y="900" width="330" height="360" rx="24" fill="white" stroke="#B44A3C" stroke-width="4"/><rect x="435" y="900" width="330" height="360" rx="24" fill="white" stroke="#E3A11A" stroke-width="4"/><rect x="810" y="900" width="330" height="360" rx="24" fill="white" stroke="#0E8F86" stroke-width="4"/><text x="225" y="960" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#B44A3C">1 · Estabilizar</text><text x="600" y="960" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#E3A11A">2 · Redistribuir</text><text x="975" y="960" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#0E8F86">3 · Remover</text><text x="90" y="1030" font-family="Arial" font-size="24" fill="#23384E">• cálcio IV</text><text x="90" y="1080" font-family="Arial" font-size="24" fill="#23384E">• efeito em minutos</text><text x="90" y="1130" font-family="Arial" font-size="24" fill="#23384E">• não reduz K⁺</text><text x="465" y="1030" font-family="Arial" font-size="24" fill="#23384E">• insulina + glicose</text><text x="465" y="1080" font-family="Arial" font-size="24" fill="#23384E">• beta-2 agonista</text><text x="465" y="1130" font-family="Arial" font-size="24" fill="#23384E">• bicarbonato se acidose</text><text x="840" y="1030" font-family="Arial" font-size="24" fill="#23384E">• diurético</text><text x="840" y="1080" font-family="Arial" font-size="24" fill="#23384E">• resina selecionada</text><text x="840" y="1130" font-family="Arial" font-size="24" fill="#23384E">• diálise se grave</text><rect x="40" y="1490" width="1120" height="76" rx="18" fill="#083B66"/><text x="65" y="1538" font-family="Arial" font-size="23" fill="white">Separar proteção cardíaca, redistribuição e remoção corporal</text></svg>