<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Distúrbios do sódio</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect x="40" y="35" width="1120" height="95" rx="22" fill="#083B66"/><text x="70" y="95" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEFROLOGIA AVANÇADA</text><text x="60" y="210" font-family="Arial" font-size="52" font-weight="700" fill="#102A56">Distúrbios do sódio</text><text x="60" y="258" font-family="Arial" font-size="27" fill="#40536A">Hiponatremia, hipernatremia e movimento de água cerebral</text><rect x="70" y="350" width="500" height="650" rx="28" fill="#EAF3FA" stroke="#1E73B7" stroke-width="5"/><rect x="630" y="350" width="500" height="650" rx="28" fill="#FFF1E5" stroke="#E07B2D" stroke-width="5"/><text x="320" y="420" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E73B7">HIPONATREMIA</text><text x="880" y="420" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#E07B2D">HIPERNATREMIA</text><circle cx="320" cy="630" r="150" fill="#BFD8ED" stroke="#1E73B7" stroke-width="6"/><circle cx="880" cy="630" r="95" fill="#F6C69B" stroke="#E07B2D" stroke-width="6"/><text x="320" y="850" text-anchor="middle" font-family="Arial" font-size="25" fill="#23384E">água entra → edema cerebral</text><text x="880" y="850" text-anchor="middle" font-family="Arial" font-size="25" fill="#23384E">água sai → retração cerebral</text><text x="320" y="905" text-anchor="middle" font-family="Arial" font-size="23" fill="#40536A">convulsão e herniação</text><text x="880" y="905" text-anchor="middle" font-family="Arial" font-size="23" fill="#40536A">hemorragia e disfunção</text><rect x="70" y="1060" width="1060" height="250" rx="24" fill="white" stroke="#9EB3C7" stroke-width="3"/><text x="95" y="1115" font-family="Arial" font-size="30" font-weight="700" fill="#0E8F86">Correção segura</text><text x="95" y="1175" font-family="Arial" font-size="24" fill="#23384E">• definir agudo versus crônico e acompanhar diurese</text><text x="95" y="1230" font-family="Arial" font-size="24" fill="#23384E">• evitar correção excessiva: desmielinização ou edema</text><rect x="40" y="1490" width="1120" height="76" rx="18" fill="#083B66"/><text x="65" y="1538" font-family="Arial" font-size="23" fill="white">A velocidade de correção importa tanto quanto o valor do sódio</text></svg>