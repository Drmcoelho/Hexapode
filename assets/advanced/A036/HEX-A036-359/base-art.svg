<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Anticoagulação na terapia renal substitutiva</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect x="40" y="35" width="1120" height="95" rx="22" fill="#083B66"/><text x="70" y="95" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEFROLOGIA AVANÇADA</text><text x="60" y="210" font-family="Arial" font-size="44" font-weight="700" fill="#102A56">Anticoagulação na terapia renal substitutiva</text><text x="60" y="258" font-family="Arial" font-size="27" fill="#40536A">Heparina versus citrato regional</text><rect x="70" y="350" width="490" height="650" rx="28" fill="#FCE9E5" stroke="#B44A3C" stroke-width="5"/><rect x="640" y="350" width="490" height="650" rx="28" fill="#EAF6F3" stroke="#0E8F86" stroke-width="5"/><text x="315" y="420" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#B44A3C">HEPARINA</text><text x="885" y="420" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0E8F86">CITRATO REGIONAL</text><circle cx="315" cy="600" r="70" fill="white" stroke="#B44A3C" stroke-width="5"/><text x="315" y="610" text-anchor="middle" font-family="Arial" font-size="28" fill="#B44A3C">aPTT</text><circle cx="885" cy="600" r="70" fill="white" stroke="#0E8F86" stroke-width="5"/><text x="885" y="610" text-anchor="middle" font-family="Arial" font-size="28" fill="#0E8F86">Ca²⁺</text><text x="115" y="760" font-family="Arial" font-size="24" fill="#23384E">• anticoagulação sistêmica</text><text x="115" y="815" font-family="Arial" font-size="24" fill="#23384E">• simples e disponível</text><text x="115" y="870" font-family="Arial" font-size="24" fill="#23384E">• sangramento / HIT</text><text x="685" y="760" font-family="Arial" font-size="24" fill="#23384E">• anticoagulação do circuito</text><text x="685" y="815" font-family="Arial" font-size="24" fill="#23384E">• menor sangramento sistêmico</text><text x="685" y="870" font-family="Arial" font-size="24" fill="#23384E">• vigiar Ca, pH e Na</text><rect x="90" y="1080" width="1020" height="240" rx="24" fill="white" stroke="#9EB3C7" stroke-width="3"/><text x="115" y="1135" font-family="Arial" font-size="30" font-weight="700" fill="#102A56">Escolha prática</text><text x="115" y="1195" font-family="Arial" font-size="23" fill="#23384E">• alto risco hemorrágico favorece citrato quando disponível</text><text x="115" y="1245" font-family="Arial" font-size="23" fill="#23384E">• insuficiência hepática grave exige cautela e monitorização</text><rect x="40" y="1490" width="1120" height="76" rx="18" fill="#083B66"/><text x="65" y="1538" font-family="Arial" font-size="23" fill="white">Equilibrar patência do circuito e risco hemorrágico</text></svg>