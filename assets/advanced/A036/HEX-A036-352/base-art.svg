<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Taxa de filtração glomerular</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect x="40" y="35" width="1120" height="95" rx="22" fill="#083B66"/><text x="70" y="95" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEFROLOGIA AVANÇADA</text><text x="60" y="210" font-family="Arial" font-size="52" font-weight="700" fill="#102A56">Taxa de filtração glomerular</text><text x="60" y="258" font-family="Arial" font-size="27" fill="#40536A">Forças de Starling e coeficiente de filtração</text><circle cx="350" cy="570" r="200" fill="#FBE1D8" stroke="#B44A3C" stroke-width="8"/><path d="M220 570 C260 400 455 400 500 570 C455 735 260 735 220 570Z" fill="#D84F45"/><circle cx="350" cy="570" r="90" fill="#F7F4EC" stroke="#102A56" stroke-width="6"/><path d="M90 520 L175 540" stroke="#B44A3C" stroke-width="16"/><path d="M520 540 L630 520" stroke="#B44A3C" stroke-width="16"/><path d="M350 670 L350 840" stroke="#1E73B7" stroke-width="16"/><rect x="650" y="380" width="470" height="420" rx="24" fill="white" stroke="#9EB3C7" stroke-width="3"/><text x="885" y="450" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#102A56">TFG = Kf × PUF</text><text x="885" y="535" text-anchor="middle" font-family="Arial" font-size="28" fill="#102A56">PUF = PGC − PBS − πGC</text><text x="885" y="620" text-anchor="middle" font-family="Arial" font-size="24" fill="#40536A">Kf = área × permeabilidade</text><text x="885" y="690" text-anchor="middle" font-family="Arial" font-size="24" fill="#40536A">↓ Kf: lesão glomerular</text><rect x="70" y="980" width="1060" height="310" rx="24" fill="white" stroke="#9EB3C7" stroke-width="3"/><text x="95" y="1035" font-family="Arial" font-size="30" font-weight="700" fill="#0E8F86">Barreira e determinantes</text><text x="95" y="1100" font-family="Arial" font-size="24" fill="#23384E">• endotélio fenestrado → membrana basal → fendas dos podócitos</text><text x="95" y="1155" font-family="Arial" font-size="24" fill="#23384E">• tônus aferente/eferente altera pressão capilar</text><text x="95" y="1210" font-family="Arial" font-size="24" fill="#23384E">• proteínas plasmáticas aumentam pressão oncótica</text><rect x="40" y="1490" width="1120" height="76" rx="18" fill="#083B66"/><text x="65" y="1538" font-family="Arial" font-size="23" fill="white">TFG resulta de permeabilidade, área e pressão líquida de ultrafiltração</text></svg>