<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Acidose metabólica renal</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect x="40" y="35" width="1120" height="95" rx="22" fill="#083B66"/><text x="70" y="95" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · NEFROLOGIA AVANÇADA</text><text x="60" y="210" font-family="Arial" font-size="52" font-weight="700" fill="#102A56">Acidose metabólica renal</text><text x="60" y="258" font-family="Arial" font-size="27" fill="#40536A">Retenção de ácidos, perda de bicarbonato e compensação</text><circle cx="600" cy="580" r="165" fill="white" stroke="#102A56" stroke-width="6"/><text x="600" y="565" text-anchor="middle" font-family="Arial" font-size="40" font-weight="700" fill="#102A56">HCO₃⁻ ↓</text><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="34" fill="#B44A3C">H⁺ ↑</text><text x="230" y="400" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#B44A3C">ÁCIDOS RETIDOS</text><text x="970" y="400" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E73B7">BASE REGENERADA</text><rect x="70" y="900" width="500" height="350" rx="24" fill="white" stroke="#1E73B7" stroke-width="4"/><rect x="630" y="900" width="500" height="350" rx="24" fill="white" stroke="#B44A3C" stroke-width="4"/><text x="95" y="955" font-family="Arial" font-size="29" font-weight="700" fill="#1E73B7">Rim normal</text><text x="95" y="1015" font-family="Arial" font-size="24" fill="#23384E">• reabsorve HCO₃⁻ filtrado</text><text x="95" y="1065" font-family="Arial" font-size="24" fill="#23384E">• gera NH₄⁺</text><text x="95" y="1115" font-family="Arial" font-size="24" fill="#23384E">• excreta ácido titulável</text><text x="655" y="955" font-family="Arial" font-size="29" font-weight="700" fill="#B44A3C">Doença renal</text><text x="655" y="1015" font-family="Arial" font-size="24" fill="#23384E">• ↓ amoniogênese</text><text x="655" y="1065" font-family="Arial" font-size="24" fill="#23384E">• retenção de sulfato/fosfato</text><text x="655" y="1115" font-family="Arial" font-size="24" fill="#23384E">• acidose hiperclorêmica ou AG alto</text><text x="600" y="1360" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102A56">PaCO₂ esperada ≈ 1,5 × HCO₃⁻ + 8 ± 2</text><rect x="40" y="1490" width="1120" height="76" rx="18" fill="#083B66"/><text x="65" y="1538" font-family="Arial" font-size="23" fill="white">Falha de excreção ácida e menor geração de bicarbonato</text></svg>