<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0F2F5F"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · CARDIOLOGIA AVANÇADA</text><text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="#0F2F5F">Choque cardiogênico</text><path d="M500 430C420 360 290 430 310 580c20 180 210 290 290 380 80-90 270-200 290-380 20-150-110-220-190-150-50-75-150-75-200 0Z" fill="#A85A52" stroke="#0F2F5F" stroke-width="8"/><circle cx="210" cy="720" r="110" fill="#DCEAF5" stroke="#2F6FAE" stroke-width="7"/><circle cx="990" cy="720" r="110" fill="#F8E6D2" stroke="#D65A4A" stroke-width="7"/><text x="210" y="710" text-anchor="middle" font-size="28" font-weight="700" fill="#0F2F5F">HIPOPERFUSÃO</text><text x="210" y="755" text-anchor="middle" font-size="27" fill="#383F47">lactato ↑</text><text x="990" y="710" text-anchor="middle" font-size="28" font-weight="700" fill="#0F2F5F">CONGESTÃO</text><text x="990" y="755" text-anchor="middle" font-size="27" fill="#383F47">pressões ↑</text><text x="120" y="1080" font-family="Arial" font-size="34" fill="#383F47">• Falência da bomba reduz o débito cardíaco</text><text x="120" y="1150" font-family="Arial" font-size="34" fill="#383F47">• Hipoperfusão produz acidose e lactato</text><text x="120" y="1220" font-family="Arial" font-size="34" fill="#383F47">• Pressões elevadas causam congestão pulmonar</text><text x="120" y="1290" font-family="Arial" font-size="34" fill="#383F47">• Reperfusão e suporte circulatório tratam a causa</text><rect y="1480" width="1200" height="120" fill="#0F2F5F"/><text x="55" y="1545" font-family="Arial" font-size="28" fill="white">HEX-A038-378 · Choque por falência da bomba</text></svg>