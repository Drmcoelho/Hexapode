<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#0F2F5F"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · CARDIOLOGIA AVANÇADA</text><text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="#0F2F5F">Ecocardiograma: janelas básicas</text><path d="M600 390C440 390 345 540 345 850h510c0-310-95-460-255-460Z" fill="#F5D8C5" stroke="#0F2F5F" stroke-width="7"/><circle cx="480" cy="560" r="28" fill="#2F6FAE"/><circle cx="690" cy="560" r="28" fill="#0F7F7A"/><circle cx="520" cy="790" r="28" fill="#D65A4A"/><circle cx="700" cy="790" r="28" fill="#F0B148"/><path d="M480 560L170 430M690 560l340-130M520 790L170 980M700 790l330 190" stroke="#383F47" stroke-width="5" stroke-dasharray="12 10"/><text x="100" y="400" font-family="Arial" font-size="30" fill="#0F2F5F">Paraesternal longa</text><text x="780" y="400" font-family="Arial" font-size="30" fill="#0F2F5F">Paraesternal curta</text><text x="90" y="1030" font-family="Arial" font-size="30" fill="#0F2F5F">Apical 4 câmaras</text><text x="820" y="1030" font-family="Arial" font-size="30" fill="#0F2F5F">Subcostal</text><text x="120" y="1140" font-family="Arial" font-size="34" fill="#383F47">• A posição e a orientação do marcador definem o plano</text><text x="120" y="1210" font-family="Arial" font-size="34" fill="#383F47">• Cada janela responde perguntas anatômicas diferentes</text><text x="120" y="1280" font-family="Arial" font-size="34" fill="#383F47">• VCI e derrame pericárdico são acessíveis por subcostal</text><rect y="1480" width="1200" height="120" fill="#0F2F5F"/><text x="55" y="1545" font-family="Arial" font-size="28" fill="white">HEX-A038-379 · Aquisição ecocardiográfica</text></svg>