<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Noradrenalina avançada</title><desc id="d">Mecanismo alfa-1 predominante, efeitos hemodinâmicos e riscos da noradrenalina.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="130" fill="#12365B"/><text x="55" y="60" font-family="Arial" font-size="25" font-weight="700" fill="white">HEXÁPODE · FARMACOLOGIA AVANÇADA</text><text x="55" y="105" font-family="Arial" font-size="22" fill="#D9EEF0">HEX-A035-341</text><text x="60" y="220" font-family="Georgia" font-size="58" font-weight="700" fill="#12365B">Noradrenalina avançada</text><text x="60" y="275" font-family="Arial" font-size="28" fill="#0F7C83">Vasopressor α1 predominante com suporte β1</text><text x="60" y="350" font-family="Arial" font-size="26" font-weight="700" fill="#383F47">MECANISMO EM SEQUÊNCIA</text><g font-family="Arial" text-anchor="middle"><circle cx="210" cy="500" r="110" fill="#FFFDF8" stroke="#0F7C83" stroke-width="8"/><text x="210" y="492" font-size="30" font-weight="700" fill="#0F7C83">α1 vascular</text><text x="210" y="530" font-size="22" fill="#383F47">arteríolas + veias</text><line x1="330" y1="500" x2="475" y2="500" stroke="#F0A23A" stroke-width="10"/><polygon points="475,500 438,478 438,522" fill="#F0A23A"/><circle cx="600" cy="500" r="110" fill="#FFFDF8" stroke="#2F6FAE" stroke-width="8"/><text x="600" y="492" font-size="29" font-weight="700" fill="#2F6FAE">Vasoconstrição</text><text x="600" y="530" font-size="22" fill="#383F47">↑ tônus vascular</text><line x1="720" y1="500" x2="865" y2="500" stroke="#F0A23A" stroke-width="10"/><polygon points="865,500 828,478 828,522" fill="#F0A23A"/><circle cx="990" cy="500" r="110" fill="#FFFDF8" stroke="#4D9B75" stroke-width="8"/><text x="990" y="488" font-size="28" font-weight="700" fill="#4D9B75">↑ RVS</text><text x="990" y="528" font-size="28" font-weight="700" fill="#4D9B75">↑ PAM</text></g><rect x="55" y="680" width="525" height="500" rx="28" fill="#FFFDF8" stroke="#D8D1C5" stroke-width="3"/><rect x="620" y="680" width="525" height="500" rx="28" fill="#FFFDF8" stroke="#D8D1C5" stroke-width="3"/><text x="90" y="745" font-family="Arial" font-size="27" font-weight="700" fill="#4D9B75">EFEITOS CLÍNICOS</text><g font-family="Arial" font-size="24" fill="#383F47"><text x="90" y="810">• ↑ retorno venoso e pressão de perfusão</text><text x="90" y="860">• β1 pode sustentar contratilidade</text><text x="90" y="910">• melhora PAM em vasoplegia</text><text x="90" y="960">• fluxo periférico pode cair</text></g><text x="655" y="745" font-family="Arial" font-size="27" font-weight="700" fill="#D65A4A">CUIDADOS E RISCOS</text><g font-family="Arial" font-size="24" fill="#383F47"><text x="655" y="810">• titular por perfusão, não só pressão</text><text x="655" y="860">• extravasamento e necrose</text><text x="655" y="910">• isquemia digital/mesentérica</text><text x="655" y="960">• arritmias em doses altas</text></g><rect x="55" y="1225" width="1090" height="225" rx="24" fill="#EAF3F3" stroke="#0F7C83" stroke-width="3"/><text x="90" y="1285" font-family="Arial" font-size="26" font-weight="700" fill="#0F7C83">LEITURA PRÁTICA</text><text x="90" y="1340" font-family="Arial" font-size="23" fill="#383F47">O alvo é restaurar perfusão orgânica com a menor dose eficaz, corrigindo simultaneamente causa, volume e função cardíaca.</text><text x="55" y="1530" font-family="Arial" font-size="21" fill="#383F47">Origem: HEX-G015-141 · Consumidores: Emergências, Cardio, UTI, Farmacologia, Nefrologia</text></svg>