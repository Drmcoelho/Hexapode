<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Adrenalina avançada</title><desc id="d">Efeitos alfa e beta dependentes da dose, uso na anafilaxia e riscos.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="130" fill="#12365B"/><text x="55" y="60" font-family="Arial" font-size="25" font-weight="700" fill="white">HEXÁPODE · FARMACOLOGIA AVANÇADA</text><text x="55" y="105" font-family="Arial" font-size="22" fill="#D9EEF0">HEX-A035-342</text><text x="60" y="220" font-family="Georgia" font-size="58" font-weight="700" fill="#12365B">Adrenalina avançada</text><text x="60" y="275" font-family="Arial" font-size="28" fill="#0F7C83">Agonista α1, β1 e β2 dependente da dose</text><g font-family="Arial" text-anchor="middle"><circle cx="220" cy="500" r="110" fill="#FFFDF8" stroke="#0F7C83" stroke-width="8"/><text x="220" y="485" font-size="34" font-weight="700" fill="#0F7C83">β2</text><text x="220" y="530" font-size="23" fill="#383F47">broncodilatação</text><circle cx="600" cy="500" r="110" fill="#FFFDF8" stroke="#2F6FAE" stroke-width="8"/><text x="600" y="485" font-size="34" font-weight="700" fill="#2F6FAE">β1</text><text x="600" y="530" font-size="23" fill="#383F47">↑ inotropismo</text><circle cx="980" cy="500" r="110" fill="#FFFDF8" stroke="#D65A4A" stroke-width="8"/><text x="980" y="485" font-size="34" font-weight="700" fill="#D65A4A">α1</text><text x="980" y="530" font-size="23" fill="#383F47">vasoconstrição</text><path d="M330 500H480M710 500H860" stroke="#F0A23A" stroke-width="10"/><polygon points="480,500 445,478 445,522" fill="#F0A23A"/><polygon points="860,500 825,478 825,522" fill="#F0A23A"/></g><rect x="55" y="680" width="525" height="500" rx="28" fill="#FFFDF8" stroke="#D8D1C5" stroke-width="3"/><rect x="620" y="680" width="525" height="500" rx="28" fill="#FFFDF8" stroke="#D8D1C5" stroke-width="3"/><text x="90" y="745" font-family="Arial" font-size="27" font-weight="700" fill="#4D9B75">EFEITOS E INDICAÇÕES</text><g font-family="Arial" font-size="24" fill="#383F47"><text x="90" y="810">• anafilaxia: primeira linha IM</text><text x="90" y="860">• PCR: vasopressor e β1</text><text x="90" y="910">• broncodilatação por β2</text><text x="90" y="960">• ↑ pressão e débito conforme dose</text></g><text x="655" y="745" font-family="Arial" font-size="27" font-weight="700" fill="#D65A4A">CUIDADOS E RISCOS</text><g font-family="Arial" font-size="24" fill="#383F47"><text x="655" y="810">• arritmia e isquemia</text><text x="655" y="860">• lactato pode subir por β2</text><text x="655" y="910">• hiperglicemia e hipocalemia</text><text x="655" y="960">• conferir via e concentração</text></g><rect x="55" y="1225" width="1090" height="225" rx="24" fill="#EAF3F3" stroke="#0F7C83" stroke-width="3"/><text x="90" y="1285" font-family="Arial" font-size="26" font-weight="700" fill="#0F7C83">LEITURA PRÁTICA</text><text x="90" y="1340" font-family="Arial" font-size="23" fill="#383F47">A mesma molécula produz fenótipos diferentes conforme dose, via, concentração e reserva cardiovascular.</text><text x="55" y="1530" font-family="Arial" font-size="21" fill="#383F47">Origem: HEX-G015-142 · Consumidores: Emergências, Cardio, Alergia, UTI, Farmacologia</text></svg>