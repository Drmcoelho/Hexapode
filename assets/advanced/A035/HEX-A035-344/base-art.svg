<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Vasopressina avançada</title><desc id="d">Ativação V1, vasoconstrição não adrenérgica e riscos isquêmicos.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="130" fill="#12365B"/><text x="55" y="62" font-family="Arial" font-size="25" font-weight="700" fill="white">HEXÁPODE · FARMACOLOGIA AVANÇADA</text><text x="55" y="106" font-family="Arial" font-size="22" fill="#D9EEF0">HEX-A035-344</text><text x="60" y="220" font-family="Georgia" font-size="58" font-weight="700" fill="#12365B">Vasopressina avançada</text><text x="60" y="275" font-family="Arial" font-size="28" fill="#0F7C83">Vasoconstrição V1 não adrenérgica</text><g font-family="Arial" text-anchor="middle"><circle cx="210" cy="500" r="110" fill="#FFFDF8" stroke="#0F7C83" stroke-width="8"/><text x="210" y="500" font-size="34" font-weight="700" fill="#0F7C83">V1</text><circle cx="600" cy="500" r="110" fill="#FFFDF8" stroke="#2F6FAE" stroke-width="8"/><text x="600" y="480" font-size="29" font-weight="700" fill="#2F6FAE">PLC / IP3</text><text x="600" y="525" font-size="24" fill="#383F47">↑ Ca²⁺</text><circle cx="990" cy="500" r="110" fill="#FFFDF8" stroke="#4D9B75" stroke-width="8"/><text x="990" y="480" font-size="27" font-weight="700" fill="#4D9B75">Contração</text><text x="990" y="525" font-size="23" fill="#383F47">vascular</text><path d="M330 500H480M720 500H870" stroke="#F0A23A" stroke-width="10"/><polygon points="480,500 445,478 445,522" fill="#F0A23A"/><polygon points="870,500 835,478 835,522" fill="#F0A23A"/></g><rect x="55" y="680" width="525" height="500" rx="28" fill="#FFFDF8" stroke="#D8D1C5" stroke-width="3"/><rect x="620" y="680" width="525" height="500" rx="28" fill="#FFFDF8" stroke="#D8D1C5" stroke-width="3"/><text x="90" y="745" font-family="Arial" font-size="27" font-weight="700" fill="#4D9B75">EFEITOS</text><g font-family="Arial" font-size="24" fill="#383F47"><text x="90" y="810">• ↑ tônus vascular</text><text x="90" y="860">• pouco efeito cronotrópico</text><text x="90" y="910">• reduz necessidade de catecolamina</text><text x="90" y="960">• ação útil em vasoplegia</text></g><text x="655" y="745" font-family="Arial" font-size="27" font-weight="700" fill="#D65A4A">RISCOS</text><g font-family="Arial" font-size="24" fill="#383F47"><text x="655" y="810">• isquemia digital e mesentérica</text><text x="655" y="860">• débito pode cair se pós-carga excessiva</text><text x="655" y="910">• dose fixa no choque séptico</text><text x="655" y="960">• não usar bolus de rotina</text></g><rect x="55" y="1225" width="1090" height="225" rx="24" fill="#EAF3F3" stroke="#0F7C83" stroke-width="3"/><text x="90" y="1290" font-family="Arial" font-size="25" font-weight="700" fill="#0F7C83">LEITURA PRÁTICA</text><text x="90" y="1350" font-family="Arial" font-size="23" fill="#383F47">Complementa a noradrenalina por via não adrenérgica, mas não substitui avaliação de fluxo, volume e perfusão periférica.</text><text x="55" y="1530" font-family="Arial" font-size="21" fill="#383F47">Origem: HEX-G015-144 · Emergências, UTI, Cardio, Nefrologia, Farmacologia</text></svg>