<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Compensações esperadas</title><desc id="d">Fluxograma para distinguir compensação adequada de distúrbio misto.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#083B66"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · GASOMETRIA AVANÇADA</text><text x="55" y="190" font-family="Georgia" font-size="52" font-weight="700" fill="#102A54">Compensações esperadas</text><rect x="210" y="310" width="780" height="150" rx="28" fill="#EAF1F8" stroke="#2D6AA3" stroke-width="4"/><text x="600" y="375" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#102A54">Distúrbio primário identificado</text><text x="600" y="420" text-anchor="middle" font-family="Arial" font-size="25" fill="#33495F">Calcule a resposta compensatória prevista</text><path d="M600 460 V590 M600 590 H320 V680 M600 590 H880 V680" fill="none" stroke="#169C92" stroke-width="9"/><rect x="80" y="680" width="480" height="420" rx="28" fill="#E7F4F2" stroke="#169C92" stroke-width="4"/><rect x="640" y="680" width="480" height="420" rx="28" fill="#FBE5E1" stroke="#C84A3D" stroke-width="4"/><g font-family="Arial"><text x="320" y="755" text-anchor="middle" font-size="32" font-weight="700" fill="#102A54">Adequada</text><text x="880" y="755" text-anchor="middle" font-size="32" font-weight="700" fill="#102A54">Inadequada</text><g font-size="27" fill="#33495F"><text x="130" y="840">• Direção correta</text><text x="130" y="900">• Magnitude compatível</text><text x="130" y="960">• Distúrbio simples provável</text><text x="690" y="840">• Ausente ou excessiva</text><text x="690" y="900">• Fora da faixa prevista</text><text x="690" y="960">• Distúrbio misto provável</text></g></g><rect x="120" y="1210" width="960" height="170" rx="24" fill="#FFF8E8" stroke="#D9A12E" stroke-width="4"/><text x="600" y="1270" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102A54">Use a regra específica do distúrbio.</text><text x="600" y="1320" text-anchor="middle" font-family="Arial" font-size="25" fill="#33495F">Winter, compensação respiratória aguda/crônica ou metabólica.</text><text x="55" y="1540" font-family="Arial" font-size="24" font-weight="700" fill="#083B66">HEX-A032-313</text></svg>