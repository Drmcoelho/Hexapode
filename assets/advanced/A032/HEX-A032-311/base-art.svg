<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Interpretação sistemática da gasometria</title><desc id="d">Algoritmo visual em seis passos para interpretar gasometria arterial.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#083B66"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · GASOMETRIA AVANÇADA</text><text x="55" y="190" font-family="Georgia" font-size="52" font-weight="700" fill="#102A54">Interpretação sistemática</text><text x="55" y="238" font-family="Arial" font-size="25" fill="#526579">Leia em sequência; não interprete valores isolados.</text><g font-family="Arial"><g fill="#169C92"><circle cx="120" cy="370" r="48"/><circle cx="120" cy="555" r="48"/><circle cx="120" cy="740" r="48"/><circle cx="120" cy="925" r="48"/><circle cx="120" cy="1110" r="48"/><circle cx="120" cy="1295" r="48"/></g><g fill="white" font-size="32" font-weight="700" text-anchor="middle"><text x="120" y="381">1</text><text x="120" y="566">2</text><text x="120" y="751">3</text><text x="120" y="936">4</text><text x="120" y="1121">5</text><text x="120" y="1306">6</text></g><g fill="#fff" stroke="#B9C7D6" stroke-width="3"><rect x="210" y="315" width="880" height="110" rx="22"/><rect x="210" y="500" width="880" height="110" rx="22"/><rect x="210" y="685" width="880" height="110" rx="22"/><rect x="210" y="870" width="880" height="110" rx="22"/><rect x="210" y="1055" width="880" height="110" rx="22"/><rect x="210" y="1240" width="880" height="110" rx="22"/></g><g fill="#102A54" font-size="30" font-weight="700"><text x="250" y="365">pH: acidemia ou alcalemia</text><text x="250" y="550">PaCO₂: componente respiratório</text><text x="250" y="735">HCO₃⁻: componente metabólico</text><text x="250" y="920">Compensação: simples ou misto?</text><text x="250" y="1105">Oxigenação: PaO₂, P/F e A–a</text><text x="250" y="1290">Ânion gap: quando houver acidose</text></g></g><text x="55" y="1540" font-family="Arial" font-size="24" font-weight="700" fill="#083B66">HEX-A032-311</text></svg>