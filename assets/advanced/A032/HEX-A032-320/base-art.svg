<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Lactato e depuração</title><desc id="d">Produção, depuração e interpretação seriada do lactato.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#083B66"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · GASOMETRIA AVANÇADA</text><text x="55" y="190" font-family="Georgia" font-size="54" font-weight="700" fill="#102A54">Lactato e depuração</text><rect x="90" y="350" width="280" height="260" rx="30" fill="#FBE5E1" stroke="#C84A3D" stroke-width="4"/><text x="230" y="420" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#102A54">TECIDOS</text><g fill="#E58C7E" stroke="#C84A3D" stroke-width="2"><circle cx="165" cy="495" r="25"/><circle cx="230" cy="495" r="25"/><circle cx="295" cy="495" r="25"/><circle cx="165" cy="555" r="25"/><circle cx="230" cy="555" r="25"/><circle cx="295" cy="555" r="25"/></g><line x1="380" y1="480" x2="520" y2="480" stroke="#C84A3D" stroke-width="10"/><polygon points="540,480 502,458 502,502" fill="#C84A3D"/><text x="455" y="445" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#C84A3D">lactato</text><path d="M540 400 C690 300 860 350 930 500 C850 650 690 680 540 570 Z" fill="#D98A54" stroke="#9E5E32" stroke-width="7"/><text x="735" y="520" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="white">FÍGADO</text><rect x="70" y="760" width="510" height="390" rx="28" fill="#FBE5E1" stroke="#C84A3D" stroke-width="4"/><rect x="620" y="760" width="510" height="390" rx="28" fill="#E7F4F2" stroke="#169C92" stroke-width="4"/><g font-family="Arial"><text x="325" y="835" text-anchor="middle" font-size="31" font-weight="700" fill="#102A54">Produção aumentada</text><text x="875" y="835" text-anchor="middle" font-size="31" font-weight="700" fill="#102A54">Depuração reduzida</text><g font-size="26" fill="#33495F"><text x="120" y="920">• Hipoperfusão</text><text x="120" y="980">• Estímulo beta-adrenérgico</text><text x="120" y="1040">• Convulsões e esforço</text><text x="670" y="920">• Disfunção hepática</text><text x="670" y="980">• Hipoperfusão do fígado</text><text x="670" y="1040">• Disfunção renal relevante</text></g></g><rect x="130" y="1240" width="940" height="150" rx="24" fill="#EAF1F8" stroke="#2D6AA3" stroke-width="4"/><text x="600" y="1300" text-anchor="middle" font-family="Georgia" font-size="34" font-weight="700" fill="#102A54">Clearance = (inicial − atual) ÷ inicial × 100</text><text x="600" y="1350" text-anchor="middle" font-family="Arial" font-size="24" fill="#33495F">Interprete tendência, tempo e contexto; não apenas um valor.</text><text x="55" y="1540" font-family="Arial" font-size="24" font-weight="700" fill="#083B66">HEX-A032-320</text></svg>