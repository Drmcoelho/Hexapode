<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Fórmula de Winter</title><desc id="d">Gráfico da faixa esperada de PaCO2 na acidose metabólica.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#083B66"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · GASOMETRIA AVANÇADA</text><text x="55" y="190" font-family="Georgia" font-size="54" font-weight="700" fill="#102A54">Fórmula de Winter</text><rect x="120" y="300" width="960" height="135" rx="26" fill="#E7F4F2" stroke="#169C92" stroke-width="4"/><text x="600" y="385" text-anchor="middle" font-family="Georgia" font-size="42" font-weight="700" fill="#102A54">PaCO₂ esperada = 1,5 × HCO₃⁻ + 8 ± 2</text><line x1="190" y1="1120" x2="1030" y2="1120" stroke="#33495F" stroke-width="5"/><line x1="190" y1="1120" x2="190" y2="530" stroke="#33495F" stroke-width="5"/><polygon points="260,1050 910,620 980,710 330,1140" fill="#BFE3DC"/><line x1="290" y1="1090" x2="950" y2="665" stroke="#169C92" stroke-width="9"/><g fill="#102A54"><circle cx="390" cy="1015" r="12"/><circle cx="500" cy="935" r="12"/><circle cx="620" cy="870" r="12"/><circle cx="740" cy="780" r="12"/><circle cx="850" cy="735" r="12"/></g><text x="610" y="1190" text-anchor="middle" font-family="Arial" font-size="25" fill="#33495F">HCO₃⁻ (mEq/L)</text><text x="90" y="825" text-anchor="middle" transform="rotate(-90 90 825)" font-family="Arial" font-size="25" fill="#33495F">PaCO₂ (mmHg)</text><rect x="120" y="1260" width="960" height="160" rx="24" fill="#FFF8E8" stroke="#D9A12E" stroke-width="4"/><text x="160" y="1320" font-family="Arial" font-size="27" font-weight="700" fill="#102A54">Acima da faixa:</text><text x="420" y="1320" font-family="Arial" font-size="27" fill="#33495F">acidose respiratória associada</text><text x="160" y="1370" font-family="Arial" font-size="27" font-weight="700" fill="#102A54">Abaixo da faixa:</text><text x="420" y="1370" font-family="Arial" font-size="27" fill="#33495F">alcalose respiratória associada</text><text x="55" y="1540" font-family="Arial" font-size="24" font-weight="700" fill="#083B66">HEX-A032-314</text></svg>