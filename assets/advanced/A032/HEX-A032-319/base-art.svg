<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Conteúdo arterial e oferta de oxigênio</title><desc id="d">Relação entre hemoglobina, saturação, PaO2, CaO2 e débito cardíaco.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#083B66"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · GASOMETRIA AVANÇADA</text><text x="55" y="190" font-family="Georgia" font-size="48" font-weight="700" fill="#102A54">Conteúdo arterial e oferta de O₂</text><rect x="80" y="300" width="1040" height="130" rx="26" fill="#EAF1F8" stroke="#2D6AA3" stroke-width="4"/><text x="600" y="382" text-anchor="middle" font-family="Georgia" font-size="36" font-weight="700" fill="#102A54">CaO₂ = 1,34 × Hb × SaO₂ + 0,003 × PaO₂</text><ellipse cx="310" cy="700" rx="190" ry="120" fill="#D95B4E" stroke="#9E302A" stroke-width="8"/><ellipse cx="310" cy="700" rx="90" ry="42" fill="#B73F36" opacity=".55"/><rect x="560" y="530" width="540" height="380" rx="28" fill="#fff" stroke="#B9C7D6" stroke-width="4"/><text x="830" y="600" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#102A54">Determinantes do CaO₂</text><g font-family="Arial" font-size="27" fill="#33495F"><text x="610" y="690">• Hemoglobina: principal reserva</text><text x="610" y="760">• Saturação: Hb ocupada por O₂</text><text x="610" y="830">• PaO₂: pequena fração dissolvida</text></g><line x1="600" y1="950" x2="600" y2="1060" stroke="#169C92" stroke-width="10"/><polygon points="600,1080 578,1042 622,1042" fill="#169C92"/><rect x="120" y="1080" width="960" height="140" rx="26" fill="#E7F4F2" stroke="#169C92" stroke-width="4"/><text x="600" y="1165" text-anchor="middle" font-family="Georgia" font-size="43" font-weight="700" fill="#102A54">DO₂ = débito cardíaco × CaO₂ × 10</text><rect x="120" y="1300" width="960" height="130" rx="24" fill="#FFF8E8" stroke="#D9A12E" stroke-width="4"/><text x="600" y="1375" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#102A54">PaO₂ normal não garante DO₂ adequada se Hb ou débito estiverem baixos.</text><text x="55" y="1540" font-family="Arial" font-size="24" font-weight="700" fill="#083B66">HEX-A032-319</text></svg>