<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Ânion gap e causas</title><desc id="d">Cálculo, correção e causas de acidose metabólica por ânion gap.</desc><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="110" fill="#083B66"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700" fill="white">HEXÁPODE · GASOMETRIA AVANÇADA</text><text x="55" y="190" font-family="Georgia" font-size="54" font-weight="700" fill="#102A54">Ânion gap e causas</text><rect x="130" y="300" width="940" height="130" rx="26" fill="#EAF1F8" stroke="#2D6AA3" stroke-width="4"/><text x="600" y="382" text-anchor="middle" font-family="Georgia" font-size="43" font-weight="700" fill="#102A54">AG = Na⁺ − (Cl⁻ + HCO₃⁻)</text><rect x="70" y="520" width="510" height="500" rx="28" fill="#FBE5E1" stroke="#C84A3D" stroke-width="4"/><rect x="620" y="520" width="510" height="500" rx="28" fill="#E7F4F2" stroke="#169C92" stroke-width="4"/><g font-family="Arial"><text x="325" y="595" text-anchor="middle" font-size="32" font-weight="700" fill="#102A54">AG aumentado</text><text x="875" y="595" text-anchor="middle" font-size="32" font-weight="700" fill="#102A54">AG normal</text><g font-size="28" fill="#33495F"><text x="120" y="690">• Lactato</text><text x="120" y="750">• Cetoácidos</text><text x="120" y="810">• Uremia</text><text x="120" y="870">• Toxinas</text><text x="120" y="930">• Falha na excreção ácida</text><text x="670" y="690">• Diarreia</text><text x="670" y="750">• Acidose tubular renal</text><text x="670" y="810">• Fístulas digestivas</text><text x="670" y="870">• Cloreto excessivo</text><text x="670" y="930">• Perda de bicarbonato</text></g></g><rect x="110" y="1110" width="980" height="240" rx="26" fill="#FFF8E8" stroke="#D9A12E" stroke-width="4"/><text x="600" y="1180" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#102A54">Corrija pela albumina</text><text x="600" y="1240" text-anchor="middle" font-family="Arial" font-size="29" fill="#33495F">AG corrigido ≈ AG medido + 2,5 × (4 − albumina)</text><text x="600" y="1295" text-anchor="middle" font-family="Arial" font-size="25" fill="#33495F">Hipoalbuminemia pode mascarar AG elevado.</text><text x="55" y="1540" font-family="Arial" font-size="24" font-weight="700" fill="#083B66">HEX-A032-315</text></svg>