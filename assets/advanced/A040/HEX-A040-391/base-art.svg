<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Sinalização celular e segundos mensageiros</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="190" fill="#073763"/><text x="60" y="80" font-size="28" fill="#DDEAF2">HEXÁPODE · Biblioteca Universal Avançada</text><text x="60" y="145" font-size="44" font-weight="700" fill="white">Sinalização celular e segundos mensageiros</text><g font-family="Arial" text-anchor="middle"><g fill="#1D4E7A"><circle cx="150" cy="650" r="58"/><circle cx="330" cy="820" r="58"/><circle cx="510" cy="650" r="58"/><circle cx="690" cy="820" r="58"/><circle cx="870" cy="650" r="58"/><circle cx="1050" cy="820" r="58"/></g><g font-size="24" fill="#073763"><text x="150" y="750">Ligante</text><text x="330" y="920">Receptor</text><text x="510" y="750">Proteína G</text><text x="690" y="920">AMPc</text><text x="870" y="750">Ca²⁺</text><text x="1050" y="920">Resposta</text></g><g stroke="#0F8683" stroke-width="8" fill="none"><path d="M210 670 C250 710 270 760 290 790"/><path d="M390 790 C430 750 450 700 470 670"/><path d="M570 670 C610 710 630 760 650 790"/><path d="M750 790 C790 750 810 700 830 670"/><path d="M930 670 C970 710 990 760 1010 790"/></g><text x="600" y="1120" font-size="32" font-weight="700" fill="#073763">Receptor → transdução → amplificação → resposta → desligamento</text><rect x="100" y="1210" width="1000" height="210" rx="28" fill="white" stroke="#B8C8D6" stroke-width="4"/><text x="600" y="1290" font-size="28" fill="#383F47">O mesmo sinal extracelular pode produzir respostas diferentes</text><text x="600" y="1340" font-size="28" fill="#383F47">conforme o receptor, a célula e o circuito intracelular.</text></g><rect y="1505" width="1200" height="95" fill="#073763"/><text x="55" y="1565" font-size="25" fill="white">HEX-A040-391 · Uso educacional · Revisão clínica pendente</text></svg>