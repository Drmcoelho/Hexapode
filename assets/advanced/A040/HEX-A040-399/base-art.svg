<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Escalas clínicas e incerteza de medida</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="190" fill="#073763"/><text x="60" y="80" font-size="28" fill="#DDEAF2">HEXÁPODE · Biblioteca Universal Avançada</text><text x="60" y="145" font-size="44" font-weight="700" fill="white">Escalas clínicas e incerteza de medida</text><g font-family="Arial"><path d="M120 650 H1080" stroke="#1D4E7A" stroke-width="14"/><rect x="120" y="600" width="300" height="100" fill="#4DA06B" opacity=".7"/><rect x="420" y="600" width="360" height="100" fill="#F0B148" opacity=".7"/><rect x="780" y="600" width="300" height="100" fill="#D65A4A" opacity=".7"/><text x="270" y="760" text-anchor="middle" font-size="28" fill="#073763">Baixo</text><text x="600" y="760" text-anchor="middle" font-size="28" fill="#073763">Zona cinzenta</text><text x="930" y="760" text-anchor="middle" font-size="28" fill="#073763">Alto</text><path d="M500 520 V800 M760 520 V800" stroke="#073763" stroke-width="6" stroke-dasharray="15 10"/><text x="500" y="470" text-anchor="middle" font-size="25" fill="#383F47">Ponto de corte A</text><text x="760" y="470" text-anchor="middle" font-size="25" fill="#383F47">Ponto de corte B</text><rect x="100" y="930" width="1000" height="360" rx="28" fill="white" stroke="#B8C8D6" stroke-width="4"/><g font-size="28" fill="#383F47"><text x="150" y="1010">• Sensibilidade: detectar quem tem a condição</text><text x="150" y="1070">• Especificidade: excluir quem não tem</text><text x="150" y="1130">• Tendência seriada reduz o ruído de uma medida isolada</text><text x="150" y="1190">• Contexto pré-teste modifica o significado do resultado</text></g><text x="600" y="1400" text-anchor="middle" font-size="30" font-weight="700" fill="#073763">Pontos de corte ajudam; contexto clínico decide.</text></g><rect y="1505" width="1200" height="95" fill="#073763"/><text x="55" y="1565" font-size="25" fill="white">HEX-A040-399 · Uso educacional · Revisão clínica pendente</text></svg>