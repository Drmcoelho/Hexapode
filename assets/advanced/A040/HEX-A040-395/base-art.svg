<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Inflamação aguda e crônica</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="190" fill="#073763"/><text x="60" y="80" font-size="28" fill="#DDEAF2">HEXÁPODE · Biblioteca Universal Avançada</text><text x="60" y="145" font-size="44" font-weight="700" fill="white">Inflamação aguda e crônica</text><g font-family="Arial"><rect x="80" y="300" width="500" height="1020" rx="30" fill="#FFF1EB" stroke="#D65A4A" stroke-width="5"/><rect x="620" y="300" width="500" height="1020" rx="30" fill="#EEF6F1" stroke="#4DA06B" stroke-width="5"/><text x="330" y="380" text-anchor="middle" font-size="36" font-weight="700" fill="#D65A4A">Aguda</text><text x="870" y="380" text-anchor="middle" font-size="36" font-weight="700" fill="#4DA06B">Crônica</text><circle cx="330" cy="600" r="115" fill="#E7C8E8" stroke="#7A5AA6" stroke-width="6"/><circle cx="870" cy="600" r="115" fill="#C7DFD0" stroke="#4DA06B" stroke-width="6"/><text x="330" y="610" text-anchor="middle" font-size="30" fill="#073763">Neutrófilo</text><text x="870" y="610" text-anchor="middle" font-size="30" fill="#073763">Macrófago</text><g font-size="27" fill="#383F47"><text x="130" y="800">• minutos a dias</text><text x="130" y="855">• edema e exsudato</text><text x="130" y="910">• mediadores pré-formados</text><text x="130" y="965">• resolução frequente</text><text x="670" y="800">• semanas a anos</text><text x="670" y="855">• infiltrado mononuclear</text><text x="670" y="910">• reparo e remodelamento</text><text x="670" y="965">• fibrose possível</text></g><text x="600" y="1410" text-anchor="middle" font-size="29" font-weight="700" fill="#073763">Persistência do estímulo transforma defesa em dano tecidual.</text></g><rect y="1505" width="1200" height="95" fill="#073763"/><text x="55" y="1565" font-size="25" fill="white">HEX-A040-395 · Uso educacional · Revisão clínica pendente</text></svg>