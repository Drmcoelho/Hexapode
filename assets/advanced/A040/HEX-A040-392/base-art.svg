<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Arquitetura tecidual e matriz extracelular</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="190" fill="#073763"/><text x="60" y="80" font-size="28" fill="#DDEAF2">HEXÁPODE · Biblioteca Universal Avançada</text><text x="60" y="145" font-size="44" font-weight="700" fill="white">Arquitetura tecidual e matriz extracelular</text><g font-family="Arial"><text x="90" y="300" font-size="30" font-weight="700" fill="#073763">Epitélio</text><g fill="#E6B9A9" stroke="#D65A4A" stroke-width="4"><rect x="90" y="350" width="150" height="260" rx="55"/><rect x="250" y="350" width="150" height="260" rx="55"/><rect x="410" y="350" width="150" height="260" rx="55"/><rect x="570" y="350" width="150" height="260" rx="55"/><rect x="730" y="350" width="150" height="260" rx="55"/><rect x="890" y="350" width="150" height="260" rx="55"/></g><path d="M80 650 H1120" stroke="#1D4E7A" stroke-width="18"/><text x="90" y="710" font-size="28" fill="#073763">Membrana basal</text><path d="M100 880 C250 730 350 1030 500 880 S750 730 900 880 S1080 1030 1120 860" fill="none" stroke="#4DA06B" stroke-width="18"/><g fill="#7A5AA6"><ellipse cx="270" cy="940" rx="80" ry="35" transform="rotate(-25 270 940)"/><ellipse cx="730" cy="940" rx="80" ry="35" transform="rotate(25 730 940)"/></g><text x="120" y="1100" font-size="30" font-weight="700" fill="#073763">Matriz = colágeno + proteoglicanos + água + sinais mecânicos</text><rect x="100" y="1180" width="1000" height="230" rx="28" fill="white" stroke="#B8C8D6" stroke-width="4"/><text x="140" y="1260" font-size="27" fill="#383F47">A função tecidual depende da organização das células,</text><text x="140" y="1310" font-size="27" fill="#383F47">da matriz, da vascularização e da integridade da membrana basal.</text></g><rect y="1505" width="1200" height="95" fill="#073763"/><text x="55" y="1565" font-size="25" fill="white">HEX-A040-392 · Uso educacional · Revisão clínica pendente</text></svg>