<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img"><title>Interação hospedeiro–patógeno</title><rect width="1200" height="1600" fill="#F7F4EC"/><rect width="1200" height="190" fill="#073763"/><text x="60" y="80" font-size="28" fill="#DDEAF2">HEXÁPODE · Biblioteca Universal Avançada</text><text x="60" y="145" font-size="44" font-weight="700" fill="white">Interação hospedeiro–patógeno</text><g font-family="Arial"><circle cx="330" cy="680" r="220" fill="#F3C3B5" stroke="#D65A4A" stroke-width="6"/><circle cx="870" cy="680" r="180" fill="#C7DFD0" stroke="#4DA06B" stroke-width="6"/><g fill="#7A5AA6"><circle cx="780" cy="590" r="28"/><circle cx="920" cy="600" r="28"/><circle cx="840" cy="730" r="28"/><circle cx="970" cy="760" r="28"/></g><path d="M550 680 H680" stroke="#1D4E7A" stroke-width="10"/><text x="330" y="690" text-anchor="middle" font-size="36" font-weight="700" fill="#073763">Hospedeiro</text><text x="870" y="900" text-anchor="middle" font-size="32" font-weight="700" fill="#073763">Patógeno</text><g font-size="28" fill="#383F47"><text x="130" y="1080">1. Adesão à superfície</text><text x="130" y="1140">2. Invasão ou toxinas</text><text x="130" y="1200">3. Evasão imune</text><text x="650" y="1080">Alvos antimicrobianos:</text><text x="650" y="1140">parede • membrana • ribossomo</text><text x="650" y="1200">ácidos nucleicos • metabolismo</text></g><rect x="100" y="1300" width="1000" height="120" rx="24" fill="white" stroke="#B8C8D6" stroke-width="4"/><text x="600" y="1375" text-anchor="middle" font-size="28" fill="#383F47">Virulência e defesa determinam colonização, doença ou eliminação.</text></g><rect y="1505" width="1200" height="95" fill="#073763"/><text x="55" y="1565" font-size="25" fill="white">HEX-A040-398 · Uso educacional · Revisão clínica pendente</text></svg>